<title>Amazon Ads Intelligence</title>
<meta name="description" content="Amazon Ads reporting and intelligence platform: import, validate, compare and export advertising performance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Design tokens — carried over from the prototype (white enterprise surface,
   blue/purple language, DM Sans), extended with a dark theme.
   ========================================================================== */
:root{
  --ink:#16233d; --ink-2:#24344e; --text:#40516c; --muted:#67758d; --muted-2:#8a97ab;
  --blue:#2469e8; --blue-soft:#eef5ff; --blue-line:#a9c4f5;
  --purple:#6c46d9; --purple-ink:#5a35c8; --purple-soft:#f3efff; --purple-line:#d9cef9;
  --green:#168456; --green-soft:#eaf9f1; --red:#d54955; --red-soft:#fff0f1; --amber:#a86207; --amber-soft:#fff6e6;
  --canvas:#eef3f9; --line:#dfe7f1; --line-2:#edf1f6; --card:#ffffff; --card-2:#fbfcfe; --card-3:#f7faff; --rail:#f8fbff;
  --shadow:0 5px 18px rgba(31,56,93,.055); --pop-shadow:0 14px 34px rgba(30,48,79,.16);
  --c1:#2f7bf5; --c2:#5b2bc0; --c3:#0f9e86; --c4:#e0892b; --c5:#c8427a; --c6:#7d8a2a; --c-other:#9aa6b6;
  --grid:#e5ebf3; --axis:#7a889c; --tip-bg:#16233d; --tip-ink:#fff;
  --range:#4a96ed; --range-ink:#fff; --cmp:#6c46d9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef8; --ink-2:#dbe4f2; --text:#b8c4d6; --muted:#93a1b8; --muted-2:#7c8aa1;
    --blue:#5a9df7; --blue-soft:#15243d; --blue-line:#2d4b7a;
    --purple:#a488f5; --purple-ink:#b9a3ff; --purple-soft:#211a3b; --purple-line:#3d3170;
    --green:#3cc58a; --green-soft:#12301f; --red:#f27b86; --red-soft:#3a1a1f; --amber:#f0b04b; --amber-soft:#35270f;
    --canvas:#0c1320; --line:#233046; --line-2:#1c2739; --card:#131c2c; --card-2:#172133; --card-3:#162238; --rail:#101827;
    --shadow:0 5px 18px rgba(0,0,0,.25); --pop-shadow:0 14px 34px rgba(0,0,0,.45);
    --c1:#5a9df7; --c2:#7c4ce6; --c3:#1fae93; --c4:#e08d36; --c5:#e0609a; --c6:#98a83a; --c-other:#5f6d82;
    --grid:#223047; --axis:#8795ab; --tip-bg:#e8eef8; --tip-ink:#101827; --range:#3b82e6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8eef8; --ink-2:#dbe4f2; --text:#b8c4d6; --muted:#93a1b8; --muted-2:#7c8aa1;
  --blue:#5a9df7; --blue-soft:#15243d; --blue-line:#2d4b7a;
  --purple:#a488f5; --purple-ink:#b9a3ff; --purple-soft:#211a3b; --purple-line:#3d3170;
  --green:#3cc58a; --green-soft:#12301f; --red:#f27b86; --red-soft:#3a1a1f; --amber:#f0b04b; --amber-soft:#35270f;
  --canvas:#0c1320; --line:#233046; --line-2:#1c2739; --card:#131c2c; --card-2:#172133; --card-3:#162238; --rail:#101827;
  --shadow:0 5px 18px rgba(0,0,0,.25); --pop-shadow:0 14px 34px rgba(0,0,0,.45);
  --c1:#5a9df7; --c2:#7c4ce6; --c3:#1fae93; --c4:#e08d36; --c5:#e0609a; --c6:#98a83a; --c-other:#5f6d82;
  --grid:#223047; --axis:#8795ab; --tip-bg:#e8eef8; --tip-ink:#101827; --range:#3b82e6;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;min-width:320px;color:var(--ink);background:var(--canvas);font-family:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
body.modal-open{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid rgba(36,105,232,.35);outline-offset:2px}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.big{width:28px;height:28px;stroke-width:1.6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .fine{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.pad{padding:18px 24px} .pad-x{padding:0 24px} .mt{margin-top:14px}
code{font-size:10px;color:var(--muted-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell */
.app-shell{width:100%;min-height:100vh;display:flex}
.side-rail{width:76px;flex:0 0 76px;background:var(--rail);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:0;height:100vh;z-index:20;overflow-y:auto;scrollbar-width:thin}
.rail-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2469e8,#5a95fa);display:grid;place-items:center;color:#fff;margin-bottom:8px;box-shadow:0 6px 14px rgba(36,105,232,.22);flex:none}
.rail-logo .ic{width:19px;height:19px}
.rail-link{width:58px;min-height:46px;border-radius:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;text-decoration:none;transition:.2s ease;text-align:center;line-height:1.1;flex:none;padding:4px 2px}
.rail-link:hover,.rail-link.active{background:var(--blue-soft);color:var(--blue)}
.rail-link .ic{width:17px;height:17px}
.rail-sep{width:32px;height:1px;background:var(--line);margin:5px 0;flex:none}
.report-wrap{width:calc(100% - 76px);min-width:0;padding:22px 24px 54px}
.report-canvas{width:100%;max-width:1450px;margin:0 auto}
.surface{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.action-btn.mobile-menu{display:none}

/* ---------- header */
.top-header{padding:22px 26px 16px;margin-bottom:14px;position:relative;z-index:15}
.hdr-main{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.breadcrumb{display:flex;gap:6px;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.breadcrumb [aria-current]{color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--blue)}
.page-title{margin:6px 0 0;font-size:30px;font-weight:700;letter-spacing:-.04rem;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.demo-badge{font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);padding:4px 8px;border-radius:6px;text-transform:uppercase;vertical-align:middle}
.demo-badge.sm{font-size:9px;padding:2px 5px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.action-btn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--card);color:var(--text);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:.2s ease;white-space:nowrap}
.action-btn:hover:not(:disabled){border-color:var(--blue-line);background:var(--card-3)}
.action-btn.active{border-color:var(--blue-line);color:var(--blue);background:var(--blue-soft)}
.action-btn.compare{color:var(--purple-ink);background:var(--purple-soft);border-color:var(--purple-line)}
.action-btn.compare.off{color:var(--muted);background:var(--card);border-color:var(--line)}
.action-btn.export{color:#fff;background:var(--blue);border-color:var(--blue)}
.action-btn.export:hover:not(:disabled){background:color-mix(in srgb,var(--blue) 88%,#000);color:#fff}
.action-btn.sm{padding:6px 10px;font-size:11px}
.action-btn .count{background:var(--blue);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 5px}
.role-note{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);font-weight:600}
.hdr-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
.ctl{display:flex;flex-direction:column;gap:5px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ctl-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.period-select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);color:var(--ink-2);font-size:12px;font-weight:700;min-width:120px;max-width:260px;text-transform:none;letter-spacing:0}
.date-range-wrap{position:relative}
.date-range-trigger{min-width:190px;text-align:left;display:grid;grid-template-columns:1fr auto;column-gap:10px;text-transform:none;letter-spacing:0}
.date-range-trigger .ic{grid-row:1/3;grid-column:2;align-self:center}
.dr-main{font-size:12px;font-weight:700;color:var(--ink-2)}
.dr-sub{font-size:10px;color:var(--muted);font-weight:600}
#comparison-toggle{text-transform:none;letter-spacing:0}
#comparison-toggle .dr-main{color:inherit}
.chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}
.chips-label{font-size:11px;font-weight:700;color:var(--muted)}
.filter-pill{border:1px solid var(--blue-line);background:var(--card);border-radius:999px;padding:4px 6px 4px 10px;font-size:11px;color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.filter-pill.locked{padding-right:10px;background:var(--card-3);border-color:var(--line)}
.filter-pill button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:2px;border-radius:50%}
.filter-pill button:hover{background:var(--red-soft);color:var(--red)}
.filter-pill .ic{width:12px;height:12px}

/* filter panel */
.filter-panel{margin-top:14px;padding:14px;border-radius:12px;background:var(--card-3);border:1px solid var(--blue-soft);display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ms{position:relative;display:flex;flex-direction:column;gap:5px}
.ms-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ms-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;color:var(--text)}
.ms-btn.has{border-color:var(--blue-line);color:var(--blue)}
.ms-btn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ms-menu{position:absolute;top:100%;left:0;margin-top:4px;width:max(260px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);z-index:40;display:flex;flex-direction:column}
.ms-search{margin:8px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;background:var(--card-2)}
.ms-list{max-height:240px;overflow:auto;padding:0 8px}
.ms-foot{display:flex;justify-content:space-between;align-items:center;padding:8px;border-top:1px solid var(--line-2)}
.fp-note{grid-column:1/-1;margin:0;font-size:11px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 2px;color:var(--text);cursor:pointer}
.chk input{accent-color:var(--blue)}
.link-btn{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:4px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.link-btn:hover{text-decoration:underline}

/* date popover */
.date-popover{position:absolute;left:0;top:calc(100% + 8px);z-index:50;width:min(700px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);display:flex;overflow:hidden;color:var(--text);text-transform:none;letter-spacing:0;font-weight:400}
.date-popover[hidden]{display:none}
.calendar-panel{flex:1;padding:14px;border-right:1px solid var(--line-2);min-width:0}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.cal-nav{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px;display:grid;place-items:center;color:var(--muted)}
.calendar-months{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.month-title{text-align:center;font-size:11px;font-weight:700;margin-bottom:8px;color:var(--ink-2)}
.calendar-grid{display:grid;grid-template-columns:20px repeat(7,1fr);font-size:10px;text-align:center}
.calendar-grid>span,.calendar-grid>button{height:26px;display:grid;place-items:center;border:0;background:transparent;padding:0;font-size:10px}
.calendar-grid>button{color:var(--ink-2);border-radius:5px}
.calendar-grid>button:hover{background:var(--blue-soft)}
.calendar-grid .weekday{font-weight:700;color:var(--ink-2);height:20px}
.calendar-grid .weekno{color:var(--muted-2);font-size:9px}
.calendar-grid .muted-day{color:var(--muted-2);opacity:.6}
.calendar-grid .range-day{background:var(--range);color:var(--range-ink);border-radius:0}
.calendar-grid .range-start{border-radius:6px 0 0 6px}.calendar-grid .range-end{border-radius:0 6px 6px 0}
.calendar-grid .range-start.range-end{border-radius:6px}
.calendar-grid .cmp-day{box-shadow:inset 0 -3px 0 var(--cmp)}
.calendar-grid .anchor{outline:2px solid var(--blue);outline-offset:-2px}
.range-summary{display:grid;gap:6px;margin-top:12px;font-size:11px}
.range-summary div{display:flex;gap:8px;align-items:center}
.range-summary strong{margin-left:auto;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw.cur{background:var(--range)} .sw.cmp{background:transparent;box-shadow:inset 0 -3px 0 var(--cmp);border:1px solid var(--line)}
.cal-hint{font-size:10px;color:var(--muted);margin:8px 0 0}
.date-side{width:220px;padding:13px 11px;display:flex;flex-direction:column;flex:none}
.date-side-label{font-size:12px;color:var(--blue);font-weight:700;margin:0 2px 8px}
.date-select-wrap{position:relative}
.date-select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;background:var(--card);color:var(--ink-2)}
.range-options{overflow:auto;max-height:260px;font-size:12px;border:1px solid var(--line-2);border-radius:6px}
.range-group{color:var(--muted-2);font-weight:700;margin:0;padding:8px 12px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.range-option{position:relative;display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;color:var(--text);font-size:12px}
.range-option:hover,.range-option.selected{background:var(--blue-soft);color:var(--blue)}
.range-option.selected::after{content:'✓';position:absolute;right:12px;font-weight:700}
.date-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:auto;padding-top:12px}
.date-reset,.date-apply{border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:11px;font-weight:700}
.date-reset{background:var(--card);color:var(--muted)}
.date-apply{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(31,56,93,.12)}

/* demo banner + tabs */
.demo-banner{display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:12px;margin-bottom:14px;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);color:var(--text);font-size:12px;flex-wrap:wrap}
.demo-banner>.ic{color:var(--amber)}
.demo-banner strong{color:var(--amber);letter-spacing:.08em}
.demo-banner .link-btn{margin-left:auto}
.tab-strip{padding:0 14px;display:flex;gap:2px;overflow-x:auto;margin-bottom:18px}
.tab-btn{color:var(--muted);padding:13px 13px 11px;border-bottom:2px solid transparent;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none}
.tab-btn:hover,.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ---------- KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{padding:16px;min-width:0}
.kpi-label{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi-value{margin:9px 0 0;font-size:25px;line-height:1;font-weight:700;letter-spacing:-.045em;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-delta{margin:8px 0 0;font-size:11px}
.cov{color:var(--amber);cursor:help;letter-spacing:0}
.delta{font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.good{color:var(--green)} .delta.bad{color:var(--red)} .delta.neutral{color:var(--muted)} .delta.none{color:var(--muted-2);font-weight:600}
.na{color:var(--muted-2);font-weight:600}

/* ---------- report cards */
.report-section{margin-top:20px;scroll-margin-top:18px}
.report-section:first-child{margin-top:0}
.report-card{overflow:visible}
.report-header{padding:20px 24px 16px;border-bottom:1px solid var(--line-2);display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.report-kicker{font-size:10px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.13em;margin-bottom:5px}
.report-title{font-size:22px;font-weight:700;letter-spacing:-.025em;color:var(--ink);margin:0;text-wrap:balance}
.report-subtitle{margin:5px 0 0;color:var(--muted);font-size:12px;max-width:70ch}
.view-all{color:var(--blue);font-size:12px;font-weight:700;border:0;background:transparent;white-space:nowrap;padding:5px;text-decoration:none}
.chart-block{padding:18px 24px 8px}
.chart-block.split-top{border-top:1px solid var(--line-2);margin-top:6px}
.mini-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--ink-2)}
.chart{width:100%;min-height:60px}
.chart svg{display:block;max-width:100%}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .baseline{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--axis);font-size:10px;font-family:inherit}
.chart .axis.label{fill:var(--text);font-size:11px}
.chart .axis.val{font-size:10px;fill:var(--muted)}
.chart .hit.clickable{cursor:pointer}
.chart .hit.clickable:hover path,.chart .hit.clickable:focus path{opacity:.82}
.chart-empty{display:grid;place-items:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:10px;min-height:120px;text-align:center;padding:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 24px 12px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.print-note{padding:12px 24px 18px;color:var(--muted);font-size:11px;margin:0}
.notice{display:flex;gap:9px;align-items:flex-start;margin:12px 24px 0;padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:var(--text);font-size:12px;line-height:1.5}
.notice .ic{margin-top:1px;color:var(--blue)}
.kpi-grid+.notice{margin:-8px 0 16px}
.notice.error{background:var(--red-soft)} .notice.error .ic{color:var(--red)}
.notice.ok{background:var(--green-soft)} .notice.ok .ic{color:var(--green)}
.empty-state{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-state .ic{width:30px;height:30px}
.empty-state h3{margin:4px 0 0;color:var(--ink-2);font-size:16px}
.empty-state p{margin:0 0 8px;max-width:52ch;font-size:13px}
.inline-ctl{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.inline-ctl select,.mini-select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700;background:var(--card);color:var(--ink-2);max-width:100%}

/* tooltip */

/* ==========================================================================
   I18N — translation lookup + locale-aware number/date/currency formatting.
   UI text never lives in components: everything goes through t().
   Locale dictionaries are registered by i18n-locales.js (one object per
   language, equivalent to en.json / hi.json / …).
   ========================================================================== */
const I18n = (() => {
  const dicts = {};
  let lang = 'en';
  let marketplace = 'US';
  let nfCache = new Map();

  function register(code, dict) { dicts[code] = dict; }
  function setLang(code) { lang = dicts[code] ? code : 'en'; nfCache = new Map(); document.documentElement.lang = lang; }
  function setMarketplace(mk) { marketplace = mk; nfCache = new Map(); }
  function getLang() { return lang; }

  function t(key, vars) {
    let s = (dicts[lang] && dicts[lang][key]) ?? dicts.en[key] ?? key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
    return s;
  }
  function has(key) { return dicts.en[key] != null; }

  /* locale = UI language + marketplace region (en-GB, en-IN, de-DE …) */
  function locale() {
    const region = lang === 'en' ? (Config.MARKETPLACES[marketplace]?.region || 'US') : Config.LANG_DEFAULT_REGION[lang];
    return `${lang}-${region}`;
  }
  function currency() { return Config.MARKETPLACES[marketplace]?.currency || 'USD'; }

  function nf(key, opts) {
    const k = key + '|' + locale() + '|' + currency();
    if (!nfCache.has(k)) {
      try { nfCache.set(k, new Intl.NumberFormat(locale(), opts)); }
      catch { nfCache.set(k, new Intl.NumberFormat('en-US', opts)); }
    }
    return nfCache.get(k);
  }

  const NA = () => t('common.na');

  function money(v, compact = true) {
    if (v == null || !isFinite(v)) return NA();
    const a = Math.abs(v);
    if (!compact || a < 1000) return nf('m0' + (a < 100 ? 2 : 0), { style: 'currency', currency: currency(), maximumFractionDigits: a < 100 ? 2 : 0 }).format(v);
    return nf('mc' + (a >= 1e6 ? 2 : 1), { style: 'currency', currency: currency(), notation: 'compact', maximumFractionDigits: a >= 1e6 ? 2 : 1 }).format(v);
  }
  function money2(v) {
    if (v == null || !isFinite(v)) return NA();
    return nf('m2', { style: 'currency', currency: currency() }).format(v);
  }
  function int(v, compact = true) {
    if (v == null || !isFinite(v)) return NA();
    const a = Math.abs(v);
    if (!compact || a < 10000) return nf('i0', { maximumFractionDigits: 0 }).format(v);
    return nf('ic' + (a >= 1e6 ? 2 : 1), { notation: 'compact', maximumFractionDigits: a >= 1e6 ? 2 : 1 }).format(v);
  }
  function pct(v, digits = 2) {
    if (v == null || !isFinite(v)) return NA();
    return nf('p' + digits, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(v) + '%';
  }
  function num(v, digits = 2) {
    if (v == null || !isFinite(v)) return NA();
    return nf('n' + digits, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(v);
  }
  function metric(key, v, compact = true) {
    const m = Config.METRICS[key];
    if (!m) return num(v);
    switch (m.fmt) {
      case 'currency': return money(v, compact);
      case 'currency2': return money2(v);
      case 'int': return int(v, compact);
      case 'pct': return pct(v);
      case 'ratio': return num(v, 2);
      default: return num(v);
    }
  }
  function delta(v) { // magnitude only; arrow rendered separately
    if (v == null || !isFinite(v)) return '—';
    return nf('d1', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Math.abs(v)) + '%';
  }

  /* dates are integer day numbers (UTC days since epoch) */
  function dateFmt(day, opts) {
    const k = 'd' + JSON.stringify(opts) + locale();
    if (!nfCache.has(k)) nfCache.set(k, new Intl.DateTimeFormat(locale(), { timeZone: 'UTC', ...opts }));
    return nfCache.get(k).format(new Date(day * 86400000));
  }
  function date(day) { return dateFmt(day, { month: 'short', day: 'numeric', year: 'numeric' }); }
  function dateShort(day) { return dateFmt(day, { month: 'short', day: 'numeric' }); }
  function monthLabel(day) { return dateFmt(day, { month: 'long', year: 'numeric' }); }
  function monthShort(day) { return dateFmt(day, { month: 'short', year: '2-digit' }); }
  function range(s, e) {
    if (s == null) return '—';
    if (s === e) return date(s);
    try {
      const k = 'r' + locale();
      if (!nfCache.has(k)) nfCache.set(k, new Intl.DateTimeFormat(locale(), { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' }));
      return nfCache.get(k).formatRange(new Date(s * 86400000), new Date(e * 86400000));
    } catch { return date(s) + ' – ' + date(e); }
  }
  function weekdayNames() {
    const f = new Intl.DateTimeFormat(locale(), { weekday: 'narrow', timeZone: 'UTC' });
    return [0, 1, 2, 3, 4, 5, 6].map(i => f.format(new Date(Date.UTC(2023, 0, 1 + i)))); // Jan 1 2023 = Sunday
  }

  function dim(dimKey) { return t('dim.' + dimKey); }
  function metricLabel(key) { return t('m.' + key); }

  return { register, setLang, setMarketplace, getLang, t, has, locale, currency, money, money2, int, pct, num, metric, delta,
    date, dateShort, monthLabel, monthShort, range, weekdayNames, dim, metricLabel, NA, dicts };
})();

/* ===== lib/dates.js ===== */
/* ==========================================================================
   DATE ENGINE — day numbers, presets, comparison periods, period buckets.
   Weeks run Sunday–Saturday (Amazon Ads console convention); week 1 is the
   week containing January 1.
   ========================================================================== */
const Dates = (() => {
  const D = 86400000;
  const toDay = d => Math.floor(d.getTime() / D);
  const fromDay = n => new Date(n * D);
  const ymd = n => { const d = fromDay(n); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()]; };
  const dayOf = (y, m, d) => Math.floor(Date.UTC(y, m, d) / D);
  const iso = n => fromDay(n).toISOString().slice(0, 10);
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return dayOf(y, m - 1, d); };
  const weekday = n => (n + 4) % 7; // 1970-01-01 was Thursday → Sunday = 0
  const weekStart = n => n - weekday(n);
  const monthStart = n => { const [y, m] = ymd(n); return dayOf(y, m, 1); };
  const monthEnd = n => { const [y, m] = ymd(n); return dayOf(y, m + 1, 0); };
  const quarterStart = n => { const [y, m] = ymd(n); return dayOf(y, m - (m % 3), 1); };
  const quarterEnd = n => { const [y, m] = ymd(n); return dayOf(y, m - (m % 3) + 3, 0); };
  const yearStart = n => dayOf(ymd(n)[0], 0, 1);
  const yearEnd = n => dayOf(ymd(n)[0], 11, 31);
  function weekNumber(n) {
    const ws = weekStart(n), y = ymd(ws + 6)[0]; // the year that owns the week = year of its Saturday
    const w1 = weekStart(dayOf(y, 0, 1));
    return Math.floor((ws - w1) / 7) + 1;
  }
  function addMonths(n, k) { const [y, m, d] = ymd(n); const last = dayOf(y, m + k + 1, 0); return Math.min(dayOf(y, m + k, d), last); }
  function addYears(n, k) { return addMonths(n, 12 * k); }

  /* Presets: id → {group, calc(ref, bounds) → [start,end], unit} ; unit drives smart comparison */
  const PRESETS = [
    { id: 'today', group: 'days', calc: r => [r, r], unit: 'day' },
    { id: 'yesterday', group: 'days', calc: r => [r - 1, r - 1], unit: 'day' },
    { id: 'last7', group: 'days', calc: r => [r - 6, r] },
    { id: 'last14', group: 'days', calc: r => [r - 13, r] },
    { id: 'last30', group: 'days', calc: r => [r - 29, r] },
    { id: 'lastWeek', group: 'weeks', calc: r => { const s = weekStart(r) - 7; return [s, s + 6]; }, unit: 'week' },
    { id: 'last4Weeks', group: 'weeks', calc: r => { const e = weekStart(r) - 1; return [e - 27, e]; } },
    { id: 'last13Weeks', group: 'weeks', calc: r => { const e = weekStart(r) - 1; return [e - 90, e]; } },
    { id: 'mtd', group: 'months', calc: r => [monthStart(r), r], unit: 'month' },
    { id: 'lastMonth', group: 'months', calc: r => { const e = monthStart(r) - 1; return [monthStart(e), e]; }, unit: 'month' },
    { id: 'qtd', group: 'quarters', calc: r => [quarterStart(r), r], unit: 'quarter' },
    { id: 'lastQuarter', group: 'quarters', calc: r => { const e = quarterStart(r) - 1; return [quarterStart(e), e]; }, unit: 'quarter' },
    { id: 'ytd', group: 'years', calc: r => [yearStart(r), r], unit: 'year' },
    { id: 'lastYear', group: 'years', calc: r => { const e = yearStart(r) - 1; return [yearStart(e), e]; }, unit: 'year' },
    { id: 'lifetime', group: 'other', calc: (r, b) => [b.min, b.max] },
  ];
  const presetById = id => PRESETS.find(p => p.id === id);

  /* Comparison: 'previous' shifts by the preset's calendar unit when it has one
     (MTD Sep 1–22 → Aug 1–22), otherwise by equal length immediately before. */
  function comparison(mode, start, end, presetId, custom) {
    if (mode === 'none') return null;
    if (mode === 'custom') return custom && custom[0] != null ? custom : null;
    if (mode === 'yoy') return [addYears(start, -1), addYears(end, -1)];
    const p = presetById(presetId);
    const len = end - start;
    switch (p && p.unit) {
      case 'week': return [start - 7, end - 7];
      case 'month': { const s = addMonths(start, -1); return [s, Math.min(s + len, monthEnd(s))]; }
      case 'quarter': { const s = addMonths(start, -3); return [s, Math.min(s + len, quarterEnd(s))]; }
      case 'year': { const s = addYears(start, -1); return [s, Math.min(addYears(end, -1), yearEnd(s))]; }
      default: return [start - len - 1, start - 1];
    }
  }

  /* Period bucketing for WoW / MoM / QoQ / YoY / trend charts */
  const GRAINS = {
    day: { key: n => n, start: n => n, end: n => n, prev: k => k - 1 },
    week: { key: weekStart, start: k => k, end: k => k + 6, prev: k => k - 7 },
    month: { key: monthStart, start: k => k, end: monthEnd, prev: k => addMonths(k, -1) },
    quarter: { key: quarterStart, start: k => k, end: quarterEnd, prev: k => addMonths(k, -3) },
    year: { key: yearStart, start: k => k, end: yearEnd, prev: k => addYears(k, -1) },
  };
  function periodLabel(grain, k) {
    const [y, m] = ymd(k);
    switch (grain) {
      case 'day': return I18n.dateShort(k);
      case 'week': return t('period.week', { n: weekNumber(k) });
      case 'month': return I18n.monthLabel(k);
      case 'quarter': return `Q${Math.floor(m / 3) + 1} ${y}`;
      case 'year': return String(y);
    }
  }
  function periodSub(grain, k, bounds) {
    const g = GRAINS[grain];
    let s = g.start(k), e = g.end(k);
    const partial = bounds && (s < bounds.min || e > bounds.max);
    if (bounds) { s = Math.max(s, bounds.min); e = Math.min(e, bounds.max); }
    return { range: grain === 'day' ? '' : I18n.range(s, e), partial };
  }
  /* last N period keys ending at `endDay` */
  function periodKeys(grain, endDay, n) {
    const g = GRAINS[grain]; const out = [];
    let k = g.key(endDay);
    for (let i = 0; i < n; i++) { out.unshift(k); k = g.prev(k); }
    return out;
  }
  function autoGrain(start, end) {
    const len = end - start + 1;
    if (len <= 35) return 'day';
    if (len <= 200) return 'week';
    if (len <= 1100) return 'month';
    return 'quarter';
  }

  return { toDay, fromDay, ymd, dayOf, iso, fromISO, weekday, weekStart, monthStart, monthEnd, weekNumber, addMonths, addYears,
    PRESETS, presetById, comparison, GRAINS, periodLabel, periodSub, periodKeys, autoGrain };
})();

/* ===== lib/store.js ===== */
/* ==========================================================================
   DATA STORE — normalised reporting dataset held in columnar typed arrays.
   One ColumnTable per report grain (campaign, placement, keyword, asin,
   searchTerm). Dimensions are dictionary-encoded (Uint32 codes), metrics are
   Float32 with NaN = "not reported" (renders N/A, never 0).
   This layout keeps millions of rows scannable in milliseconds.
   ========================================================================== */
class Dict {
  constructor() { this.values = []; this.index = new Map(); }
  code(v) {
    v = v == null ? '' : String(v);
    let c = this.index.get(v);
    if (c === undefined) { c = this.values.length; this.values.push(v); this.index.set(v, c); }
    return c;
  }
}

class ColumnTable {
  constructor(name, capacity = 1024) {
    this.name = name;
    this.dims = Config.SOURCES[name].dims;
    this.nMetrics = Config.BASE_METRICS.length;
    this.length = 0;
    this.cap = capacity;
    this.dicts = Object.fromEntries(this.dims.map(d => [d, new Dict()]));
    this.dimCols = Object.fromEntries(this.dims.map(d => [d, new Uint32Array(capacity)]));
    this.day = new Uint16Array(capacity);
    this.metrics = Config.BASE_METRICS.map(() => new Float32Array(capacity));
    this.minDay = Infinity; this.maxDay = -Infinity;
  }
  grow() {
    const cap = this.cap * 2;
    const g = (arr, T) => { const n = new T(cap); n.set(arr); return n; };
    for (const d of this.dims) this.dimCols[d] = g(this.dimCols[d], Uint32Array);
    this.day = g(this.day, Uint16Array);
    this.metrics = this.metrics.map(a => { const n = new Float32Array(cap); n.fill(NaN); n.set(a); return n; });
    this.cap = cap;
  }
  /* row: { day, dims:{...}, m:{metricKey:value|null} } */
  push(day, dims, m) {
    if (this.length >= this.cap) this.grow();
    const i = this.length++;
    this.day[i] = day;
    if (day < this.minDay) this.minDay = day;
    if (day > this.maxDay) this.maxDay = day;
    for (const d of this.dims) this.dimCols[d][i] = this.dicts[d].code(dims[d]);
    const BM = Config.BASE_METRICS;
    for (let k = 0; k < BM.length; k++) {
      const v = m[BM[k].key];
      this.metrics[k][i] = v == null || v === '' || !isFinite(v) ? NaN : v;
    }
  }
  /* indices of metric columns with at least one reported value (cached until rows change) */
  activeMetrics() {
    if (this._active && this._activeLen === this.length) return this._active;
    const out = [];
    this.metrics.forEach((a, k) => { for (let i = 0; i < this.length; i++) if (a[i] === a[i]) { out.push(k); return; } });
    this._active = out; this._activeLen = this.length;
    return out;
  }
  /* append every row of another table of the same grain (re-maps dictionary codes) */
  appendFrom(o) {
    const n = o.length;
    while (this.length + n > this.cap) this.grow();
    const base = this.length;
    for (const d of this.dims) {
      const map = o.dicts[d].values.map(v => this.dicts[d].code(v));
      const src = o.dimCols[d], dst = this.dimCols[d];
      for (let i = 0; i < n; i++) dst[base + i] = map[src[i]];
    }
    this.day.set(o.day.subarray(0, n), base);
    this.metrics.forEach((a, k) => a.set(o.metrics[k].subarray(0, n), base));
    this.length += n;
    if (n) { this.minDay = Math.min(this.minDay, o.minDay); this.maxDay = Math.max(this.maxDay, o.maxDay); }
  }
  valuesOf(dim) { return this.dicts[dim] ? this.dicts[dim].values : []; }
  /* rebuild without rows matching predicate (used when a data source is removed) */
  filterRows(keepFn) {
    const nt = new ColumnTable(this.name, Math.max(1024, this.length));
    const dimsObj = {}, mObj = {};
    for (let i = 0; i < this.length; i++) {
      for (const d of this.dims) dimsObj[d] = this.dicts[d].values[this.dimCols[d][i]];
      if (!keepFn(dimsObj)) continue;
      Config.BASE_METRICS.forEach((b, k) => { const v = this.metrics[k][i]; mObj[b.key] = isNaN(v) ? null : v; });
      nt.push(this.day[i], dimsObj, mObj);
    }
    return nt;
  }
  serialize() {
    const n = this.length;
    return { name: this.name, length: n, day: this.day.slice(0, n),
      dimCols: Object.fromEntries(this.dims.map(d => [d, this.dimCols[d].slice(0, n)])),
      dicts: Object.fromEntries(this.dims.map(d => [d, this.dicts[d].values])),
      metrics: this.metrics.map(a => a.slice(0, n)), minDay: this.minDay, maxDay: this.maxDay };
  }
  /* wrap typed arrays received from the server without copying */
  static fromColumns(name, o) {
    const t = new ColumnTable(name, 1);
    t.length = t.cap = o.length;
    t.day = o.day;
    for (const d of t.dims) {
      const src = o.dims[d];
      t.dimCols[d] = src ? src.codes : new Uint32Array(o.length);
      (src ? src.values : ['']).forEach(v => t.dicts[d].code(v));
    }
    t.metrics = o.metrics; t.minDay = o.minDay; t.maxDay = o.maxDay;
    return t;
  }
  static deserialize(o) {
    const t = new ColumnTable(o.name, Math.max(1024, o.length));
    t.length = o.length; t.cap = Math.max(1024, o.length);
    t.day = new Uint16Array(t.cap); t.day.set(o.day);
    for (const d of t.dims) {
      t.dimCols[d] = new Uint32Array(t.cap);
      if (o.dimCols[d]) t.dimCols[d].set(o.dimCols[d]);
      const vals = o.dicts[d] || [''];
      vals.forEach(v => t.dicts[d].code(v));
    }
    t.metrics = Config.BASE_METRICS.map((_, k) => { const a = new Float32Array(t.cap); a.fill(NaN); if (o.metrics[k]) a.set(o.metrics[k]); return a; });
    t.minDay = o.minDay; t.maxDay = o.maxDay;
    return t;
  }
}

const DataStore = (() => {
  let tables = {};
  let files = [];      // data source registry: {id, name, source, rows, minDay, maxDay, importedAt, demo}
  let version = 0;     // bumps on every data change → invalidates query cache
  let isDemo = true;

  function reset() {
    tables = Object.fromEntries(Object.keys(Config.SOURCES).map(s => [s, new ColumnTable(s)]));
    files = [];
    version++;
  }
  reset();

  function table(name) { return tables[name]; }
  function available() { return Config.SOURCE_PREFERENCE.filter(s => tables[s].length > 0); }
  function bounds() {
    let min = Infinity, max = -Infinity;
    for (const s of Object.values(tables)) if (s.length) { min = Math.min(min, s.minDay); max = Math.max(max, s.maxDay); }
    return isFinite(min) ? { min, max } : null;
  }
  function distinct(dim, marketplace) {
    const out = new Set();
    for (const s of Object.values(tables)) {
      if (!s.length || !s.dicts[dim]) continue;
      if (!marketplace) { s.dicts[dim].values.forEach(v => v && out.add(v)); continue; }
      const mc = s.dicts.marketplace.index.get(marketplace);
      if (mc === undefined) continue;
      const col = s.dimCols[dim], mcol = s.dimCols.marketplace, seen = new Uint8Array(s.dicts[dim].values.length);
      for (let i = 0; i < s.length; i++) if (mcol[i] === mc && !seen[col[i]]) { seen[col[i]] = 1; }
      seen.forEach((f, c) => { if (f && s.dicts[dim].values[c]) out.add(s.dicts[dim].values[c]); });
    }
    return [...out].sort((a, b) => a.localeCompare(b));
  }
  function registerFile(f) { files.push(f); version++; }
  function removeFile(id) {
    for (const s of Object.keys(tables)) tables[s] = tables[s].filterRows(d => d.fileId !== id);
    files = files.filter(f => f.id !== id);
    if (!files.some(f => f.demo)) isDemo = false;
    version++;
  }
  function clearDemo() {
    const demoIds = files.filter(f => f.demo).map(f => f.id);
    if (!demoIds.length) return;
    for (const s of Object.keys(tables)) tables[s] = tables[s].filterRows(d => !demoIds.includes(d.fileId));
    files = files.filter(f => !f.demo);
    isDemo = false; version++;
  }
  function touch() { version++; }

  /* ---- per-viewer persistence (IndexedDB). Best-effort; never load-bearing. */
  const DB = 'ads-intel', STORE = 'datasets';
  function idb() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  /* server mode: replace everything with the reports stored by the Python backend */
  function loadServer(header, buf) {
    const T = { u8: Uint8Array, u16: Uint16Array, u32: Uint32Array, f32: Float32Array };
    tables = Object.fromEntries(Object.keys(Config.SOURCES).map(s => {
      const o = header.tables[s];
      if (!o) return [s, new ColumnTable(s)];
      const n = o.length, view = c => new T[c.type](buf, c.offset, n);
      return [s, ColumnTable.fromColumns(s, {
        length: n, minDay: o.minDay, maxDay: o.maxDay, day: view(o.day),
        dims: Object.fromEntries(Object.entries(o.dims).map(([d, c]) => [d, { codes: c.type === 'u32' ? view(c) : Uint32Array.from(view(c)), values: c.values }])),
        metrics: o.metrics.map(c => c ? view(c) : new Float32Array(n).fill(NaN)),
      })];
    }));
    files = header.datasets.map(d => ({ ...d, importedAt: Date.parse(d.importedAt), demo: false }));
    isDemo = false; version++;
  }
  async function persist() {
    if (typeof Api !== 'undefined' && Api.enabled) return; // the server is the system of record
    try {
      const db = await idb();
      const payload = isDemo ? null : { files, tables: Object.fromEntries(Object.entries(tables).map(([k, v]) => [k, v.serialize()])) };
      await new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(payload, 'current'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { console.warn('persist skipped', e); }
  }
  async function restore() {
    try {
      const db = await idb();
      const payload = await new Promise((res, rej) => { const tx = db.transaction(STORE, 'readonly'); const r = tx.objectStore(STORE).get('current'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      if (!payload || !payload.files?.length) return false;
      tables = Object.fromEntries(Object.keys(Config.SOURCES).map(s => [s, payload.tables[s] ? ColumnTable.deserialize(payload.tables[s]) : new ColumnTable(s)]));
      files = payload.files; isDemo = false; version++;
      return true;
    } catch (e) { return false; }
  }

  return {
    reset, table, available, bounds, distinct, registerFile, removeFile, clearDemo, touch, persist, restore, loadServer,
    get files() { return files; }, get version() { return version; },
    get isDemo() { return isDemo; }, set isDemo(v) { isDemo = v; },
    get tables() { return tables; },
  };
})();

/* ===== lib/query.js ===== */
/* ==========================================================================
   METRIC ENGINE + FILTER ENGINE + AGGREGATION
   - Metrics.derive(acc): the only place derived metrics are computed.
   - Metrics.change(key, cur, prev): % change + direction-aware tone.
   - Query.run(spec): resolves the correct report grain, applies the global
     filter state in one pass over typed arrays, aggregates, memoises.
   ========================================================================== */
const Metrics = (() => {
  const BM = Config.BASE_METRICS;
  const NM = BM.length, S = 6; // per-metric slots: sum, count, cond orders, cond sales, cond spend, cond impressions
  const IDX = Object.fromEntries(BM.map((m, i) => [m.key, i]));
  const SLOT_OF = { orders: 2, adSales: 3, adSpend: 4, impressions: 5 };
  const WEIGHTED = BM.map(m => !!m.weight);

  function newAcc() { return new Float64Array(NM * S); }
  const ALL = BM.map((_, k) => k);
  function addRow(acc, M, i, ks = ALL) {
    const spend = M[0][i], sales = M[1][i], impr = M[2][i], ord = M[4][i];
    for (let j = 0, nk = ks.length; j < nk; j++) {
      const k = ks[j];
      const v = M[k][i];
      if (v !== v) continue;
      const b = k * S;
      acc[b] += WEIGHTED[k] ? v * (impr === impr ? impr : 0) : v;
      acc[b + 1]++;
      if (ord === ord) acc[b + 2] += ord;
      if (sales === sales) acc[b + 3] += sales;
      if (spend === spend) acc[b + 4] += spend;
      if (impr === impr) acc[b + 5] += impr;
    }
  }
  function merge(into, from) { for (let j = 0; j < into.length; j++) into[j] += from[j]; }

  function accessor(acc, source) {
    return {
      s(key) {
        const k = IDX[key], b = k * S;
        if (!acc[b + 1]) return null;
        const m = BM[k];
        if (m.sources && !m.sources.includes(source)) return null;
        return WEIGHTED[k] ? (acc[b + 5] ? acc[b] / acc[b + 5] : null) : acc[b];
      },
      c(key, of) { const b = IDX[key] * S; return acc[b + 1] ? acc[b + SLOT_OF[of]] : null; },
      cov(key) { // share of spend for which the metric is reported
        const b = IDX[key] * S, tot = acc[4];
        if (!acc[b + 1]) return 0;
        return tot ? acc[b + 4] / tot : 1;
      },
    };
  }

  /* acc → { values, cov } for every metric in the registry. Coverage (share of spend where a metric is
     reported) is only computed when asked — totals need it, 100k table rows don't. */
  const DERIVED = Object.values(Config.METRICS).filter(m => !m.base);
  const SRC_OK = BM.map(m => m.sources || null);
  function derive(acc, source, withCov = true) {
    const v = {};
    for (let k = 0; k < NM; k++) {
      const b = k * S, key = BM[k].key;
      if (!acc[b + 1] || (SRC_OK[k] && !SRC_OK[k].includes(source))) { v[key] = null; continue; }
      v[key] = WEIGHTED[k] ? (acc[b + 5] ? acc[b] / acc[b + 5] : null) : acc[b];
    }
    const a = { s: key => v[key], c: (key, of) => { const b = IDX[key] * S; return acc[b + 1] ? acc[b + SLOT_OF[of]] : null; } };
    for (const m of DERIVED) v[m.key] = m.f(a);
    if (!withCov) return { v, cov: null };
    const cov = {}, tot = acc[4];
    for (let k = 0; k < NM; k++) { const b = k * S; cov[BM[k].key] = v[BM[k].key] == null ? 0 : (tot ? acc[b + 4] / tot : 1); }
    for (const m of DERIVED) cov[m.key] = v[m.key] == null ? 0 : Math.min(...m.deps.map(d => cov[d] ?? 1));
    return { v, cov };
  }

  /* % change and tone, driven by Config.metricDirection */
  function change(key, cur, prev) {
    if (cur == null || prev == null || prev === 0) return null;
    const pct = (cur - prev) / Math.abs(prev) * 100;
    const dir = Config.metricDirection[key] || 'neutral';
    let tone = 'neutral';
    if (Math.abs(pct) >= 0.05) {
      if (dir === 'positive') tone = pct > 0 ? 'good' : 'bad';
      else if (dir === 'negative') tone = pct < 0 ? 'good' : 'bad';
    }
    return { pct, tone, up: pct > 0, flat: Math.abs(pct) < 0.05 };
  }
  return { newAcc, addRow, merge, derive, change, NM, IDX };
})();

const Query = (() => {
  let cache = new Map();
  let cacheVersion = -1;

  /* Pick the report grain that contains every dimension we need. */
  function resolve(required, groupDim) {
    const avail = DataStore.available();
    if (!avail.length) return null;
    const has = (s, d) => Config.SOURCES[s].dims.includes(d);
    const candidates = groupDim ? avail.filter(s => has(s, groupDim)) : avail;
    if (!candidates.length) return null;
    let best = null, bestScore = -1;
    for (const s of candidates) {
      const score = required.filter(d => has(s, d)).length;
      if (score > bestScore) { best = s; bestScore = score; }
      if (score === required.length) break;
    }
    return { source: best, unapplied: required.filter(d => !has(best, d)) };
  }

  /* spec: { filters, marketplace, range:[s,e]|null, groupBy: dim|'day'|'week'|'month'|'quarter'|'year'|null, source? } */
  function run(spec) {
    if (cacheVersion !== DataStore.version) { cache = new Map(); cacheVersion = DataStore.version; }
    const key = JSON.stringify(spec);
    if (cache.has(key)) return cache.get(key);
    const res = compute(spec);
    cache.set(key, res);
    if (cache.size > 400) cache.delete(cache.keys().next().value);
    return res;
  }

  function compute({ filters, marketplace, range, groupBy, source: forced }) {
    const activeDims = Object.keys(filters).filter(d => filters[d] && filters[d].length);
    const isTime = groupBy && Dates.GRAINS[groupBy];
    const groupDims = groupBy && !isTime ? groupBy.split('+') : null;   // composite keys: 'keyword+matchType+campaign'
    const groupDim = groupDims ? groupDims[0] : null;
    const r = forced ? { source: forced, unapplied: activeDims.filter(d => !Config.SOURCES[forced].dims.includes(d)) } : resolve([...activeDims, ...(groupDims || []).slice(1)], groupDim);
    if (r && groupDims && groupDims.some(d => !Config.SOURCES[r.source].dims.includes(d))) return { empty: true, missingDim: groupDim, groups: new Map(), total: null };
    if (!r || !DataStore.table(r.source).length) return { empty: true, missingDim: groupDim, groups: new Map(), total: null };
    const T = DataStore.table(r.source);
    const n = T.length, day = T.day, M = T.metrics;

    // filter masks
    const checks = [];
    const mk = T.dicts.marketplace.index.get(marketplace);
    if (mk === undefined) return { empty: true, source: r.source, unapplied: r.unapplied, groups: new Map(), total: finalize(Metrics.newAcc(), r.source) };
    for (const d of activeDims) {
      if (r.unapplied.includes(d)) continue;
      const dict = T.dicts[d], mask = new Uint8Array(dict.values.length);
      filters[d].forEach(v => { const c = dict.index.get(v); if (c !== undefined) mask[c] = 1; });
      checks.push([T.dimCols[d], mask]);
    }
    const mcol = T.dimCols.marketplace;
    const s = range ? range[0] : -1, e = range ? range[1] : 1e9;
    const groups = new Map();
    const total = Metrics.newAcc();
    const gcols = groupDims ? groupDims.map(d => T.dimCols[d]) : null;
    const gcol = gcols && gcols.length === 1 ? gcols[0] : null;
    const gkey = isTime ? Dates.GRAINS[groupBy].key : null;
    const composite = gcols && gcols.length > 1;
    // composite keys as one number (mixed radix) when it fits — far faster than string keys on millions of rows
    const radix = composite ? groupDims.map(d => Math.max(1, T.dicts[d].values.length)) : null;
    const numericKey = composite && radix.reduce((a, b) => a * b, 1) < 2 ** 52;
    const ng = gcols ? gcols.length : 0;
    const nc = checks.length;
    const ks = T.activeMetrics();   // skip metric columns this report never fills
    outer: for (let i = 0; i < n; i++) {
      if (mcol[i] !== mk) continue;
      const d = day[i];
      if (d < s || d > e) continue;
      for (let c = 0; c < nc; c++) if (!checks[c][1][checks[c][0][i]]) continue outer;
      if (!groupBy) { Metrics.addRow(total, M, i, ks); continue; }
      {
        let k;
        if (numericKey) { k = 0; for (let g = 0; g < ng; g++) k = k * radix[g] + gcols[g][i]; }
        else k = composite ? gcols.map(c => c[i]).join('|') : gcol ? gcol[i] : gkey(d);
        let acc = groups.get(k);
        if (!acc) { acc = Metrics.newAcc(); groups.set(k, acc); }
        Metrics.addRow(acc, M, i, ks);
      }
    }
    if (groupBy) for (const acc of groups.values()) Metrics.merge(total, acc);   // total = sum of groups (cheaper than per row)
    const out = new Map();
    for (const [k, acc] of groups) {
      let codesOf = null;
      if (numericKey) { codesOf = new Array(ng); let r = k; for (let g = ng - 1; g >= 0; g--) { codesOf[g] = r % radix[g]; r = Math.floor(r / radix[g]); } }
      const label = composite ? (codesOf || String(k).split('|').map(Number)).map((c, j) => T.dicts[groupDims[j]].values[c]).join('\u0001')
        : gcol ? T.dicts[groupDim].values[k] : k;
      out.set(label, finalize(acc, r.source, false));
    }
    return { source: r.source, unapplied: r.unapplied, groups: out, total: finalize(total, r.source, true) };
  }
  function finalize(acc, source, withCov = true) { const d = Metrics.derive(acc, source, withCov); return { ...d, rows: acc[1] }; }

  /* attribute lookup: for each value of `dim`, first seen value of `attrDim` (e.g. campaign → portfolio) */
  const attrCache = new Map();
  function attributes(source, dim, attrDims) {
    const key = source + dim + attrDims.join() + DataStore.version;
    if (attrCache.has(key)) return attrCache.get(key);
    const T = DataStore.table(source), out = new Map();
    if (!T || !T.length) return out;
    const col = T.dimCols[dim];
    for (let i = 0; i < T.length; i++) {
      const v = T.dicts[dim].values[col[i]];
      if (out.has(v)) continue;
      const o = {};
      attrDims.forEach(a => { if (T.dimCols[a]) o[a] = T.dicts[a].values[T.dimCols[a][i]]; });
      out.set(v, o);
    }
    if (attrCache.size > 50) attrCache.clear();
    attrCache.set(key, out);
    return out;
  }
  return { run, resolve, attributes };
})();

/* ===== lib/state.js ===== */
/* ==========================================================================
   STATE — one global store. Every component reads from here; nothing keeps
   its own copy of filters, dates or comparison settings.
   ========================================================================== */
const State = (() => {
  const listeners = new Set();
  const s = {
    route: 'overview',
    lang: 'en',
    role: 'admin',
    assignedAccounts: [],
    marketplace: 'US',
    filters: Object.fromEntries(Config.FILTER_DIMS.map(d => [d, []])),
    date: { preset: 'mtd', start: null, end: null, compareMode: 'previous', cStart: null, cEnd: null },
    compareOn: true,
    filterPanelOpen: false,
    trendGrain: 'auto',
    breakdowns: [
      { metric: 'adSpend', dim: 'matchType' },
      { metric: 'adSales', dim: 'matchType' },
      { metric: 'adSpend', dim: 'adType' },
    ],
    periodCounts: { week: 13, month: 12, quarter: 8, year: 3 },
    synonyms: {},        // user additions to Config.FIELD_SYNONYMS
    brandTerms: 'veltra',
    competitorTerms: 'halden, carewell',
  };
  let scheduled = false;

  function get() { return s; }
  function set(patch, opts = {}) {
    for (const k of Object.keys(patch)) s[k] = patch[k];
    if (!opts.silent) schedule();
    savePrefs();
  }
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; listeners.forEach(fn => fn(s)); });
  }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  /* ---- filters */
  function toggleFilter(dim, value) {
    const cur = s.filters[dim] || [];
    const next = cur.includes(value) ? cur.filter(v => v !== value) : [...cur, value];
    set({ filters: { ...s.filters, [dim]: next } });
  }
  function setFilter(dim, values) { set({ filters: { ...s.filters, [dim]: values } }); }
  function clearFilters() { set({ filters: Object.fromEntries(Config.FILTER_DIMS.map(d => [d, []])) }); }
  function activeFilterCount() { return Object.values(s.filters).reduce((a, v) => a + (v.length ? 1 : 0), 0); }

  /* filters as the query engine sees them (role restrictions applied) */
  function effectiveFilters() {
    const f = { ...s.filters };
    if (!Config.ROLES[s.role].allAccounts) {
      const allowed = s.assignedAccounts;
      f.account = f.account.length ? f.account.filter(a => allowed.includes(a)) : [...allowed];
      if (!f.account.length) f.account = ['__none__'];
    }
    return f;
  }
  function can(perm) { return !!Config.ROLES[s.role][perm]; }

  /* ---- dates */
  function ranges() {
    const b = DataStore.bounds();
    if (!b) return { cur: null, cmp: null, ref: null, bounds: null };
    const d = s.date;
    let cur;
    if (d.preset === 'custom' && d.start != null) cur = [d.start, d.end];
    else cur = Dates.presetById(d.preset === 'custom' ? 'mtd' : d.preset).calc(b.max, b);
    const cmp = s.compareOn ? Dates.comparison(d.compareMode, cur[0], cur[1], d.preset, [d.cStart, d.cEnd]) : null;
    return { cur, cmp, ref: b.max, bounds: b };
  }

  /* ---- per-viewer preferences (localStorage, best-effort) */
  const PREF_KEYS = ['lang', 'role', 'assignedAccounts', 'marketplace', 'date', 'compareOn', 'breakdowns', 'periodCounts', 'synonyms', 'brandTerms', 'competitorTerms', 'trendGrain'];
  function savePrefs() {
    try { localStorage.setItem('ads-intel-prefs', JSON.stringify(Object.fromEntries(PREF_KEYS.map(k => [k, s[k]])))); } catch { }
  }
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem('ads-intel-prefs') || 'null');
      if (p) PREF_KEYS.forEach(k => { if (p[k] !== undefined) s[k] = p[k]; });
    } catch { }
  }

  return { get, set, subscribe, schedule, toggleFilter, setFilter, clearFilters, activeFilterCount, effectiveFilters, can, ranges, loadPrefs };
})();

/* ==========================================================================
   REPORTING SERVICE — the queries every view AND every export use.
   Views never talk to Query directly, so a table on screen and the same
   table in Excel/PPT are guaranteed to match.
   ========================================================================== */
const Reports = (() => {
  const base = () => { const st = State.get(); return { filters: State.effectiveFilters(), marketplace: st.marketplace }; };

  function totals(range) { return Query.run({ ...base(), range, groupBy: null }); }

  function kpis() {
    const { cur, cmp } = State.ranges();
    const c = totals(cur), p = cmp ? totals(cmp) : null;
    return { cur: c, prev: p, range: cur, cmpRange: cmp };
  }

  /* trend series for charts */
  function trend(grain) {
    const { cur } = State.ranges();
    if (!cur) return null;
    const g = grain === 'auto' || !grain ? Dates.autoGrain(cur[0], cur[1]) : grain;
    const res = Query.run({ ...base(), range: cur, groupBy: g });
    const keys = [];
    const G = Dates.GRAINS[g];
    for (let k = G.key(cur[0]); k <= cur[1]; k = G.end(k) + 1) keys.push(k);
    return { grain: g, keys, groups: res.groups, source: res.source, unapplied: res.unapplied || [] };
  }

  /* WoW / MoM / QoQ / YoY rows: last N periods ending at the selected range end */
  function periods(grain, n) {
    const { cur, bounds } = State.ranges();
    if (!cur) return { rows: [] };
    const keys = Dates.periodKeys(grain, cur[1], n + 1);
    const G = Dates.GRAINS[grain];
    const span = [G.start(keys[0]), G.end(keys[keys.length - 1])];
    const res = Query.run({ ...base(), range: [span[0], Math.min(span[1], cur[1])], groupBy: grain });
    const rows = [];
    for (let i = keys.length - 1; i >= 1; i--) {
      const k = keys[i], prevK = keys[i - 1];
      const d = res.groups.get(k), pd = res.groups.get(prevK);
      const sub = Dates.periodSub(grain, k, { min: bounds.min, max: Math.min(bounds.max, cur[1]) });
      let prev = pd || null;
      // a period cut short by the range end is compared like-for-like (same number of days)
      const endCut = Math.min(bounds.max, cur[1]);
      if (sub.partial && G.end(k) > endCut && G.start(k) <= endCut) {
        const len = endCut - G.start(k), ps = G.start(prevK);
        prev = Query.run({ ...base(), range: [ps, Math.min(ps + len, G.end(prevK))], groupBy: null }).total;
      }
      rows.push({ key: k, label: Dates.periodLabel(grain, k), sub: sub.range, partial: sub.partial, cur: d || null, prev });
    }
    return { rows, source: res.source, unapplied: res.unapplied || [] };
  }

  function lifetime() {
    const b = DataStore.bounds();
    const res = totals(null);
    return { total: res.total, bounds: b, source: res.source, unapplied: res.unapplied || [] };
  }

  /* dimension table: current + comparison, share of total, attributes */
  /* group = 'campaign' or composite 'keyword+matchType+campaign+portfolio' (1:1 attributes ride along in the key) */
  function byDim(group) {
    const dims = group.split('+');
    const { cur, cmp } = State.ranges();
    const c = Query.run({ ...base(), range: cur, groupBy: group });
    if (c.empty && !c.groups.size) return { rows: [], missing: c.missingDim ? dims[0] : null, total: c.total, source: c.source, unapplied: c.unapplied || [] };
    const p = cmp ? Query.run({ ...base(), range: cmp, groupBy: group }) : null;
    const tot = c.total?.v || {};
    const rows = [];
    for (const [label, g] of c.groups) {
      const parts = String(label).split('\u0001');
      if (!parts[0]) continue;
      const pg = p?.groups.get(label);
      rows.push({
        id: parts[0], key: label, ...Object.fromEntries(dims.map((d, j) => [d, parts[j]])),
        m: g.v, cov: g.cov, prev: pg ? pg.v : null,
        share: { adSpend: tot.adSpend ? g.v.adSpend / tot.adSpend * 100 : null, adSales: tot.adSales ? (g.v.adSales ?? 0) / tot.adSales * 100 : null },
      });
    }
    return { rows, total: c.total, prevTotal: p?.total || null, source: c.source, unapplied: c.unapplied || [] };
  }

  /* breakdown for donuts */
  function breakdown(dim, metric) {
    const { cur } = State.ranges();
    const res = Query.run({ ...base(), range: cur, groupBy: dim });
    const segs = [...res.groups].filter(([k]) => k).map(([label, g]) => ({ label, value: g.v[metric] || 0 })).sort((a, b) => b.value - a.value);
    return { segs, total: res.total?.v?.[metric] ?? null, source: res.source, unapplied: res.unapplied || [], missing: res.empty && !res.source };
  }

  return { kpis, trend, periods, lifetime, byDim, breakdown, totals };
})();

   Generated at the same grains Amazon reports (campaign, placement,

const DemoData = (() => {

    ['SD – Contextual Competitor', 'SD', 'SD Contextual', 'Competitor Conquest', 0.3, 0.5, 0.22, 4.9, 30, [['category="Medical Scrubs"', 'Product', 'Contextual']], ['B0VELT0002', 'B0VELT0003']],
  ];
  const MARKETS = [
    { mk: 'US', unit: 950, fx: 1, price: 1, accounts: p => (p === 'Outerwear' || p === 'Accessories') ? 'Scrubwear Outfitters' : 'Scrubwear Media', pick: null },
    { mk: 'UK', unit: 210, fx: 0.79, price: 1, accounts: () => 'Scrubwear Media UK', pick: [0, 2, 3, 5, 6, 8, 13, 16] },
    { mk: 'IN', unit: 260, fx: 83, price: 0.32, accounts: () => 'Scrubwear Media India', pick: [0, 2, 3, 4, 6, 7, 10, 14] },
  ];
  const MODIFIERS = ['', ' plus size', ' for women', ' petite', ' cheap', ' tall', ' set', ' men'];
  const AUTO_TERMS = ['scrubs women', 'scrub pants', 'nurse scrubs set', 'b0hald2231', 'womens joggers scrubs', 'medical uniforms', 'cheap scrubs', 'scrub top pockets'];

  function placementsFor(adType, campaign) {
    if (adType === 'SB') return [['Top of Search', 0.7, 1.15, 1.2, 1.15], ['Rest of Search', 0.3, 0.85, 0.7, 0.85]];
    if (adType === 'SD') return [['Product Pages', 0.72, 1, 1.1, 1.05], ['Off-Amazon', 0.28, 0.8, 0.5, 0.7]];
    if (/Brand/.test(campaign)) return [['Top of Search', 0.62, 1.15, 1.4, 1.12], ['Rest of Search', 0.23, 0.95, 0.8, 0.92], ['Product Pages', 0.15, 0.8, 0.45, 0.78]];
    if (/ASIN/.test(campaign)) return [['Top of Search', 0.1, 1.2, 1.2, 1.1], ['Rest of Search', 0.15, 1, 0.9, 1], ['Product Pages', 0.75, 0.9, 1, 0.95]];
    if (/Auto/.test(campaign)) return [['Top of Search', 0.25, 1.2, 1.5, 1.2], ['Rest of Search', 0.3, 1, 0.9, 0.95], ['Product Pages', 0.45, 0.82, 0.6, 0.85]];
    return [['Top of Search', 0.45, 1.22, 1.5, 1.2], ['Rest of Search', 0.33, 0.95, 0.8, 0.88], ['Product Pages', 0.22, 0.78, 0.45, 0.72]];
  }

  function seasonality(d) {
    const [y, m, dd] = Dates.ymd(d);
    const growth = 1 + 0.24 * (d - START) / 365;
    const month = [0.88, 0.9, 1, 1, 1.02, 0.98, 1.05, 1.08, 1.1, 1.06, 1.25, 1.18][m];
    let event = 1;
    if (y === 2025 && m === 6 && dd >= 8 && dd <= 11) event = 2.1;   // Prime Day 2025
    if (y === 2026 && m === 6 && dd >= 14 && dd <= 17) event = 2.2;  // Prime Day 2026
    if (m === 10 && dd >= 25) event = 1.7;                            // BFCM
    const wd = [1.05, 1.08, 1.02, 1, 0.98, 0.92, 0.95][Dates.weekday(d)];
    return growth * month * event * wd;
  }

  /* Split a totals object across parts, reconciling exactly. part: {w, cpc, ctr, cvr, aov} multipliers */
  const INT = new Set(Config.BASE_METRICS.filter(m => m.fmt === 'int').map(m => m.key));
  function split(tot, parts, skip) {
    const wc = parts.map(p => p.w / p.cpc);
    const weights = {
      adSpend: parts.map(p => p.w), clicks: wc, impressions: parts.map((p, i) => wc[i] / p.ctr),
      orders: parts.map((p, i) => wc[i] * p.cvr), adSales: parts.map((p, i) => wc[i] * p.cvr * p.aov),
    };
    weights.units = weights.orders; weights.ntbOrders = weights.orders;
    weights.sameSkuSales = weights.otherSkuSales = weights.ntbSales = weights.adSales;
    weights.dpv = weights.clicks; weights.videoViews = weights.viewableImpressions = weights.engagements = weights.impressions;
    const out = parts.map(() => ({}));
    for (const key of Object.keys(tot)) {
      const v = tot[key];
      if (v == null || skip.includes(key)) { out.forEach(o => { o[key] = null; }); continue; }
      const w = weights[key] || weights.adSpend;
      const sw = w.reduce((a, b) => a + b, 0) || 1;
      let cum = 0, prev = 0;
      for (let i = 0; i < parts.length; i++) {
        cum += v * w[i] / sw;
        if (INT.has(key)) { const r = Math.round(cum); out[i][key] = r - prev; prev = r; }
        else out[i][key] = i === parts.length - 1 ? v - prev : +(v * w[i] / sw).toFixed(2), prev += out[i][key];
      }
    }
    return out;
  }

  function generate() {
    const r = rng(20260922);
    const fileId = 'demo';
    const T = DataStore.tables;
    let rows = 0;
    for (const M of MARKETS) {
      const camps = M.pick ? M.pick.map(i => CAMPAIGNS[i]) : CAMPAIGNS;
      for (const C of camps) {
        const [name, adType, campaignType, portfolio, weight, cpc0, ctr0, cvr0, aov0, targets, asins] = C;
        const dims = { marketplace: M.mk, account: M.accounts(portfolio), adType, campaignType, portfolio, campaign: name,
          targeting: campaignType === 'SP Auto' ? 'Auto' : 'Manual', fileId };
        const places = placementsFor(adType, name);
        const constrained = /Brand Defense/.test(name);
        for (let d = START; d <= END; d++) {
          const recent = Math.max(0, Math.min(1, (d - (END - 120)) / 120)); // 0 → 1 over last 120 days
          const progress = (d - START) / (END - START);
          let vol = seasonality(d) * (0.88 + r() * 0.24);
          let cvrM = 0.94 + r() * 0.12, cpcM = 0.95 + r() * 0.1, ctrM = 0.94 + r() * 0.12;
          if (name === 'Category Discovery – Phrase') cvrM *= 1 - 0.3 * recent;
          if (name === 'Jackets – Exact') { cvrM *= 1 + 0.35 * recent; const m = Dates.ymd(d)[1]; if (m >= 9 || m <= 1) vol *= 1.45; }
          if (name === 'Competitor Keywords – Phrase') vol *= 1 + 0.6 * progress;
          if (name === 'Auto – Loose Match') cpcM *= 1 + 0.2 * recent;
          const cpc = cpc0 * cpcM * M.fx * M.price;
          let spend = M.unit * weight * vol * M.fx * M.price;
          const clicks = Math.max(0, Math.round(spend / cpc));
          spend = +(clicks * cpc).toFixed(2);
          const impressions = Math.round(clicks / (ctr0 * ctrM / 100));
          const orders = Math.floor(clicks * cvr0 * cvrM / 100 + r());
          const units = orders + Math.floor(orders * 0.08 + r());
          const sales = +(orders * aov0 * M.fx * M.price * (0.92 + r() * 0.16)).toFixed(2);
          const tot = { adSpend: spend, adSales: sales, impressions, clicks, orders, units,
            dpv: null, sameSkuSales: null, otherSkuSales: null, ntbOrders: null, ntbSales: null, incrementalSales: null,
            budget: null, reach: null, videoViews: null, viewableImpressions: null, engagements: null, tosIs: null, searchIs: null };
          if (adType === 'SP') { const same = +(sales * (0.78 + r() * 0.08)).toFixed(2); tot.sameSkuSales = same; tot.otherSkuSales = +(sales - same).toFixed(2); }
          if (adType !== 'SP') {
            tot.dpv = Math.round(clicks * (1.4 + r() * 0.3));
            tot.ntbOrders = Math.round(orders * (0.3 + r() * 0.18));
            tot.ntbSales = +(tot.ntbOrders * aov0 * M.fx * M.price).toFixed(2);
            tot.viewableImpressions = Math.round(impressions * (0.58 + r() * 0.1));
            tot.videoViews = campaignType === 'SB Video' || adType === 'SD' ? Math.round(impressions * (0.12 + r() * 0.08)) : 0;
          }
          if (adType === 'SD') { tot.engagements = Math.round(clicks * (0.35 + r() * 0.1)); }
          const camp = { ...tot, budget: +(M.unit * weight * seasonality(d) * M.fx * M.price * (constrained ? 1.02 : 1.35)).toFixed(2) };
          if (adType === 'SP') camp.tosIs = +(constrained ? 62 + r() * 18 : 9 + r() * 22).toFixed(2);
          if (adType === 'SD') camp.reach = Math.round(impressions / (2.1 + r() * 0.5));
          T.campaign.push(d, dims, camp); rows++;

          // placements (TOS share drifts up over time → placement shift insight)
          const pl = places.map(([p, w, cpcm, ctrm, cvrm]) => ({ name: p, w: w * (p === 'Top of Search' ? 1 + 0.25 * progress : 1) * (0.9 + r() * 0.2), cpc: cpcm, ctr: ctrm, cvr: cvrm, aov: 1 }));
          split(tot, pl, ['tosIs', 'searchIs']).forEach((m, i) => { T.placement.push(d, { ...dims, placement: pl[i].name }, m); rows++; });

          // targeting
          const tg = targets.map(([k], i) => { const h = hash(k + name); return { w: (1 + (h % 7) / 4) * (0.85 + r() * 0.3), cpc: 0.85 + (h % 5) / 10, ctr: 1, cvr: 0.75 + ((h >> 3) % 6) / 10, aov: 1 }; });
          const tRows = split(tot, tg, ['tosIs', 'searchIs']);
          tRows.forEach((m, i) => {
            const [kw, match, kwType] = targets[i];
            const kd = { ...dims, keyword: kw, matchType: match, keywordType: kwType };
            T.keyword.push(d, kd, m); rows++;
            if (adType === 'SD' || match === 'Product') return;
            // search terms for this target
            const base = match === 'Auto' ? AUTO_TERMS.filter((_, j) => (hash(kw) >> j) & 1).slice(0, 3) : [kw, kw + MODIFIERS[1 + hash(kw) % 7]];
            const st = base.map(s => { const h = hash(s + kw); const cheap = / cheap|b0hald/.test(s); return { term: s, w: 0.6 + (h % 9) / 6, cpc: 1, ctr: 0.8 + (h % 4) / 8, cvr: cheap ? 0.12 : 0.7 + ((h >> 4) % 7) / 10, aov: 1 }; });
            split(m, st, ['tosIs', 'searchIs']).forEach((sm, j) => {
              sm.searchIs = adType === 'SP' ? +(4 + (hash(st[j].term) % 30) + r() * 4).toFixed(2) : null;
              T.searchTerm.push(d, { ...kd, searchTerm: st[j].term }, sm); rows++;
            });
          });

          // advertised products
          const ap = asins.map(a => { const h = hash(a + name); const oos = CATALOG[a][3] === 'Out of Stock' && d > END - 18; const supp = CATALOG[a][3] === 'Suppressed'; return { w: (1 + (h % 5) / 3) * (supp ? 0.25 : 1), cpc: 1, ctr: 1, cvr: (0.8 + (h % 5) / 10) * (oos ? 0.12 : 1), aov: 1 }; });
          split(tot, ap, ['tosIs', 'searchIs']).forEach((m, i) => {
            const a = asins[i], [title, brand, category, status] = CATALOG[a];
            T.asin.push(d, { ...dims, asin: a, title, brand, category, asinStatus: status }, m); rows++;
          });
        }
      }
    }
    const b = DataStore.bounds();
    DataStore.registerFile({ id: fileId, name: 'Demo dataset (synthetic)', source: 'all', rows, minDay: b.min, maxDay: b.max, importedAt: Date.now(), demo: true });
    DataStore.isDemo = true;
  }
  return { generate };
})();

const DataTable = (() => {
