      ${W.mapping.date == null ? `<label>${esc(t('imp.dateOverride'))}<input type="date" id="w-date" class="text-in" value="${esc(W.settings.dateOverride || '')}"><span class="fine">${esc(t('imp.dateOverrideHint'))}</span></label>` : ''}
      <label>${esc(t('imp.brandTerms'))}<input id="w-brand" class="text-in" value="${esc(State.get().brandTerms)}" placeholder="${esc(t('imp.brandTermsPh'))}"><span class="fine">${esc(t('imp.brandTermsHint'))}</span></label>
      ${W.mapping.orders == null && W.mapping.units != null ? `<label class="chk-block"><span><input type="checkbox" id="w-units-orders" ${W.settings.unitsAsOrders ? 'checked' : ''}> ${esc(t('imp.unitsAsOrders'))}</span><span class="fine">${esc(t('imp.unitsAsOrdersHint'))}</span></label>` : ''}
      ${det.bulk ? `<label>${esc(t('imp.entity'))}<select id="w-entity" class="period-select">${entityValues().map(v => `<option ${W.settings.entity === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select><span class="fine">${esc(t('imp.entityHint'))}</span></label>` : ''}
    </div>
    <h4 class="sub-h">${esc(t('imp.headersRead', { n: W.headers.filter(Boolean).length }))}</h4>
    <div class="hdr-chips">${W.headers.map((h, i) => { const mapped = Object.entries(W.mapping).find(([, c]) => c === i); const un = W.unmapped.find(u => u.i === i); return `<span class="hchip ${mapped ? 'ok' : un?.status}">${esc(h || '(blank)')}${mapped ? ` → ${esc(t('field.' + mapped[0]))}` : un?.status === 'recalculated' ? ` · ${esc(t('imp.recalc'))}` : ''}</span>`; }).join('')}</div>`;
  }
  function entityValues() { if (W.server) return W.entities || []; const c = W.mapping.entity; return [...new Set(W.rows.slice(0, 5000).map(r => String(r[c] || '')).filter(Boolean))]; }

  function mapScreen() {
    const opt = sel => `<option value="">${esc(t('imp.notMapped'))}</option>` + W.headers.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h || `#${i + 1}`)}</option>`).join('');
    const sample = f => W.mapping[f] == null ? '' : W.rows.slice(0, 3).map(r => r[W.mapping[f]]).map(v => v instanceof Date ? v.toISOString().slice(0, 10) : String(v ?? '')).filter(Boolean).join(' · ');
    const row = f => `<tr class="${Config.REQUIRED_FIELDS.includes(f) ? 'req' : ''}"><td class="txt"><strong>${esc(t('field.' + f))}</strong>${Config.REQUIRED_FIELDS.includes(f) ? ` <span class="req-tag">${esc(t('imp.required'))}</span>` : ''}</td>
      <td class="txt"><select class="mini-select" data-map="${f}" id="map-${f}">${opt(W.mapping[f])}</select></td>
      <td class="txt">${W.mapping[f] != null ? `<span class="conf c-${W.confidence[f] || 'manual'}">${esc(t('imp.conf.' + (W.confidence[f] || 'manual')))}</span>` : ''}</td>
      <td class="txt sample" title="${esc(sample(f))}">${esc(sample(f))}</td></tr>`;
    const dimF = Config.DIM_FIELDS, metF = Config.BASE_METRICS.map(m => m.key);
    const preview = W.rows.slice(0, 6);
    const pvFields = ['date', 'campaign', 'adType', 'keyword', 'placement', 'asin', 'adSpend', 'adSales', 'clicks', 'orders'].filter(f => W.mapping[f] != null);
    return `<p class="fine">${esc(t('imp.mapHelp'))}</p>
      <div class="map-cols"><div><h4 class="sub-h">${esc(t('imp.dimensions'))}</h4><div class="table-frame static tall"><table class="detail-table map"><thead><tr><th class="txt">${esc(t('set.field'))}</th><th class="txt">${esc(t('imp.column'))}</th><th class="txt">${esc(t('imp.match'))}</th><th class="txt">${esc(t('imp.sample'))}</th></tr></thead><tbody>${dimF.map(row).join('')}</tbody></table></div></div>
      <div><h4 class="sub-h">${esc(t('imp.metrics'))}</h4><div class="table-frame static tall"><table class="detail-table map"><thead><tr><th class="txt">${esc(t('set.field'))}</th><th class="txt">${esc(t('imp.column'))}</th><th class="txt">${esc(t('imp.match'))}</th><th class="txt">${esc(t('imp.sample'))}</th></tr></thead><tbody>${metF.map(row).join('')}</tbody></table></div></div></div>
      ${W.unmapped.length ? `<p class="fine">${esc(t('imp.unmappedList'))} ${W.unmapped.map(u => `${u.header} (${t('imp.st.' + u.status)})`).map(esc).join(', ')}</p>` : ''}
      <h4 class="sub-h">${esc(t('imp.previewTitle'))}</h4>
      <div class="table-frame static"><table class="detail-table"><thead><tr>${pvFields.map(f => `<th class="txt">${esc(t('field.' + f))}</th>`).join('')}</tr></thead><tbody>${preview.map(r => `<tr>${pvFields.map(f => { const v = r[W.mapping[f]]; return `<td class="txt">${esc(v instanceof Date ? v.toISOString().slice(0, 10) : v ?? '')}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function reviewScreen() {
    const R = W.result;
    let ok = 0, warn = 0, err = 0, dup = 0, total;
    if (R.counts) ({ ok, warn, err, dup, total } = R.counts);
    else total = W.rows.length;
    const errors = R.issues.filter(i => i.severity === 'error'), warnings = R.issues.filter(i => i.severity === 'warning');
    const issueRow = i => `<tr><td class="txt"><span class="sev ${i.severity}">${icon(i.severity === 'error' ? 'error' : 'alert')}${esc(t('imp.sev.' + i.severity))}</span></td><td class="txt"><strong>${esc(t('val.' + i.rule))}</strong><br><span class="fine">${esc(t('val.' + i.rule + '.hint'))}</span></td><td class="txt">${esc(i.field ? t('field.' + i.field) : '—')}</td><td class="num">${!i.rows.length && ['missingColumn', 'optionalMissing', 'missingMarketplace', 'unitsAsOrders'].includes(i.rule) ? esc(t('imp.allRows')) : I18n.int(i.count, false)}</td><td class="txt">${esc(i.rows.join(', '))}${i.count > i.rows.length && i.rows.length ? '…' : ''}</td></tr>`;
    const overlaps = R.overlaps || ImportService.overlaps(W, R);
    W.replaceIds = W.replaceIds.filter(id => overlaps.some(o => o.id === id));
    return `<div class="det-grid four">
      <div class="det-card"><span class="lbl">${esc(t('imp.total'))}</span><strong>${I18n.int(total, false)}</strong></div>
      <div class="det-card good"><span class="lbl">${esc(t('imp.valid'))}</span><strong>${I18n.int(ok + warn, false)}</strong><span class="fine">${esc(t('imp.withWarnings', { n: I18n.int(warn, false) }))}</span></div>
      <div class="det-card bad"><span class="lbl">${esc(t('imp.errors'))}</span><strong>${I18n.int(err, false)}</strong><span class="fine">${esc(t('imp.excluded'))}</span></div>
      <div class="det-card warn"><span class="lbl">${esc(t('imp.duplicates'))}</span><strong>${I18n.int(dup, false)}</strong><span class="fine">${esc(t('imp.excluded'))}</span></div>
    </div>
    ${W.source === Config.MULTI && R.grains ? `<div class="notice">${icon('layers')}<span>${esc(t('imp.grains', { list: R.grains.map(g => t('grain.' + g)).join(' · ') }))}</span></div>` : ''}
    ${R.blocked ? `<div class="notice error">${icon('error')}<span>${esc(t('imp.blocked'))}</span></div>` : ''}
    ${R.issues.length ? `<div class="table-frame static tall"><table class="detail-table"><thead><tr><th class="txt">${esc(t('imp.severity'))}</th><th class="txt">${esc(t('imp.issue'))}</th><th class="txt">${esc(t('set.field'))}</th><th class="num">${esc(t('imp.rowsAffected'))}</th><th class="txt">${esc(t('imp.sampleRows'))}</th></tr></thead><tbody>${[...errors, ...warnings].map(issueRow).join('')}</tbody></table></div>
      <button type="button" class="link-btn" data-wiz="issues-csv">${icon('download')} ${esc(t('imp.downloadIssues'))}</button>` : `<div class="notice ok">${icon('check')}<span>${esc(t('imp.clean'))}</span></div>`}
    <div class="opt-list">
      ${DataStore.isDemo && !W.server ? `<label class="chk"><input type="checkbox" id="w-replace-demo" ${W.replaceDemo ? 'checked' : ''}> ${esc(t('imp.replaceDemo'))}</label>` : ''}
      ${overlaps.map(o => `<label class="chk"><input type="checkbox" data-replace-id="${esc(o.id)}" ${W.replaceIds.includes(o.id) ? 'checked' : ''}> ${esc(t('imp.replaceOverlap', { file: o.name, range: I18n.range(o.minDay, o.maxDay) }))}</label>`).join('')}
    </div>`;
  }

  function readyCount() { return W.result.ready; }
  function doneScreen() {
    const d = W.done || {};
    const item = (k, ok) => `<li class="${ok ? 'done' : ''}">${ok ? icon('check') : '<span class="spinner sm"></span>'}${esc(t('imp.step.' + k))}</li>`;
    return `<ul class="progress-list">${item('import', d.imported)}${item('build', d.built)}${item('refresh', d.refreshed)}</ul>
      ${W.screen === 'done' ? `<div class="notice ok">${icon('check')}<span>${esc(t('imp.success', { n: I18n.int(d.rows, false), source: t('source.' + W.source), range: I18n.range(d.min, d.max), mk: d.marketplaces.join(', ') }))}</span></div>` : ''}`;
  }

  /* ---------- flow */
  /* server mode: Python parses the file and proposes the mapping */
  function applyInspect(res, keepSettings) {
    W.server = true; W.token = res.token;
    W.parsed = { kind: res.kind, sheets: res.sheets.map(x => ({ name: x.name, rows: x.rows })) };
    W.sheetIdx = res.sheetIdx; W.headerRow = res.headerRow; W.headers = res.headers;
    W.rows = res.sample; W.totalRows = res.totalRows; W.totalApprox = res.totalApprox; W.entities = res.entities; W.file = W.file || { name: res.fileName, size: res.size };
    W.mapping = res.mapping; W.confidence = res.confidence; W.unmapped = res.unmapped;
    const prev = W.settings || {};
    W.source = res.source;
    W.settings = { adType: res.adType || (keepSettings && prev.adType) || 'SP', marketplace: prev.marketplace || '', account: prev.account || '', dateOverride: prev.dateOverride || '', unitsAsOrders: prev.unitsAsOrders ?? true };
    if (res.bulk) { const ev = res.entities; W.settings.entity = ev.find(v => /keyword/i.test(v)) || ev[0]; sourceFromEntity(W.settings.entity); }
  }
  function sourceFromEntity(v) { if (/keyword|target/i.test(v)) W.source = 'keyword'; else if (/product ad/i.test(v)) W.source = 'asin'; else if (/campaign/i.test(v)) W.source = 'campaign'; }
  async function reinspect(keepHeader) {
    W.error = null;
    try { applyInspect(await Api.inspect({ token: W.token, sheetIdx: W.sheetIdx, headerRow: keepHeader ? W.headerRow : null, synonyms: State.get().synonyms }), true); }
    catch (e) { W.error = e.message; }
    draw();
  }
  function serverPayload() {
    const st = State.get();
    return { token: W.token, sheetIdx: W.sheetIdx, headerRow: W.headerRow, mapping: W.mapping, source: W.source, replaceIds: W.replaceIds,
      settings: { ...W.settings, brandTerms: st.brandTerms, competitorTerms: st.competitorTerms } };
  }

  async function handleFile(file) {
    W.file = file; W.error = null; W.screen = 'reading'; W.step = 1; W.server = Api.enabled; draw();
    try {
      if (W.server) {
        const maxMb = Api.limits.maxUploadMb;
        if (maxMb && file.size > maxMb * 1024 * 1024) throw new Error(t('api.tooLarge', { mb: I18n.int(maxMb, false) }));
        const res = await Api.upload(file, p => {
          const msg = document.getElementById('up-msg'), bar = document.getElementById('up-bar');
          if (bar) bar.style.width = Math.round(p * 100) + '%';
          if (msg) msg.textContent = p < 1 ? t('api.uploading', { file: file.name, pct: Math.round(p * 100) }) : t('api.processing', { file: file.name });
        });
        applyInspect(res); W.screen = 'detect'; W.step = 2; draw(); return;
      }
      W.parsed = await ImportService.readFile(file);
      W.sheetIdx = Math.max(0, W.parsed.sheets.findIndex(s => /sponsored|campaign|report|search|target|placement|advertised/i.test(s.name)));
      prepareSheet();
      W.screen = 'detect'; W.step = 2; draw();
    } catch (e) { W.error = e.message; W.screen = 'upload'; W.step = 0; draw(); }
  }
  function prepareSheet(keepHeader) {
    const sh = W.parsed.sheets[W.sheetIdx];
    if (!keepHeader) W.headerRow = ImportService.detectHeaderRow(sh.rows);
    W.headers = (sh.rows[W.headerRow] || []).map(h => String(h ?? '').trim());
    W.rows = sh.rows.slice(W.headerRow + 1).filter(r => r.some(v => v !== '' && v != null));
    // streamed text files: only the first rows are in memory; the rest are read during validation
    W.totalRows = W.parsed.streaming ? (W.parsed.approxRows != null ? Math.max(0, W.parsed.approxRows - W.headerRow - 1) : null) : W.rows.length;
    W.totalApprox = !!W.parsed.streaming && W.rows.length >= 900;
    const m = ImportService.refineMapping(ImportService.autoMap(W.headers), W.rows);
    W.mapping = m.mapping; W.confidence = m.confidence; W.unmapped = m.unmapped;
    const det = ImportService.detectSource(W.mapping, sh.name, W.file.name);
    W.source = det.source;
    W.settings = { adType: det.adType || 'SP', marketplace: W.settings.marketplace || '', account: W.settings.account || '', dateOverride: W.settings.dateOverride || '', unitsAsOrders: W.settings.unitsAsOrders ?? true };
    if (det.bulk) { const ev = entityValues(); W.settings.entity = ev.find(v => /keyword/i.test(v)) || ev[0]; if (/keyword|target/i.test(W.settings.entity)) W.source = 'keyword'; else if (/product ad/i.test(W.settings.entity)) W.source = 'asin'; else if (/campaign/i.test(W.settings.entity)) W.source = 'campaign'; }
  }
  function readDetectForm() {
    const v = id => document.getElementById(id)?.value;
    W.source = v('w-source') || W.source;
    W.settings.adType = v('w-adtype') || W.settings.adType;
    W.settings.marketplace = v('w-mk') ?? W.settings.marketplace;
    W.settings.account = (v('w-account') || '').trim().slice(0, 120);
    if (document.getElementById('w-date')) W.settings.dateOverride = v('w-date');
    if (document.getElementById('w-entity')) W.settings.entity = v('w-entity');
    const uo = document.getElementById('w-units-orders'); if (uo) W.settings.unitsAsOrders = uo.checked;
    const br = document.getElementById('w-brand'); if (br && br.value !== State.get().brandTerms) State.set({ brandTerms: br.value.slice(0, 500) }, { silent: true });
  }
  function setProgress(p) {
    W.progress = p;
    const bar = document.querySelector('.progress i'); if (bar) bar.style.width = Math.round(p * 100) + '%';
    const lbl = document.getElementById('val-pct'); if (lbl) lbl.textContent = Math.round(p * 100) + '%';
  }
  function localCtx() {
    const base = { mapping: W.mapping, settings: W.settings, headerRow: W.headerRow, source: W.source, sample: W.rows };
    if (!W.parsed.streaming) return { ...base, rows: W.rows };
    const sh = W.parsed.sheets[W.sheetIdx], headerNo = sh.rowNos[W.headerRow], size = W.file.size;
    return { ...base, stream: () => ImportService.dataRows(W.file, headerNo, bytes => setProgress(Math.min(0.99, bytes / size))) };
  }
  async function runValidate() {
    W.error = null; W.screen = 'validating'; W.step = 5; W.progress = 0; draw(); working = true;
    try {
      W.result = W.server ? await Api.validate(serverPayload()) : await ImportService.validate(localCtx(), setProgress);
      W.screen = 'review'; W.step = 6;
    } catch (e) { W.error = e.message; W.screen = 'map'; W.step = 3; }
    working = false; draw();
  }
  async function commit() {
    working = true; W.screen = 'committing'; W.step = 7; W.done = {}; draw();
    await new Promise(r => setTimeout(r, 30));
    let info;
    try {
      if (W.server) {
        const meta = await Api.commit(serverPayload());
        info = { id: meta.id, min: meta.minDay, max: meta.maxDay, marketplaces: meta.marketplaces };
        W.done = { imported: true, rows: meta.rows, ...info }; W.step = 8; draw();
        await Api.loadData();   // rebuild the reporting dataset from the database
      } else {
        info = ImportService.commit({ source: W.source, fileName: W.file.name.replace(/\.(gz|zip)$/i, ''), sheetName: W.parsed.sheets[W.sheetIdx].name, kind: W.parsed.kind }, W.result, { replaceDemo: W.replaceDemo && DataStore.isDemo, replaceIds: W.replaceIds });
        W.done = { imported: true, rows: W.result.ready, ...info }; W.step = 8; draw();
        await new Promise(r => setTimeout(r, 30));
      }
    } catch (e) { working = false; W.error = e.message; W.screen = 'review'; W.step = 6; draw(); return; }
    DataStore.touch(); await DataStore.persist();
    W.done.built = true; W.step = 9; draw();
    const st = State.get();
    const mk = info.marketplaces.includes(st.marketplace) ? st.marketplace : info.marketplaces[0];
    // keep the chosen date preset only if it still returns rows for the new data
    const noFilters = Object.fromEntries(Config.FILTER_DIMS.map(d => [d, []]));
    State.set({ marketplace: mk, filters: noFilters }, { silent: true });
    const rg = State.ranges();
    const rows = rg.cur ? Query.run({ filters: noFilters, marketplace: mk, range: rg.cur, groupBy: null }).total?.rows : 0;
    State.set({ date: rows ? st.date : { ...st.date, preset: 'lifetime' } });
    await new Promise(r => setTimeout(r, 60));
    W.done.refreshed = true; W.step = 10; W.screen = 'done'; working = false; draw();
  }
  function issuesCSV() {
    if (W.server) { const a = document.createElement('a'); a.href = Api.issuesUrl(W.token); a.download = 'import-issues.csv'; document.body.appendChild(a); a.click(); a.remove(); return; }
    const R = W.result;
    const rows = R.issues.map(i => [t('imp.sev.' + i.severity), t('val.' + i.rule), i.field ? t('field.' + i.field) : '', i.count, i.rows.join(' ')]);
    // row-level listing of every excluded row
    const ex = R.excluded.map(([no, reason, row]) => [no, reason === 'error' ? t('imp.sev.error') : t('val.duplicate'), ...row.map(v => v instanceof Date ? v.toISOString().slice(0, 10) : v)]);
    Exporter.csv('import-issues.csv', [t('imp.severity'), t('imp.issue'), t('set.field'), t('imp.rowsAffected'), t('imp.sampleRows')], [...rows, [], [t('imp.excludedRows')], ['Row', t('imp.issue'), ...W.headers], ...ex]);
  }

  function init() {
    document.addEventListener('click', e => {
      if (!W) return;
      const b = e.target.closest('[data-wiz]'); if (!b) return;
      const a = b.dataset.wiz;
      if (a === 'close') close();
      if (a === 'back') { W = fresh(); draw(); }
      if (a === 'to-detect') { W.screen = 'detect'; W.step = 2; draw(); }
      if (a === 'to-map') { if (W.screen === 'detect') { readDetectForm(); W.step = 3; } else W.step = 3; W.screen = 'map'; W.error = null; draw(); }
      if (a === 'validate') {
        const miss = Config.REQUIRED_FIELDS.filter(f => W.mapping[f] == null && !(f === 'date' && W.settings.dateOverride));
        if (miss.length) { W.error = t('imp.err.required', { fields: miss.map(f => t('field.' + f)).join(', ') }); draw(); return; }
        W.step = 4; runValidate();
      }
      if (a === 'commit') commit();
      if (a === 'issues-csv') issuesCSV();
      if (a === 'another') { W = fresh(); draw(); }
      if (a === 'finish') { W = null; App.modal(null); App.toast(t('imp.done')); }
    });
    document.addEventListener('change', e => {
      if (!W) return;
      const el = e.target;
      if (el.id === 'imp-file' && el.files[0]) handleFile(el.files[0]);
      if (el.id === 'w-sheet') { readDetectForm(); W.sheetIdx = +el.value; if (W.server) return reinspect(false); prepareSheet(); draw(); }
      if (el.id === 'w-header') { readDetectForm(); W.headerRow = Math.max(0, +el.value - 1); if (W.server) return reinspect(true); prepareSheet(true); draw(); }
      if (el.id === 'w-entity') { readDetectForm(); sourceFromEntity(el.value); draw(); }
      if (el.dataset.map) { const f = el.dataset.map; if (el.value === '') delete W.mapping[f]; else { W.mapping[f] = +el.value; W.confidence[f] = 'manual'; } draw(); }
      if (el.id === 'w-replace-demo') W.replaceDemo = el.checked;
      if (el.dataset.replaceId) { const id = el.dataset.replaceId; W.replaceIds = el.checked ? [...W.replaceIds, id] : W.replaceIds.filter(x => x !== id); }
    });
    ['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest && e.target.closest('#dropzone'); if (dz) { e.preventDefault(); dz.classList.add('over'); } }));
    document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('#dropzone'); if (dz) dz.classList.remove('over'); });
    document.addEventListener('drop', e => { const dz = e.target.closest && e.target.closest('#dropzone'); if (dz && W) { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handleFile(f); } });
  }
  return { open, init, busy: () => working };
})();

/* ===== views.js ===== */
/* ==========================================================================
   VIEWS — one render function per sidebar page. Views compose reusable
   components (KPI cards, charts, tables); they never compute metrics.
   ========================================================================== */
const Views = (() => {
  const KPI_KEYS = ['adSpend', 'adSales', 'roas', 'acos', 'impressions', 'clicks', 'orders', 'ctr'];
  const SEGMENTS = ['highSpendLowSales', 'highSalesLowSpend', 'highRoas', 'lowRoas', 'highCvr', 'lowCvr'];
  const local = { segment: null, insightKind: 'all', effMetric: 'roas', aiText: null, aiState: 'idle', csvReport: 'campaign' };

  /* ---------- shared building blocks */
  function card({ kicker, title, sub, right = '', body, id = '' }) {
    return `<section class="report-section" ${id ? `id="${id}"` : ''}><article class="surface report-card">
      <div class="report-header"><div><div class="report-kicker">${esc(kicker)}</div><h2 class="report-title">${esc(title)}</h2>${sub ? `<p class="report-subtitle">${esc(sub)}</p>` : ''}</div>${right}</div>
      ${body}</article></section>`;
  }
  function notice(res) {
    const parts = [];
    if (res && res.unapplied && res.unapplied.length) parts.push(t('notice.unapplied', { dims: res.unapplied.map(d => I18n.dim(d)).join(', '), source: t('source.' + res.source) }));
    return parts.length ? `<div class="notice">${icon('info')}<span>${esc(parts.join(' '))}</span></div>` : '';
  }
  function missing(dimLabel, reportLabel) {
    return `<div class="empty-state">${icon('database')}<h3>${esc(t('empty.title', { dim: dimLabel }))}</h3><p>${esc(t('empty.body', { report: reportLabel }))}</p>${State.can('import') ? `<button type="button" class="action-btn export" data-act="import">${icon('upload')}${esc(t('hdr.import'))}</button>` : ''}</div>`;
  }
  function kpiCard(key, cur, prev, cov) {
    const st = State.get();
    const partial = cov != null && cov > 0 && cov < 0.995;
    let delta = '';
    if (st.compareOn) delta = prev ? Fmt.deltaHTML(key, cur, prev[key]) : `<span class="delta none">${esc(t('common.noComparison'))}</span>`;
    return `<article class="surface kpi-card"><p class="kpi-label">${esc(I18n.metricLabel(key))}${partial ? ` <span class="cov" title="${esc(t('kpi.partial', { pct: I18n.pct(cov * 100, 0) }))}">◐</span>` : ''}</p>
      <p class="kpi-value">${cur == null ? `<span class="na">${esc(t('common.na'))}</span>` : esc(I18n.metric(key, cur))}</p>${delta ? `<p class="kpi-delta">${delta}</p>` : ''}</article>`;
  }
  function kpiGrid(keys = KPI_KEYS) {
    const k = Reports.kpis();
    if (!k.cur || !k.cur.total) return '';
    const V = k.cur.total.v, P = k.prev?.total?.v || null;
    if (!k.cur.total.rows) return `<div class="notice">${icon('info')}<span>${esc(t('kpi.noRows', { range: I18n.range(k.range[0], k.range[1]) }))}</span></div>`;
    return `<section aria-label="${esc(t('kpi.aria'))}" class="kpi-grid">${keys.map(key => kpiCard(key, V[key], P, k.cur.total.cov[key])).join('')}</section>${notice(k.cur)}`;
  }
  const seg = (name, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" class="${String(cur) === String(v) ? 'on' : ''}" data-${name}="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;
  const legend = items => `<div class="legend">${items.map((l, i) => `<span><i class="legend-dot" style="background:var(--c${i + 1})"></i>${esc(l)}</span>`).join('')}</div>`;
  const fmtFor = key => v => I18n.metric(key, v);

  /* ---------- trend (spend vs sales bars + efficiency line) */
  function trendCard() {
    const st = State.get(), tr = Reports.trend(st.trendGrain);
    if (!tr) return '';
    const cats = tr.keys.map(k => ({ label: tr.grain === 'month' ? I18n.monthShort(k) : tr.grain === 'week' ? t('period.wk', { n: Dates.weekNumber(k) }) : tr.grain === 'quarter' ? Dates.periodLabel('quarter', k) : I18n.dateShort(k), full: Dates.periodLabel(tr.grain, k) + (tr.grain === 'week' ? ' · ' + I18n.range(k, k + 6) : '') }));
    const val = key => tr.keys.map(k => tr.groups.get(k)?.v[key] ?? null);
    const bars = Charts.register('bars', { cats, series: [{ label: I18n.metricLabel('adSpend'), values: val('adSpend') }, { label: I18n.metricLabel('adSales'), values: val('adSales') }], fmt: v => I18n.money(v), height: 300,
      extraTip: i => [[null, I18n.metricLabel('roas'), I18n.metric('roas', val('roas')[i])], [null, I18n.metricLabel('orders'), I18n.metric('orders', val('orders')[i])]] });
    const em = local.effMetric;
    const line = Charts.register('line', { cats, series: [{ label: I18n.metricLabel(em), values: val(em) }], fmt: fmtFor(em), height: 190, ci: 0 });
    const right = seg('grain', [['auto', t('grain.auto')], ['day', t('grain.day')], ['week', t('grain.week')], ['month', t('grain.month')]], st.trendGrain);
    return card({ kicker: t('ov.trendKicker'), title: t('ov.trendTitle'), sub: t('ov.trendSub', { grain: t('grain.' + tr.grain) }), right,
      body: `<div class="chart-block">${bars}</div>${legend([I18n.metricLabel('adSpend'), I18n.metricLabel('adSales')])}
        <div class="chart-block split-top"><div class="mini-head"><strong>${esc(t('ov.efficiency'))}</strong>${seg('eff', ['roas', 'acos', 'cpc', 'cvr', 'ctr'].map(k => [k, I18n.metricLabel(k)]), em)}</div>${line}</div>` });
  }

  /* ---------- donut breakdowns (metric + dimension selectable) */
  function donutCard(i) {
    const b = State.get().breakdowns[i];
    const res = Reports.breakdown(b.dim, b.metric);
    const sel = (kind, opts, cur) => `<select class="mini-select" id="bd-${kind}-${i}" data-bd="${i}" data-bd-kind="${kind}" aria-label="${esc(t('ov.' + kind))}">${opts.map(o => `<option value="${o}" ${o === cur ? 'selected' : ''}>${esc(kind === 'metric' ? I18n.metricLabel(o) : I18n.dim(o))}</option>`).join('')}</select>`;
    const chart = res.missing || !res.source ? `<div class="chart-empty" style="height:220px">${esc(t('empty.short', { dim: I18n.dim(b.dim) }))}</div>` :
      Charts.register('donut', { segs: res.segs.map(s => ({ ...s, label: b.dim === 'adType' ? s.label : s.label })), dim: b.dim, center: I18n.metric(b.metric, res.total), centerLabel: t('common.total'), fmt: fmtFor(b.metric), metricLabel: I18n.metricLabel(b.metric) });
    return `<div class="donut-card"><div class="donut-controls">${sel('metric', Config.BREAKDOWN_METRICS, b.metric)}<span class="by">${esc(t('ov.by'))}</span>${sel('dim', Config.BREAKDOWN_DIMS, b.dim)}</div>${chart}${res.unapplied?.length ? `<p class="fine">${esc(t('notice.short', { dims: res.unapplied.map(I18n.dim).join(', ') }))}</p>` : ''}</div>`;
  }
  function breakdownSection(kicker, title, sub) {
    return card({ kicker, title, sub, body: `<div class="donut-grid">${[0, 1, 2].map(donutCard).join('')}</div><p class="print-note">${esc(t('ov.donutHint'))}</p>` });
  }

  /* ---------- insights block */
  function insightItems(list, limit) {
    return list.slice(0, limit).map((ins, i) => `<div class="insight-item tone-${ins.tone}">
      <span class="insight-index">${i + 1}</span>
      <div class="insight-body"><div class="insight-top"><span class="kind k-${ins.kind}">${esc(t('kind.' + ins.kind))}</span><strong>${esc(ins.title)}</strong></div>
        <p><span class="lbl">${esc(t('ins.observation'))}</span>${esc(ins.obs)}</p>
        ${ins.rec ? `<p class="rec"><span class="lbl">${esc(t('ins.recommendation'))}</span>${esc(ins.rec)}</p>` : ''}
        ${ins.link ? `<a class="link-btn" href="#${ins.link}">${esc(t('ins.open', { page: t('nav.' + ins.link.replace('-t', 'T')) }))} →</a>` : ''}</div></div>`).join('');
  }
  function insightsPreview() {
    const list = Insights.build();
    const top = list.find(i => i.rec);
    return card({ kicker: t('ins.kicker'), title: t('ins.title'), sub: t('ins.sub'), right: `<a class="view-all" href="#insights">${esc(t('common.viewAll'))} ↗</a>`,
      body: `<div class="insight-layout"><div class="insight-list">${list.length ? insightItems(list, 4) : `<p class="muted">${esc(t('ins.none'))}</p>`}</div>
      <aside class="takeaway-box"><h3>${esc(t('ins.nextMove'))}</h3><p>${esc(top ? top.rec : t('ins.noRecs'))}</p>${top ? `<p class="fine">${esc(t('ins.basedOn'))} ${esc(top.obs)}</p>` : ''}</aside></div>` });
  }

  /* ---------- pages */
  function overview() {
    const pf = TableDefs.dimRows('portfolio');
    const top = pf.rows.sort((a, b) => (b.m.adSales || 0) - (a.m.adSales || 0)).slice(0, 6);
    const pfChart = top.length ? Charts.register('hbars', { rows: top.map(r => ({ label: r.id, values: [r.m.adSpend, r.m.adSales], filter: { dim: 'portfolio', value: r.id } })), series: [{ label: I18n.metricLabel('adSpend') }, { label: I18n.metricLabel('adSales') }], fmt: v => I18n.money(v) }) : '';
    return kpiGrid() + trendCard() + insightsPreview() +
      breakdownSection(t('ov.mixKicker'), t('ov.mixTitle'), t('ov.mixSub')) +
      card({ kicker: t('pf.kicker'), title: t('ov.topPortfolios'), sub: t('ov.topPortfoliosSub'), right: `<a class="view-all" href="#portfolio">${esc(t('common.viewAll'))} ↗</a>`, body: `<div class="chart-block">${pfChart || `<div class="chart-empty">${esc(t('common.noData'))}</div>`}</div>${legend([I18n.metricLabel('adSpend'), I18n.metricLabel('adSales')])}` });
  }

  function periodPage(grain) {
    const st = State.get(), n = st.periodCounts[grain];
    const res = TableDefs.periodRows(grain, n);
    const rows = res.rows;
    const chrono = [...rows].reverse();
    const chart = Charts.register('bars', { cats: chrono.map(r => ({ label: grain === 'month' ? I18n.monthShort(r.sortKey) : grain === 'week' ? t('period.wk', { n: Dates.weekNumber(r.sortKey) }) : r.label, full: r.label + (r.sub ? ' · ' + r.sub : '') })),
      series: [{ label: I18n.metricLabel('adSpend'), values: chrono.map(r => r.m.adSpend ?? null) }, { label: I18n.metricLabel('adSales'), values: chrono.map(r => r.m.adSales ?? null) }], fmt: v => I18n.money(v), height: 280,
      extraTip: i => [[null, I18n.metricLabel('roas'), I18n.metric('roas', chrono[i].m.roas)]] });
    const counts = { week: [4, 8, 13, 26, 52], month: [3, 6, 12, 18, 24], quarter: [4, 6, 8], year: [2, 3, 5] }[grain];
    const right = `<label class="inline-ctl">${esc(t('period.show'))} <select id="pc-${grain}" data-pcount="${grain}">${counts.map(c => `<option value="${c}" ${c === n ? 'selected' : ''}>${c}</option>`).join('')}</select> ${esc(t('period.unit.' + grain))}</label>`;
    const table = DataTable.render({ id: 'period-' + grain, columns: TableDefs.defs.period('delta'), rows, pageSize: 25, exportName: `${grain}-over-${grain}`, search: false, caption: t('nav.' + { week: 'wow', month: 'mom', quarter: 'qoq', year: 'yoy' }[grain]) });
    const key = { week: 'wow', month: 'mom', quarter: 'qoq', year: 'yoy' }[grain];
    return kpiGrid() + card({ kicker: t(key + '.kicker'), title: t(key + '.title'), sub: t('period.sub', { unit: t('period.unit1.' + grain), end: I18n.date(State.ranges().cur[1]) }), right,
      body: `${notice(res)}<div class="chart-block">${chart}</div>${legend([I18n.metricLabel('adSpend'), I18n.metricLabel('adSales')])}${table}<p class="print-note">${esc(t('period.note', { unit: t('period.unit1.' + grain) }))}</p>` });
  }

  function lifetime() {
    const L = Reports.lifetime();
    if (!L.bounds) return missing(t('nav.lifetime'), t('source.campaign'));
    const res = Query.run({ filters: State.effectiveFilters(), marketplace: State.get().marketplace, range: null, groupBy: 'month' });
    const keys = [...res.groups.keys()].sort((a, b) => a - b);
    const chart = Charts.register('bars', { cats: keys.map(k => ({ label: I18n.monthShort(k), full: I18n.monthLabel(k) })), series: [{ label: I18n.metricLabel('adSpend'), values: keys.map(k => res.groups.get(k).v.adSpend) }, { label: I18n.metricLabel('adSales'), values: keys.map(k => res.groups.get(k).v.adSales) }], fmt: v => I18n.money(v), height: 280 });
    const row = { label: t('nav.lifetime'), m: L.total?.v || {} };
    const table = DataTable.render({ id: 'lifetime', columns: TableDefs.defs.lifetime(), rows: [row], search: false, exportName: 'lifetime' });
    return card({ kicker: t('lt.kicker'), title: t('lt.title'), sub: t('lt.sub', { range: I18n.range(L.bounds.min, L.bounds.max) }), body: `${notice(L)}${table}<div class="chart-block">${chart}</div>${legend([I18n.metricLabel('adSpend'), I18n.metricLabel('adSales')])}<p class="print-note">${esc(t('lt.note'))}</p>` });
  }

  function dimPage({ kind, kicker, title, sub, chartDim, chartLabel, filterDim, extraTop = '', rowFilter, toolbarExtra, id, reportLabel, hidden }) {
    const res = TableDefs.dimRows(kind);
    if (res.missing || (!res.rows.length && !res.source)) return card({ kicker, title, sub, body: missing(I18n.dim(filterDim), reportLabel) });
    const top = [...res.rows].sort((a, b) => (b.m.adSales || 0) - (a.m.adSales || 0)).slice(0, 10);
    // product-level data can cover less spend than campaign level (e.g. Sponsored Brands has no advertised SKU)
    let coverage = '';
    if (kind === 'asin' && res.total?.v?.adSpend != null) {
      const all = Reports.kpis().cur?.total?.v?.adSpend;
      if (all && res.total.v.adSpend < all * 0.995) coverage = `<div class="notice">${icon('info')}<span>${esc(t('as.coverage', { part: I18n.money(res.total.v.adSpend), all: I18n.money(all), pct: I18n.pct(res.total.v.adSpend / all * 100, 0) }))}</span></div>`;
    }
    const chart = Charts.register('hbars', { rows: top.map(r => ({ label: chartLabel ? chartLabel(r) : r.id, values: [r.m.adSpend, r.m.adSales], filter: { dim: filterDim, value: r.id } })), series: [{ label: I18n.metricLabel('adSpend') }, { label: I18n.metricLabel('adSales') }], fmt: v => I18n.money(v) });
    const table = DataTable.render({ id: id || kind, columns: TableDefs.defs[kind](), rows: res.rows, defaultSort: { key: 'adSales', dir: -1 }, exportName: kind, rowFilter, toolbarExtra, hidden, caption: title });
    return extraTop + card({ kicker, title, sub, right: `<button class="view-all" type="button" data-scroll="dt-${id || kind}">${esc(t('common.viewAll'))} ↗</button>`,
      body: `${notice(res)}${coverage}<div class="chart-block">${chart}</div>${legend([I18n.metricLabel('adSpend'), I18n.metricLabel('adSales')])}<p class="fine pad-x">${esc(t('common.clickToFilter'))}</p>${table}` });
  }

  function keywords() {
    const st = State.get();
    const tr = Reports.breakdown('matchType', 'adSpend'), sales = Reports.breakdown('matchType', 'adSales');
    const eff = Reports.byDim('matchType');
    const donut = (res, metric, title) => `<div class="donut-card"><h3>${esc(title)}</h3>${Charts.register('donut', { segs: res.segs, dim: 'matchType', center: I18n.metric(metric, res.total), centerLabel: t('common.total'), fmt: fmtFor(metric), metricLabel: I18n.metricLabel(metric) })}</div>`;
    const order = tr.segs.map(s => s.label);
    const effRows = order.map(l => eff.rows.find(r => r.id === l)).filter(Boolean);

  function products() {

      <p class="fine">${icon(Api.enabled ? 'database' : 'info')} ${esc(Api.enabled ? t('api.storageServer') : t('api.storageBrowser'))}</p>
      <div class="table-frame static"><table class="detail-table"><thead><tr><th class="txt">${esc(t('set.file'))}</th><th class="txt">${esc(t('set.report'))}</th><th class="num">${esc(t('set.rows'))}</th><th class="txt">${esc(t('set.dates'))}</th><th class="txt">${esc(t('set.imported'))}</th><th></th></tr></thead><tbody>${files || `<tr><td colspan="6" class="empty-row">${esc(t('common.noData'))}</td></tr>`}</tbody></table></div>`;
    const syn = Object.keys(Config.FIELD_SYNONYMS).filter(f => f !== 'entity');
    const mapping = `<p class="fine">${esc(t('set.mappingHelp'))}</p><div class="table-frame static tall"><table class="detail-table"><thead><tr><th class="txt">${esc(t('set.field'))}</th><th class="txt">${esc(t('set.builtin'))}</th><th class="txt">${esc(t('set.custom'))}</th></tr></thead><tbody>${syn.map(f => `<tr><td class="txt"><strong>${esc(t('field.' + f))}</strong><br><code>${f}</code></td><td class="txt wrap"><span class="fine">${esc(Config.FIELD_SYNONYMS[f].join(', '))}</span></td><td class="txt"><input class="text-in" id="syn-${f}" data-syn="${f}" value="${esc((st.synonyms[f] || []).join(', '))}" placeholder="${esc(t('set.synPlaceholder'))}" ${canS ? '' : 'disabled'}></td></tr>`).join('')}</tbody></table></div>`;
    const kwc = `<div class="set-row"><label for="set-brand">${esc(t('set.brandTerms'))}</label><input id="set-brand" class="text-in" data-setting="brandTerms" value="${esc(st.brandTerms)}" ${canS ? '' : 'disabled'}></div>
      <div class="set-row"><label for="set-comp">${esc(t('set.compTerms'))}</label><input id="set-comp" class="text-in" data-setting="competitorTerms" value="${esc(st.competitorTerms)}" ${canS ? '' : 'disabled'}></div><p class="fine">${esc(t('set.kwHelp'))}</p>`;
    const allAccts = DataStore.distinct('account');
    const roles = `<div class="set-row"><label for="set-role">${esc(t('set.role'))}</label><select id="set-role" class="period-select">${Object.keys(Config.ROLES).map(r => `<option value="${r}" ${st.role === r ? 'selected' : ''}>${esc(t('role.' + r))}</option>`).join('')}</select></div>
      <div class="role-grid">${Object.entries(Config.ROLES).map(([r, p]) => `<div class="role-card ${st.role === r ? 'on' : ''}"><strong>${esc(t('role.' + r))}</strong><p>${esc(t('role.' + r + '.desc'))}</p><ul>${['import', 'export', 'settings', 'allAccounts'].map(k => `<li class="${p[k] ? 'yes' : 'no'}">${icon(p[k] ? 'check' : 'x')}${esc(t('perm.' + k))}</li>`).join('')}</ul></div>`).join('')}</div>
      ${st.role === 'manager' ? `<div class="set-row"><span class="lbl-inline">${esc(t('set.assigned'))}</span><div class="chk-row">${allAccts.map(a => `<label class="chk"><input type="checkbox" data-assign value="${esc(a)}" ${st.assignedAccounts.includes(a) ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div></div>` : ''}
      <p class="fine">${esc(t('set.roleNote'))}</p>`;
    const defs = `<div class="table-frame static tall"><table class="detail-table"><thead><tr><th class="txt">${esc(t('col.metric'))}</th><th class="txt">${esc(t('exp.formula'))}</th><th class="txt">${esc(t('exp.direction'))}</th><th class="txt">${esc(t('set.availability'))}</th></tr></thead><tbody>${Object.values(Config.METRICS).map(m => `<tr><td class="txt"><strong>${esc(I18n.metricLabel(m.key))}</strong></td><td class="txt wrap">${esc(t('def.' + m.key))}</td><td class="txt"><span class="dir d-${m.dir}">${esc(t('dir.' + m.dir))}</span></td><td class="txt">${esc(m.adTypes ? m.adTypes.join(', ') : t('set.allTypes'))}</td></tr>`).join('')}</tbody></table></div>`;
    const arch = `<div class="arch">${['presentation', 'state', 'processing', 'metrics', 'filters', 'charts', 'export', 'import', 'validation'].map(k => `<div class="arch-layer"><strong>${esc(t('arch.' + k))}</strong><p>${esc(t('arch.' + k + '.desc'))}</p></div>`).join('')}</div><p class="fine">${esc(t('arch.prod'))}</p>`;
    const sec = (title, body, id) => `<section class="set-sec" id="${id}"><h3>${esc(title)}</h3>${body}</section>`;
    return card({ kicker: t('set.kicker'), title: t('set.title'), sub: canS ? t('set.sub') : t('set.readOnly'),
      body: `<div class="settings">${sec(t('set.langTitle'), lang, 's-lang')}${sec(t('set.dataTitle'), data, 's-data')}${sec(t('set.rolesTitle'), roles, 's-roles')}${sec(t('set.kwTitle'), kwc, 's-kw')}${sec(t('set.mappingTitle'), mapping, 's-map')}${sec(t('set.defsTitle'), defs, 's-defs')}${sec(t('set.archTitle'), arch, 's-arch')}</div>` });
  }

  const ROUTES = {
    overview, lifetime, keywords, insights, reports, settings, products,
    wow: () => periodPage('week'), mom: () => periodPage('month'), qoq: () => periodPage('quarter'), yoy: () => periodPage('year'),
    portfolio: () => kpiGrid(['adSpend', 'adSales', 'roas', 'acos']) + dimPage({ kind: 'portfolio', kicker: t('pf.kicker'), title: t('pf.title'), sub: t('pf.sub'), filterDim: 'portfolio', reportLabel: t('source.campaign') }),
    campaigns: () => kpiGrid(['adSpend', 'adSales', 'roas', 'acos']) + dimPage({ kind: 'campaign', kicker: t('cp.kicker'), title: t('cp.title'), sub: t('cp.sub'), filterDim: 'campaign', reportLabel: t('source.campaign'), hidden: ['campaignType', 'budget', 'budgetUtil', 'tosIs'] }),
    placements: () => kpiGrid(['adSpend', 'adSales', 'roas', 'acos']) + dimPage({ kind: 'placement', kicker: t('pl.kicker'), title: t('pl.title'), sub: t('pl.sub'), filterDim: 'placement', reportLabel: t('source.placement') }),
    'search-terms': searchTerms,
    asins: () => dimPage({ kind: 'asin', kicker: t('as.kicker'), title: t('as.title'), sub: t('as.sub'), filterDim: 'asin', chartLabel: r => `${r.id} · ${(r.title || '').slice(0, 26)}`, reportLabel: t('source.asin'), hidden: ['brand', 'category'] }),
  };
  function render(route) {
    if (!DataStore.available().length) return card({ kicker: t('app.eyebrow'), title: t('empty.noDataTitle'), body: missing(t('common.data'), t('source.any')) });
    try { return (ROUTES[route] || overview)(); }
    catch (e) { console.error(e); return `<div class="notice error">${icon('error')}<span>${esc(t('common.renderError'))}: ${esc(e.message)}</span></div>`; }
  }

  /* ---------- optional Claude summary (sample capability, viewer's own account) */
  let aiCtl = null;
  async function runAI() {
    const sample = window.claude ? await window.claude.use('sample').catch(() => null) : null;
    if (!sample) { local.aiState = 'unavailable'; App.render(); return; }
    local.aiState = 'thinking'; local.aiText = null; App.render();
    aiCtl = new AbortController();
    const facts = Insights.factSheet(Insights.build());
    const prompt = `You are writing an executive summary of Amazon Ads performance for leadership.\nUse ONLY the facts in the JSON below. Do not invent numbers, causes, or entities. If something is not in the facts, do not mention it.\nWrite 4-6 short bullet points (start each with "• "), then one line starting "Next step:" that restates the single most important recommendation from the facts. Plain text, no markdown headers.\nWrite in this language: ${Config.LANGS[State.get().lang]}.\n\nFACTS:\n${JSON.stringify(facts)}`;
    try {
      const { text } = await sample(prompt, { signal: aiCtl.signal, cache: { gcTime: 10 * 60 * 1000 }, onText: ({ text }) => { local.aiText = text; const el = document.getElementById('ai-out'); if (el) el.textContent = text; } });
      local.aiText = text; local.aiState = 'done';
    } catch (e) {
      local.aiText = e.text || null;
      local.aiState = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code) ? 'unavailable' : 'idle';
      if (e.code && e.code !== 'cancelled' && local.aiState !== 'unavailable') App.toast(t('ai.failed'), 'error');
    }
    App.render();
  }

  function init() {
    document.addEventListener('click', e => {
      const g = e.target.closest('[data-grain]'); if (g) { State.set({ trendGrain: g.dataset.grain }); return; }
      const ef = e.target.closest('[data-eff]'); if (ef) { local.effMetric = ef.dataset.eff; App.render(); return; }
      const sg = e.target.closest('[data-segment]'); if (sg) { local.segment = sg.dataset.segment || null; App.render(); return; }
      const ik = e.target.closest('[data-ikind]'); if (ik) { local.insightKind = ik.dataset.ikind; App.render(); return; }
      const ai = e.target.closest('[data-ai]'); if (ai) { if (ai.dataset.ai === 'run') runAI(); else aiCtl?.abort(); return; }
      const sc = e.target.closest('[data-scroll]'); if (sc) { document.getElementById(sc.dataset.scroll)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      if (e.target.closest('[data-csv-export]')) { const kind = document.getElementById('csv-report').value; local.csvReport = kind; const res = TableDefs.dimRows(kind), cols = TableDefs.defs[kind](); Exporter.csv(`amazon-ads-${kind}-${new Date().toISOString().slice(0, 10)}.csv`, cols.flatMap(c => c.sub === 'share' ? [c.label, c.label + ' %'] : [c.label]), res.rows.map(r => cols.flatMap(c => { const v = TableDefs.exportValue(c, r); const base = v == null ? (c.kind === 'metric' ? 'N/A' : '') : v; return c.sub === 'share' ? [base, r.share?.[c.metric] ?? ''] : [base]; }))); return; }
      if (e.target.closest('[data-template]')) { const rows = ImportService.template(); Exporter.csv('amazon-ads-import-template.csv', rows[0], rows.slice(1)); return; }
      const rf = e.target.closest('[data-rm-file]');
      if (rf) {
        const id = rf.dataset.rmFile;
        if (!rf.dataset.confirm) { rf.dataset.confirm = '1'; rf.classList.add('confirm'); rf.innerHTML = esc(t('set.confirmRemove')); return; }
        (async () => {
          try {
            if (Api.enabled && id !== 'demo') { await Api.remove(id); await Api.loadData(); }
            else DataStore.removeFile(id);
            if (!DataStore.available().length) DemoData.generate();
            DataStore.persist(); App.toast(t('set.removed')); State.schedule();
          } catch (err) { App.toast(err.message, 'error'); }
        })();
        return;
      }
      if (e.target.closest('[data-reset-demo]')) { DataStore.reset(); DemoData.generate(); DataStore.persist(); State.set({ marketplace: 'US', date: { ...State.get().date, preset: 'mtd' } }); App.toast(t('set.demoRestored')); return; }
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.bd) { const i = +el.dataset.bd, b = [...State.get().breakdowns]; b[i] = { ...b[i], [el.dataset.bdKind]: el.value }; State.set({ breakdowns: b }); }
      if (el.dataset.pcount) State.set({ periodCounts: { ...State.get().periodCounts, [el.dataset.pcount]: +el.value } });
      if (el.id === 'set-lang') State.set({ lang: el.value });
      if (el.id === 'set-role') State.set({ role: el.value, assignedAccounts: el.value === 'manager' && !State.get().assignedAccounts.length ? DataStore.distinct('account').slice(0, 1) : State.get().assignedAccounts, filters: { ...State.get().filters, account: [] } });
      if (el.dataset.assign !== undefined) { const cur = new Set(State.get().assignedAccounts); el.checked ? cur.add(el.value) : cur.delete(el.value); State.set({ assignedAccounts: [...cur] }); }
      if (el.dataset.syn) { const syn = { ...State.get().synonyms, [el.dataset.syn]: el.value.split(',').map(s => s.trim()).filter(Boolean) }; State.set({ synonyms: syn }, { silent: true }); App.toast(t('set.saved')); }
      if (el.dataset.setting) { State.set({ [el.dataset.setting]: el.value }, { silent: true }); App.toast(t('set.savedKw')); }
      if (el.id === 'csv-report') local.csvReport = el.value;
    });
  }
  return { render, init };
})();

  }

  /* ---------------- header */
  function renderHeader() {
    const st = State.get(), rg = State.ranges();
    const mks = DataStore.distinct('marketplace');
    const accounts = DataStore.distinct('account', st.marketplace).filter(a => Config.ROLES[st.role].allAccounts || st.assignedAccounts.includes(a));
    const acct = st.filters.account.length === 1 ? st.filters.account[0] : t('hdr.allAccounts');
    const pageTitle = st.route === 'overview' ? t('app.title') : t(navKey(st.route));
    const fc = State.activeFilterCount();
    const cmpText = rg.cmp ? I18n.range(rg.cmp[0], rg.cmp[1]) : t('cmp.none');
    document.getElementById('hdr-main').innerHTML = `
      <div class="hdr-text">
        <nav class="breadcrumb" aria-label="Breadcrumb"><span>${esc(acct)}</span><span aria-hidden="true">›</span><span>${esc(st.marketplace)}</span><span aria-hidden="true">›</span><span aria-current="page">${esc(t(navKey(st.route)))}</span></nav>
        <div class="eyebrow">${esc(t('app.eyebrow'))}</div>
        <h1 class="page-title">${esc(pageTitle)} ${DataStore.isDemo ? `<span class="demo-badge" title="${esc(t('demo.hint'))}">${esc(t('demo.label'))}</span>` : ''}</h1>
        <p class="page-sub">${esc(accounts.length === 1 ? accounts[0] : t('hdr.accountsCount', { n: accounts.length }))} · ${rg.ref != null ? esc(t('hdr.dataThrough', { date: I18n.date(rg.ref) })) : esc(t('common.noData'))}</p>
      </div>
      <div class="header-actions">
        ${State.can('import') ? `<button class="action-btn export" type="button" data-act="import">${icon('upload')}${esc(t('hdr.import'))}</button>` : ''}
        <button class="action-btn" type="button" data-act="takeaways">${icon('sparkles')}${esc(t('hdr.takeaways'))}</button>
        ${State.can('export') ? `
        <button class="action-btn" type="button" data-act="ppt">${icon('ppt')}${esc(t('hdr.exportPpt'))}</button>
        <button class="action-btn" type="button" data-act="xlsx">${icon('xls')}${esc(t('hdr.exportXlsx'))}</button>
        <button class="action-btn download-btn" type="button" data-act="csv">${icon('csv')}${esc(t('hdr.csv'))}</button>` : `<span class="role-note">${icon('lock')}${esc(t('role.viewOnly'))}</span>`}
      </div>`;
    document.getElementById('hdr-controls').innerHTML = `
      <label class="ctl"><span>${esc(t('hdr.marketplace'))}</span><select id="sel-mk" class="period-select">${mks.map(m => `<option value="${m}" ${m === st.marketplace ? 'selected' : ''}>${m} · ${Config.MARKETPLACES[m]?.currency || ''}</option>`).join('')}</select></label>
      <label class="ctl"><span>${esc(t('hdr.account'))}</span><select id="sel-acct" class="period-select"><option value="">${esc(t('hdr.allAccounts'))}</option>${accounts.map(a => `<option ${st.filters.account.length === 1 && st.filters.account[0] === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
      <label class="ctl"><span>${esc(t('hdr.adType'))}</span><select id="sel-adtype" class="period-select"><option value="">${esc(t('hdr.allAdTypes'))}</option>${Object.keys(Config.AD_TYPES).map(a => `<option value="${a}" ${st.filters.adType.length === 1 && st.filters.adType[0] === a ? 'selected' : ''}>${a} · ${esc(t('adType.' + a))}</option>`).join('')}</select></label>
      <div class="ctl date-range-wrap"><span>${esc(t('hdr.dateRange'))}</span>
        <button id="period-selector" class="action-btn date-range-trigger" type="button" aria-expanded="false" aria-haspopup="dialog">
          <span class="dr-main">${rg.cur ? esc(I18n.range(rg.cur[0], rg.cur[1])) : '—'}</span>
          <span class="dr-sub">${esc(t('preset.' + st.date.preset))}</span>${icon('chevronDown')}
        </button>
        <div id="date-popover" class="date-popover" role="dialog" aria-label="${esc(t('hdr.dateRange'))}" hidden></div>
      </div>
      <div class="ctl"><span>${esc(t('hdr.compare'))}</span>
        <button id="comparison-toggle" class="action-btn compare ${st.compareOn ? '' : 'off'}" type="button" aria-pressed="${st.compareOn}">${icon('compare')}<span class="dr-main">${st.compareOn ? esc(cmpText) : esc(t('cmp.off'))}</span></button>
      </div>
      <div class="ctl-actions">
        <button id="filter-toggle" class="action-btn ${st.filterPanelOpen ? 'active' : ''}" type="button" aria-expanded="${st.filterPanelOpen}">${icon('sliders')}${esc(t('hdr.filters'))}${fc ? `<b class="count">${fc}</b>` : ''}</button>
        <button class="action-btn" type="button" data-act="clear" ${fc ? '' : 'disabled'}>${icon('x')}${esc(t('hdr.clear'))}</button>
        <button class="action-btn" type="button" data-act="refresh" title="${esc(t('hdr.refreshHint'))}">${icon('refresh')}${esc(t('hdr.refresh'))}</button>
      </div>`;
    renderChips();
    renderFilterPanel();
  }

  function renderChips() {
    const st = State.get();
    const chips = [`<span class="filter-pill locked">${esc(t('hdr.marketplace'))}: ${esc(st.marketplace)}</span>`];
    for (const d of Config.FILTER_DIMS) for (const v of st.filters[d]) chips.push(`<span class="filter-pill">${esc(I18n.dim(d))}: ${esc(d === 'adType' ? t('adType.' + v) : v)}<button type="button" data-rm-dim="${esc(d)}" data-rm-val="${esc(v)}" aria-label="${esc(t('hdr.removeFilter'))}">${icon('x')}</button></span>`);
    if (!Config.ROLES[st.role].allAccounts) chips.push(`<span class="filter-pill locked">${icon('lock')}${esc(t('role.assignedOnly'))}</span>`);
    document.getElementById('chips').innerHTML = `<span class="chips-label">${esc(t('hdr.activeFilters'))}</span>${chips.join('')}`;
  }

  /* ---------------- filter panel (multi-selects) */
  let openMS = null;
  function renderFilterPanel() {
    const st = State.get(), el = document.getElementById('filter-panel');
    el.hidden = !st.filterPanelOpen;
    if (!st.filterPanelOpen) return;
    el.innerHTML = Config.FILTER_DIMS.filter(d => d !== 'account' && d !== 'adType').map(d => {
      const sel = st.filters[d];
      return `<div class="ms" data-ms="${d}"><span class="ms-label">${esc(I18n.dim(d))}</span>
        <button type="button" class="ms-btn ${sel.length ? 'has' : ''}" data-ms-open="${d}" aria-expanded="${openMS === d}">${esc(sel.length === 0 ? t('common.all') : sel.length === 1 ? sel[0] : t('common.nSelected', { n: sel.length }))}${icon('chevronDown')}</button>
        ${openMS === d ? msMenu(d) : ''}</div>`;
    }).join('') + `<p class="fp-note">${esc(t('filters.note'))}</p>`;
  }
  function msMenu(d, q = '') {
    const st = State.get(), vals = DataStore.distinct(d, st.marketplace), sel = new Set(st.filters[d]);
    const list = vals.filter(v => !q || v.toLowerCase().includes(q.toLowerCase())).slice(0, 300);
    return `<div class="ms-menu" id="ms-menu-${d}"><input type="search" class="ms-search" id="ms-q-${d}" data-ms-q="${d}" value="${esc(q)}" placeholder="${esc(t('table.search'))}" aria-label="${esc(t('table.search'))}">
      <div class="ms-list">${list.length ? list.map(v => `<label class="chk"><input type="checkbox" data-ms-val="${d}" value="${esc(v)}" ${sel.has(v) ? 'checked' : ''}> <span>${esc(v)}</span></label>`).join('') : `<p class="muted pad">${esc(t('filters.noValues'))}</p>`}</div>
      ${vals.length > 300 ? `<p class="muted pad">${esc(t('filters.refine', { n: vals.length }))}</p>` : ''}
      <div class="ms-foot"><button type="button" class="link-btn" data-ms-clear="${d}">${esc(t('hdr.clear'))}</button><button type="button" class="action-btn sm export" data-ms-done="${d}">${esc(t('common.done'))}</button></div></div>`;
  }

  /* ---------------- date picker (draft state until Apply) */
  const DP = { draft: null, month: null, editing: 'cur', anchor: null };
  function openDate() {
    const st = State.get(), rg = State.ranges();
    DP.draft = { ...st.date, start: rg.cur?.[0], end: rg.cur?.[1], cStart: rg.cmp?.[0] ?? null, cEnd: rg.cmp?.[1] ?? null };
    DP.month = Dates.monthStart(Dates.addMonths(rg.cur ? rg.cur[1] : Dates.toDay(new Date()), -1));
    DP.editing = 'cur'; DP.anchor = null;
    const pop = document.getElementById('date-popover'); pop.hidden = false;
    document.getElementById('period-selector').setAttribute('aria-expanded', 'true');
    renderDate();
  }
  function closeDate() { const pop = document.getElementById('date-popover'); if (pop) pop.hidden = true; document.getElementById('period-selector')?.setAttribute('aria-expanded', 'false'); DP.draft = null; }
  function draftRanges() {
    const d = DP.draft, b = DataStore.bounds();
    const cur = d.preset === 'custom' ? [d.start, d.end] : Dates.presetById(d.preset).calc(b.max, b);
    const cmp = d.compareMode === 'none' ? null : d.compareMode === 'custom' ? (d.cStart != null ? [d.cStart, d.cEnd] : null) : Dates.comparison(d.compareMode, cur[0], cur[1], d.preset);
    return { cur, cmp, b };
  }
  function monthGrid(ms, cur, cmp, b) {
    const [y, m] = Dates.ymd(ms), me = Dates.monthEnd(ms), first = Dates.weekStart(ms);
    const wd = I18n.weekdayNames();
    let h = `<div><div class="month-title">${esc(I18n.monthLabel(ms))}</div><div class="calendar-grid"><span></span>${wd.map(w => `<span class="weekday">${esc(w)}</span>`).join('')}`;
    for (let ws = first; ws <= me; ws += 7) {
      h += `<span class="weekno">${Dates.weekNumber(ws)}</span>`;
      for (let d = ws; d < ws + 7; d++) {
        if (d < ms || d > me) { h += '<span></span>'; continue; }
        const inCur = cur && d >= cur[0] && d <= cur[1], inCmp = cmp && d >= cmp[0] && d <= cmp[1];
        const out = b && (d < b.min || d > b.max);
        const cls = [inCur ? 'range-day' : '', inCur && d === cur[0] ? 'range-start' : '', inCur && d === cur[1] ? 'range-end' : '', inCmp ? 'cmp-day' : '', out ? 'muted-day' : '', DP.anchor === d ? 'anchor' : ''].join(' ');
        h += `<button type="button" class="${cls}" data-day="${d}" aria-label="${esc(I18n.date(d))}">${Dates.ymd(d)[2]}</button>`;
      }
    }
    return h + '</div></div>';
  }
  function renderDate() {
    const pop = document.getElementById('date-popover'); if (!pop || pop.hidden || !DP.draft) return;
    const { cur, cmp, b } = draftRanges(), d = DP.draft;
    const groups = {}; Dates.PRESETS.forEach(p => { (groups[p.group] = groups[p.group] || []).push(p); });
    pop.innerHTML = `
      <div class="calendar-panel">
        <div class="calendar-head">
          <button type="button" class="cal-nav" data-cal="-1" aria-label="${esc(t('date.prevMonth'))}">${icon('chevronLeft')}</button>
          <div class="seg" role="group" aria-label="${esc(t('date.editing'))}">
            <button type="button" class="${DP.editing === 'cur' ? 'on' : ''}" data-edit="cur"><i class="sw cur"></i>${esc(t('date.current'))}</button>
            <button type="button" class="${DP.editing === 'cmp' ? 'on' : ''}" data-edit="cmp" ${d.compareMode === 'none' ? 'disabled' : ''}><i class="sw cmp"></i>${esc(t('date.comparison'))}</button>
          </div>
          <button type="button" class="cal-nav" data-cal="1" aria-label="${esc(t('date.nextMonth'))}">${icon('chevronRight')}</button>
        </div>
        <div class="calendar-months">${monthGrid(DP.month, cur, cmp, b)}${monthGrid(Dates.addMonths(DP.month, 1), cur, cmp, b)}</div>
        <div class="range-summary">
          <div><i class="sw cur"></i><span>${esc(t('date.current'))}</span><strong>${esc(I18n.range(cur[0], cur[1]))}</strong></div>
          <div><i class="sw cmp"></i><span>${esc(t('date.compareTo'))}</span><strong>${cmp ? esc(I18n.range(cmp[0], cmp[1])) : esc(t('cmp.none'))}</strong></div>
        </div>
        <p class="cal-hint">${esc(DP.anchor != null ? t('date.pickEnd') : t('date.pickStart'))}</p>
      </div>
      <div class="date-side">
        <div class="date-side-label">${esc(t('hdr.dateRange'))}</div>
        <div class="range-options">${Object.entries(groups).map(([g, ps]) => `<div class="range-group">${esc(t('dgroup.' + g))}</div>` + ps.map(p => `<button type="button" class="range-option ${d.preset === p.id ? 'selected' : ''}" data-preset="${p.id}">${esc(t('preset.' + p.id))}</button>`).join('')).join('')}
          <button type="button" class="range-option ${d.preset === 'custom' ? 'selected' : ''}" data-preset="custom">${esc(t('preset.custom'))}</button></div>
        <div class="date-side-label mt">${esc(t('date.compareTo'))}</div>
        <div class="date-select-wrap"><select id="cmp-mode" class="date-select">${['previous', 'yoy', 'custom', 'none'].map(m => `<option value="${m}" ${d.compareMode === m ? 'selected' : ''}>${esc(t('cmp.' + m))}</option>`).join('')}</select></div>
        <div class="date-actions">
          <button id="date-reset" class="date-reset" type="button">${esc(t('date.reset'))}</button>
          <button id="date-apply" class="date-apply" type="button">${esc(t('date.apply'))}</button>
        </div>
      </div>`;
  }
  function dateClick(e) {
    const d = DP.draft;
    const nav = e.target.closest('[data-cal]'); if (nav) { DP.month = Dates.addMonths(DP.month, +nav.dataset.cal); return renderDate(); }
    const ed = e.target.closest('[data-edit]'); if (ed) { DP.editing = ed.dataset.edit; DP.anchor = null; return renderDate(); }
    const pr = e.target.closest('[data-preset]');
    if (pr) {
      const id = pr.dataset.preset;
      if (id === 'custom') { const { cur } = draftRanges(); d.start = cur[0]; d.end = cur[1]; }
      d.preset = id; DP.editing = 'cur'; DP.anchor = null;
      const { cur } = draftRanges(); DP.month = Dates.monthStart(Dates.addMonths(cur[1], -1));
      return renderDate();
    }
    const day = e.target.closest('[data-day]');
    if (day) {
      const n = +day.dataset.day;
      if (DP.anchor == null) { DP.anchor = n; }
      else {
        const s = Math.min(DP.anchor, n), en = Math.max(DP.anchor, n);
        if (DP.editing === 'cur') { d.preset = 'custom'; d.start = s; d.end = en; }
        else { d.compareMode = 'custom'; d.cStart = s; d.cEnd = en; }
        DP.anchor = null;
      }
      return renderDate();
    }
    if (e.target.id === 'date-reset') { DP.draft = { preset: 'mtd', start: null, end: null, compareMode: 'previous', cStart: null, cEnd: null }; DP.anchor = null; return renderDate(); }
    if (e.target.id === 'date-apply') {
      const { cmp } = draftRanges();
      if (d.compareMode === 'custom' && !cmp) { toast(t('date.pickCompare'), 'error'); return; }
      State.set({ date: { preset: d.preset, start: d.start, end: d.end, compareMode: d.compareMode, cStart: d.cStart, cEnd: d.cEnd }, compareOn: d.compareMode !== 'none' ? true : State.get().compareOn });
      closeDate();
    }
  }

  /* ---------------- toasts / busy / modal */
  function toast(msg, kind = 'ok') {
    const host = document.getElementById('toast-host');
    const el = document.createElement('div'); el.className = 'toast ' + kind; el.setAttribute('role', 'status');
    el.innerHTML = `${icon(kind === 'error' ? 'error' : 'check')}<span>${esc(msg)}</span>`;
    host.appendChild(el); setTimeout(() => el.remove(), 4200);
  }
  function busy(msg) {
    const el = document.getElementById('busy');
    if (!msg) { el.hidden = true; return; }
    el.innerHTML = `<div class="busy-card"><span class="spinner"></span>${esc(msg)}</div>`; el.hidden = false;
  }
  function modal(html, cls = '') {
    const host = document.getElementById('modal-host');
    if (!html) { host.innerHTML = ''; host.hidden = true; document.body.classList.remove('modal-open'); return; }
    host.innerHTML = `<div class="modal-back" data-close-modal></div><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
    host.hidden = false; document.body.classList.add('modal-open');
  }
  function filterSummary() {
    const st = State.get();
    return Config.FILTER_DIMS.filter(d => st.filters[d].length).map(d => `${I18n.dim(d)}: ${st.filters[d].join(', ')}`).join(' · ');
  }

  /* ---------------- routing + render */
  function route() {
    const h = (location.hash || '#overview').slice(1);
    const valid = NAV.filter(Boolean).map(n => n[0]);
    State.set({ route: valid.includes(h) ? h : 'overview' });
  }
  let lastRoute = null;
  function render() {
    const st = State.get();
    I18n.setLang(st.lang); I18n.setMarketplace(st.marketplace);
    renderRail(); renderHeader();
    document.getElementById('demo-banner').innerHTML = DataStore.isDemo ? `<div class="demo-banner" role="note">${icon('info')}<span><strong>${esc(t('demo.label'))}</strong> — ${esc(t('demo.banner'))}</span>${State.can('import') ? `<button type="button" class="link-btn" data-act="import">${esc(t('demo.cta'))}</button>` : ''}</div>` : '';
    Charts.reset();
    const view = document.getElementById('view');
    const t0 = performance.now();
    view.innerHTML = Views.render(st.route);
    Charts.mountAll(view);
    view.dataset.ms = Math.round(performance.now() - t0);
    if (lastRoute !== st.route) { window.scrollTo({ top: 0 }); lastRoute = st.route; document.body.classList.remove('rail-open'); }
    document.title = `${t(navKey(st.route))} · ${t('app.titleShort')}`;
  }

  function init() {
    State.loadPrefs();
    const st = State.get();
    I18n.setLang(st.lang);
    Charts.initTooltip(); DataTable.init(); Views.init(); ImportWizard.init();
    State.subscribe(render);
    addEventListener('hashchange', route);

    document.addEventListener('click', e => {
      const a = e.target.closest('[data-act]');
      if (a) {
        const act = a.dataset.act;
        if (act === 'import') ImportWizard.open();
        if (act === 'takeaways') location.hash = '#insights';
        if (act === 'ppt') Exporter.pptx();
        if (act === 'xlsx') Exporter.xlsx();
        if (act === 'pdf') Exporter.pdf();
        if (act === 'csv') Exporter.currentCSV();
        if (act === 'clear') State.clearFilters();
        if (act === 'refresh') { DataStore.touch(); State.schedule(); toast(t('toast.refreshed')); }
        if (act === 'menu') document.body.classList.toggle('rail-open');
        return;
      }
      if (e.target.closest('#period-selector')) { const pop = document.getElementById('date-popover'); pop.hidden ? openDate() : closeDate(); return; }
      if (e.target.closest('#date-popover')) { dateClick(e); return; }
      if (DP.draft && !e.target.closest('.date-range-wrap')) closeDate();
      if (e.target.closest('#comparison-toggle')) { State.set({ compareOn: !State.get().compareOn }); return; }
      if (e.target.closest('#filter-toggle')) { State.set({ filterPanelOpen: !State.get().filterPanelOpen }); return; }
      const rm = e.target.closest('[data-rm-dim]'); if (rm) { State.toggleFilter(rm.dataset.rmDim, rm.dataset.rmVal); return; }
      const fs = e.target.closest('[data-filter-dim]');
      if (fs) { State.toggleFilter(fs.dataset.filterDim, fs.dataset.filterValue); toast(t('toast.filterApplied', { dim: I18n.dim(fs.dataset.filterDim), value: fs.dataset.filterValue })); return; }
      const mo = e.target.closest('[data-ms-open]'); if (mo) { openMS = openMS === mo.dataset.msOpen ? null : mo.dataset.msOpen; renderFilterPanel(); document.getElementById('ms-q-' + openMS)?.focus(); return; }
      const mc = e.target.closest('[data-ms-clear]'); if (mc) { State.setFilter(mc.dataset.msClear, []); return; }
      if (e.target.closest('[data-ms-done]')) { openMS = null; renderFilterPanel(); return; }
      if (openMS && !e.target.closest('.ms')) { openMS = null; renderFilterPanel(); }
      const menuBtn = e.target.closest('[data-menu]');
      document.querySelectorAll('.menu').forEach(m => { if (!menuBtn || m.id !== menuBtn.dataset.menu) { if (!m.contains(e.target)) m.hidden = true; } });
      if (menuBtn) { const m = document.getElementById(menuBtn.dataset.menu); m.hidden = !m.hidden; }
      if (e.target.closest('[data-close-modal]') && !ImportWizard.busy()) modal(null);
    });
    document.addEventListener('change', e => {
      const id = e.target.id;
      if (id === 'sel-mk') { State.set({ marketplace: e.target.value, filters: { ...State.get().filters, account: [] } }); }
      if (id === 'sel-acct') State.setFilter('account', e.target.value ? [e.target.value] : []);
      if (id === 'sel-adtype') State.setFilter('adType', e.target.value ? [e.target.value] : []);
      if (id === 'cmp-mode' && DP.draft) { DP.draft.compareMode = e.target.value; if (e.target.value === 'custom') { DP.editing = 'cmp'; const { cmp } = draftRanges(); } renderDate(); }
      if (e.target.dataset.msVal) State.toggleFilter(e.target.dataset.msVal, e.target.value);
    });
    let mq;
    document.addEventListener('input', e => {
      const d = e.target.dataset.msQ;
      if (d) { clearTimeout(mq); const v = e.target.value; mq = setTimeout(() => { const menu = document.getElementById('ms-menu-' + d); if (menu) { menu.outerHTML = msMenu(d, v); const q = document.getElementById('ms-q-' + d); q.focus(); q.setSelectionRange(v.length, v.length); } }, 120); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeDate(); if (openMS) { openMS = null; renderFilterPanel(); } if (!document.getElementById('modal-host').hidden && !ImportWizard.busy()) modal(null); }
      const f = e.target.closest && e.target.closest('[data-filter-dim][tabindex]');
      if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); f.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    });
  }

  async function boot() {
    init();
    busy(t('boot.loading'));
    await new Promise(r => setTimeout(r, 30));
    if (await Api.detect()) {
      try { await Api.loadData(); } catch (e) { toast(t('api.loadFailed', { reason: e.message }), 'error'); }
      if (!DataStore.available().length) DemoData.generate();   // nothing uploaded yet → labelled demo
    } else {
      const restored = await DataStore.restore();
      if (!restored) DemoData.generate();
    }
    const st = State.get();
    const mks = DataStore.distinct('marketplace');
    if (!mks.includes(st.marketplace)) State.set({ marketplace: mks[0] || 'US' }, { silent: true });
    busy(false);
    route(); State.schedule();
  }
  return { boot, render, toast, busy, modal, filterSummary };
})();

App.boot();
</script>
