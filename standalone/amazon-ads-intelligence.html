    if (col.render) return col.render(row);
    const v = cellValue(col, row);
    if (col.kind !== 'metric') return `<span class="cell-main" title="${esc(v ?? '')}">${esc(v ?? '—')}</span>`;
    const key = col.metric || col.key;
    let sub = '';
    if (col.sub === 'share' && row.share && row.share[key] != null) sub = `<span class="cell-sub">${I18n.pct(row.share[key], 1)}</span>`;
    if (col.sub === 'delta' && State.get().compareOn && row.prev !== undefined) sub = `<span class="cell-sub">${row.prev ? Fmt.deltaHTML(key, v, row.prev[key]) : '<span class="delta none">—</span>'}</span>`;
    return `<span class="cell-main">${Fmt.value(key, v)}</span>${sub}`;
  }

  function rowsHTML(spec, cols, rows) {
    return rows.map(r => `<tr>${cols.map((c, i) => `<td class="${c.kind === 'metric' ? 'num' : 'txt'} ${i === 0 ? 'sticky-col' : ''}">${cellHTML(c, r)}</td>`).join('')}</tr>`).join('');
  }

  function bodyHTML(spec) {
    const st = stateOf(spec), cols = visibleCols(spec, st), rows = processed(spec);
    const total = rows.length;
    const virtual = st.size === 'all' && total > 150;
    let slice = rows, pages = 1;
    if (st.size !== 'all') {
      pages = Math.max(1, Math.ceil(total / st.size));
      st.page = Math.min(st.page, pages - 1);
      slice = rows.slice(st.page * st.size, (st.page + 1) * st.size);
    } else if (virtual) slice = rows.slice(0, 40);
    const head = `<thead><tr>${cols.map((c, i) => {
      const sorted = st.sort && st.sort.key === c.key;
      const w = st.widths[c.key];
      const style = w ? `style="width:${w}px;min-width:${w}px;max-width:${w}px"` : '';
      return `<th ${style} class="${c.kind === 'metric' ? 'num' : 'txt'} ${i === 0 ? 'sticky-col' : ''} sortable" data-sort="${esc(c.key)}" tabindex="0" aria-sort="${sorted ? (st.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}" title="${esc(c.hint || '')}">${esc(c.label)}${sorted ? (st.sort.dir > 0 ? ' ↑' : ' ↓') : ''}<span class="col-resize" data-resize="${esc(c.key)}" aria-hidden="true"></span></th>`;
    }).join('')}</tr></thead>`;
    const body = total ? rowsHTML(spec, cols, slice) : `<tr><td colspan="${cols.length}" class="empty-row">${esc(spec.emptyText || t('common.noRows'))}</td></tr>`;
    const vattrs = virtual ? `data-virtual="1" style="max-height:${ROWH * 12 + 44}px"` : '';
    const frame = `<div class="table-frame" ${vattrs} data-frame="${spec.id}"><table class="detail-table"><${'caption'} class="sr-only">${esc(spec.caption || '')}</caption>${head}<tbody>${virtual ? `<tr class="vpad" style="height:0"></tr>${body}<tr class="vpad" style="height:${(total - slice.length) * ROWH}px"></tr>` : body}</tbody></table></div>`;
    const from = total ? (st.size === 'all' ? 1 : st.page * st.size + 1) : 0;
    const to = st.size === 'all' ? total : Math.min(total, (st.page + 1) * st.size);
    const foot = `<div class="table-foot"><span>${esc(t('table.showing', { from: I18n.int(from, false), to: I18n.int(to, false), total: I18n.int(total, false) }))}</span>
      <span class="pager">
        <label>${esc(t('table.rows'))} <select data-size="${spec.id}" id="size-${spec.id}">${[25, 50, 100, 'all'].map(n => `<option value="${n}" ${String(st.size) === String(n) ? 'selected' : ''}>${n === 'all' ? t('table.all') : n}</option>`).join('')}</select></label>
        ${st.size !== 'all' ? `<button type="button" class="pg" data-page="${spec.id}" data-dir="-1" ${st.page === 0 ? 'disabled' : ''} aria-label="${esc(t('table.prev'))}">‹</button><span>${st.page + 1} / ${pages}</span><button type="button" class="pg" data-page="${spec.id}" data-dir="1" ${st.page >= pages - 1 ? 'disabled' : ''} aria-label="${esc(t('table.next'))}">›</button>` : ''}
      </span></div>`;
    return frame + foot;
  }

  function render(spec) {
    registry.set(spec.id, spec);
    const st = stateOf(spec);
    const colMenu = spec.columns.slice(1).map(c => `<label class="chk"><input type="checkbox" data-colvis="${spec.id}" value="${esc(c.key)}" ${st.hidden.has(c.key) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('');
    return `<div class="dt" id="dt-${spec.id}">
      <div class="table-toolbar">
        ${spec.search !== false ? `<label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q-${spec.id}" data-search="${spec.id}" value="${esc(st.q)}" placeholder="${esc(t('table.search'))}" aria-label="${esc(t('table.search'))}"></label>` : ''}
        ${spec.toolbarExtra || ''}
        <span class="spacer"></span>
        <div class="menu-wrap"><button type="button" class="action-btn sm" data-menu="cols-${spec.id}">${icon('columns')}${esc(t('table.columns'))}</button><div class="menu" id="cols-${spec.id}" hidden>${colMenu}</div></div>
        ${State.can('export') ? `<button type="button" class="action-btn sm" data-export-table="${spec.id}">${icon('download')}${esc(t('table.exportCsv'))}</button>` : ''}
      </div>
      <div class="dt-body" id="dtb-${spec.id}">${bodyHTML(spec)}</div>
    </div>`;
  }

  function refreshBody(id) {
    const spec = registry.get(id); const el = document.getElementById('dtb-' + id);
    if (spec && el) el.innerHTML = bodyHTML(spec);
  }

  function onScroll(frame) {
    const spec = registry.get(frame.dataset.frame); if (!spec) return;
    const st = stateOf(spec), cols = visibleCols(spec, st), rows = processed(spec);
    const start = Math.max(0, Math.floor(frame.scrollTop / ROWH) - 8), count = 40;
    const slice = rows.slice(start, start + count);
    const tb = frame.querySelector('tbody');
    tb.innerHTML = `<tr class="vpad" style="height:${start * ROWH}px"></tr>${rowsHTML(spec, cols, slice)}<tr class="vpad" style="height:${Math.max(0, rows.length - start - slice.length) * ROWH}px"></tr>`;
  }

  function exportCSV(id) {
    const spec = registry.get(id); if (!spec) return;
    const st = stateOf(spec), cols = visibleCols(spec, st), rows = processed(spec);
    const headers = []; cols.forEach(c => { headers.push(c.label); if (c.sub === 'share') headers.push(c.label + ' %'); if (c.sub === 'delta' && State.get().compareOn) headers.push(c.label + ' Δ%'); });
    const data = rows.map(r => {
      const out = [];
      cols.forEach(c => {
        const v = c.exportValue ? c.exportValue(r) : cellValue(c, r);
        out.push(v == null ? (c.kind === 'metric' ? 'N/A' : '') : (typeof v === 'number' ? +v.toFixed(4) : v));
        const key = c.metric || c.key;
        if (c.sub === 'share') out.push(r.share?.[key] != null ? +r.share[key].toFixed(2) : '');
        if (c.sub === 'delta' && State.get().compareOn) { const ch = r.prev ? Metrics.change(key, cellValue(c, r), r.prev[key]) : null; out.push(ch ? +ch.pct.toFixed(2) : ''); }
      });
      return out;
    });
    Exporter.csv((spec.exportName || id) + '.csv', headers, data);
  }

  /* delegated events */
  function init() {
    let qt;
    document.addEventListener('input', e => {
      const id = e.target.dataset.search;
      if (id) { clearTimeout(qt); qt = setTimeout(() => { const st = ui.get(id); st.q = e.target.value; st.page = 0; refreshBody(id); }, 160); }
    });
    document.addEventListener('change', e => {
      if (e.target.dataset.size) { const st = ui.get(e.target.dataset.size); st.size = e.target.value === 'all' ? 'all' : +e.target.value; st.page = 0; refreshBody(e.target.dataset.size); }
      if (e.target.dataset.colvis) { const st = ui.get(e.target.dataset.colvis); e.target.checked ? st.hidden.delete(e.target.value) : st.hidden.add(e.target.value); refreshBody(e.target.dataset.colvis); }
    });
    document.addEventListener('click', e => {
      if (e.target.closest('.col-resize')) return;
      const th = e.target.closest('th[data-sort]');
      if (th) {
        const id = th.closest('.dt').id.slice(3), st = ui.get(id), key = th.dataset.sort;
        const col = registry.get(id).columns.find(c => c.key === key);
        st.sort = { key, dir: st.sort && st.sort.key === key ? -st.sort.dir : (col.kind === 'metric' ? -1 : 1) };
        refreshBody(id); return;
      }
      const pg = e.target.closest('[data-page]');
      if (pg) { const st = ui.get(pg.dataset.page); st.page += +pg.dataset.dir; refreshBody(pg.dataset.page); return; }
      const ex = e.target.closest('[data-export-table]');
      if (ex) exportCSV(ex.dataset.exportTable);
    });
    document.addEventListener('keydown', e => {
      const th = e.target.closest && e.target.closest('th[data-sort]');
      if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); th.click(); }
    });
    document.addEventListener('scroll', e => { if (e.target.dataset && e.target.dataset.virtual) onScroll(e.target); }, true);
    // column resizing
    document.addEventListener('mousedown', e => {
      const h = e.target.closest('.col-resize'); if (!h) return;
      e.preventDefault();
      const th = h.parentElement, id = th.closest('.dt').id.slice(3), key = h.dataset.resize, st = ui.get(id);
      const x0 = e.clientX, w0 = th.offsetWidth;
      const move = ev => { const w = Math.max(60, w0 + ev.clientX - x0); st.widths[key] = w; th.style.width = th.style.minWidth = th.style.maxWidth = w + 'px'; };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });
  }
  return { render, init, refreshBody, processed, registry, exportCSV };
})();

/* ===== components/tabledefs.js ===== */
/* ==========================================================================
   TABLE DEFINITIONS — reusable column sets shared by on-screen tables and
   the Excel / PPT / PDF exports, so every surface shows the same report.
   ========================================================================== */
const TableDefs = (() => {
  const M = (metric, sub = null, extra = {}) => ({ key: metric, kind: 'metric', metric, sub, get label() { return I18n.metricLabel(metric); }, ...extra });
  const Dm = (key, extra = {}) => ({ key, kind: 'dim', get label() { return I18n.dim(key); }, ...extra });
  const PERIOD_METRICS = ['adSpend', 'adSales', 'impressions', 'clicks', 'ctr', 'cpc', 'orders', 'units', 'cvr', 'acos', 'roas', 'dpv', 'sameSkuSales', 'otherSkuSales', 'ntbOrders', 'ntbSales'];
  const STD = ['impressions', 'clicks', 'ctr', 'cpc', 'orders', 'units', 'cvr', 'acos', 'roas'];
  const adTypeBadge = r => `<span class="badge ad-${esc(r.adType)}">${esc(r.adType)}</span>`;
  const statusBadge = r => `<span class="status s-${esc((r.asinStatus || '').replace(/\s/g, ''))}">${esc(t('status.' + r.asinStatus))}</span>`;

  const defs = {
    period: sub => [
      { key: 'label', kind: 'dim', get label() { return t('col.period'); }, value: r => r.sortKey, render: r => `<span class="cell-main">${esc(r.label)}${r.partial ? ` <span class="pill-mini">${esc(t('common.partial'))}</span>` : ''}</span><span class="cell-sub">${esc(r.sub || '')}</span>`, exportValue: r => r.label },
      ...PERIOD_METRICS.map(k => M(k, sub)),
    ],
    lifetime: () => [{ key: 'label', kind: 'dim', get label() { return t('col.period'); } }, ...PERIOD_METRICS.map(k => M(k))],
    portfolio: () => [Dm('portfolio'), M('adSpend', 'share'), M('adSales', 'share'), M('roas'), M('acos'), M('impressions'), M('clicks'), M('ctr'), M('cpc'), M('orders'), M('units'), M('cvr')],
    campaign: () => [Dm('campaign'), Dm('adType', { get label() { return t('col.campaignType'); }, render: adTypeBadge }), Dm('targeting'), Dm('portfolio'), Dm('campaignType', { get label() { return t('col.format'); } }),
      M('adSpend', 'share'), M('adSales', 'share'), ...STD.map(k => M(k)), M('budget'), M('budgetUtil'), M('tosIs')],
    placement: () => [Dm('placement'), M('adSpend', 'share'), M('adSales', 'share'), ...STD.map(k => M(k))],
    keyword: () => [Dm('keyword'), Dm('matchType'), Dm('campaign'), Dm('portfolio'), Dm('keywordType'), M('adSpend', 'share'), M('adSales', 'share'), ...STD.map(k => M(k))],
    searchTerm: signal => [Dm('searchTerm'), Dm('keyword'), Dm('matchType'), Dm('campaign'),
      { key: 'signal', kind: 'dim', get label() { return t('col.signal'); }, value: r => (r.signals || []).join(', '), render: r => (r.signals || []).map(s => `<span class="sig sig-${s}">${esc(t('seg.' + s))}</span>`).join(' ') || '<span class="muted">—</span>', exportValue: r => (r.signals || []).map(s => t('seg.' + s)).join('; ') },
      M('adSpend', 'share'), M('adSales', 'share'), M('orders'), M('units'), M('clicks'), M('ctr'), M('cvr'), M('acos'), M('roas'), M('searchIs')],
    asin: () => [Dm('asin'), Dm('title', { get label() { return t('col.title'); } }), Dm('brand'), Dm('category'), Dm('portfolio'),
      Dm('asinStatus', { render: statusBadge, exportValue: r => t('status.' + r.asinStatus) }),
      M('adSpend', 'share'), M('adSales', 'share'), M('impressions'), M('clicks'), M('ctr'), M('cpc'), M('orders'), M('units'), M('cvr'), M('acos'), M('roas'),
      growthCol('adSales', 'col.salesGrowth'), growthCol('adSpend', 'col.spendGrowth'), growthCol('orders', 'col.ordersGrowth')],
    rollup: dim => [Dm(dim), M('adSpend', 'share'), M('adSales', 'share'), M('roas'), M('acos'), M('orders'), M('units'), M('cvr'), M('cpc'), M('ctr')],
  };
  function growthCol(metric, label) {
    const val = r => { const ch = r.prev ? Metrics.change(metric, r.m[metric], r.prev[metric]) : null; return ch ? ch.pct : null; };
    return { key: 'g_' + metric, kind: 'metric', get label() { return t(label); }, value: val,
      render: r => r.prev === undefined ? '<span class="muted">—</span>' : Fmt.deltaHTML(metric, r.m[metric], r.prev ? r.prev[metric] : null), exportValue: val };
  }
  /* composite groupings (1:1 attributes ride along so no joins are needed) */
  const GROUPS = {
    portfolio: 'portfolio', placement: 'placement',
    campaign: 'campaign+adType+targeting+portfolio+campaignType',
    keyword: 'keyword+matchType+campaign+portfolio+keywordType',
    searchTerm: 'searchTerm+keyword+matchType+campaign',
    asin: 'asin+title+brand+category+portfolio+asinStatus',
  };
  /* row builders shared by views and exports */
  function periodRows(grain, n) {
    const res = Reports.periods(grain, n);
    return { ...res, rows: res.rows.map(r => ({ label: r.label, sub: r.sub, partial: r.partial, sortKey: r.key, m: r.cur ? r.cur.v : {}, prev: r.prev ? r.prev.v : null })) };
  }
  function dimRows(kind) {
    const res = Reports.byDim(GROUPS[kind] || kind);
    if (kind === 'searchTerm') tagSearchTerms(res);
    return res;
  }
  /* Search-term signals — thresholds relative to the filtered account average */
  function tagSearchTerms(res) {
    const rows = res.rows; if (!rows.length) return;
    const avg = res.total.v, C = Config.INSIGHTS;
    const q = (arr, p) => { const s = arr.filter(v => v != null).sort((a, b) => a - b); return s.length ? s[Math.floor((s.length - 1) * p)] : 0; };
    const sp75 = q(rows.map(r => r.m.adSpend), 0.75), sp50 = q(rows.map(r => r.m.adSpend), 0.5), sa75 = q(rows.map(r => r.m.adSales), 0.75);
    rows.forEach(r => {
      const s = [], v = r.m, enough = (v.clicks || 0) >= 10;
      if (v.adSpend >= sp75 && (v.roas ?? 0) < avg.roas * C.lowRoasFactor) s.push('highSpendLowSales');
      if ((v.adSales || 0) >= sa75 && v.adSpend <= sp50) s.push('highSalesLowSpend');
      if (enough && v.roas != null && v.roas >= avg.roas * C.highRoasFactor) s.push('highRoas');
      if (enough && (v.roas ?? 0) < avg.roas * C.lowRoasFactor) s.push('lowRoas');
      if (enough && v.cvr != null && v.cvr >= avg.cvr * C.highRoasFactor) s.push('highCvr');
      if (enough && (v.cvr ?? 0) <= avg.cvr * C.lowRoasFactor) s.push('lowCvr');
      r.signals = s;
    });
  }
  /* exports carry clean numbers: money/counts to 2 dp, rates and ratios to 4 dp */
  function rnd(key, v) {
    if (typeof v !== 'number' || !isFinite(v)) return v;
    const f = Config.METRICS[key]?.fmt;
    return f === 'pct' || f === 'ratio' || !f ? Math.round(v * 1e4) / 1e4 : Math.round(v * 100) / 100;
  }
  function exportValue(col, row) {
    if (col.exportValue) return rnd(null, col.exportValue(row));
    if (col.value) return rnd(null, col.value(row));
    if (col.kind === 'metric') return row.m ? rnd(col.metric, row.m[col.metric]) : null;
    return row[col.key];
  }
  return { defs, GROUPS, PERIOD_METRICS, periodRows, dimRows, exportValue, rnd };
})();

/* ===== services/api.js ===== */
/* ==========================================================================
   API CLIENT — talks to the Python backend (FastAPI). When the page is
   served by `python run.py`, uploads are parsed, validated and stored by
   Python (pandas + SQLite). Opened as a plain file, the dashboard falls back
   to in-browser processing.
   ========================================================================== */
const Api = (() => {
  let enabled = false;

  async function detect() {
    if (window.__STANDALONE__ || !/^https?:$/.test(location.protocol)) return false;
    try {
      const r = await fetch('api/health', { cache: 'no-store' });
      const j = r.ok ? await r.json() : null;
      enabled = !!(j && j.ok === true);
      if (enabled) limits = { maxUploadMb: j.maxUploadMb };
    } catch { enabled = false; }
    return enabled;
  }
  async function req(path, opts = {}) {
    const r = await fetch(path, opts);
    if (!r.ok) {
      let msg = r.statusText;
      try { const j = await r.json(); msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch { }
      throw new Error(msg || `Request failed (${r.status})`);
    }
    return r.json();
  }
  const post = (path, body) => req(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  let limits = { maxUploadMb: null };
  /* XHR (not fetch) so large uploads can report progress */
  function upload(file, onProgress) {
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest(), fd = new FormData();
      fd.append('file', file);
      x.open('POST', 'api/import/upload');
      x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      x.upload.onload = () => onProgress && onProgress(1);
      x.onload = () => {
        let j = null; try { j = JSON.parse(x.responseText); } catch { }
        if (x.status >= 200 && x.status < 300 && j) resolve(j);
        else reject(new Error((j && typeof j.detail === 'string' && j.detail) || `Upload failed (${x.status})`));
      };
      x.onerror = () => reject(new Error('The connection to the server was lost during upload.'));
      x.send(fd);
    });
  }
  const inspect = body => post('api/import/inspect', body);
  const validate = body => post('api/import/validate', body);
  const commit = body => post('api/import/commit', body);
  const remove = id => req('api/datasets/' + encodeURIComponent(id), { method: 'DELETE' });
  const issuesUrl = token => 'api/import/' + encodeURIComponent(token) + '/issues.csv';

  /* load every stored report into the browser query engine */
  async function loadData() {
    const header = await req('api/data', { cache: 'no-store' });
    let buf = new ArrayBuffer(0);
    if (header.bytes) {
      const r = await fetch('api/data.bin?v=' + header.version, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Could not load data (${r.status})`);
      buf = await r.arrayBuffer();
    }
    DataStore.loadServer(header, buf);
    return header;
  }
  return { detect, upload, inspect, validate, commit, remove, issuesUrl, loadData, get enabled() { return enabled; }, get limits() { return limits; } };
})();

/* ===== services/insights.js ===== */
/* ==========================================================================
   INSIGHT ENGINE — rule-based, data-grounded observations with separate,
   optional recommendations. Every sentence is filled from computed numbers;
   a rule that has no supporting data produces nothing.
   ========================================================================== */
const Insights = (() => {
  const C = Config.INSIGHTS;
  const m = (k, v) => I18n.metric(k, v);
  const pp = v => I18n.num(v, 1);
  const dirWord = v => t(v >= 0 ? 'ins.increased' : 'ins.decreased');

  function build() {
    const out = [];
    const { cur, prev, range, cmpRange } = Reports.kpis();
    if (!cur || !cur.total || !cur.total.v.adSpend) return out;
    const V = cur.total.v, P = prev?.total?.v;
    const hasPrev = P && P.adSpend;
    const avgRoas = V.roas;

    // 1. sales vs spend growth
    if (hasPrev) {
      const s = Metrics.change('adSales', V.adSales, P.adSales), sp = Metrics.change('adSpend', V.adSpend, P.adSpend);
      if (s && sp) {
        const gap = s.pct - sp.pct;
        out.push({ kind: s.pct >= 0 ? 'growth' : 'decline', tone: gap >= 0 ? 'good' : 'bad', score: 100,
          title: t('ins.t.salesSpend'),
          obs: t('ins.salesSpend', { salesDir: dirWord(s.pct), sales: I18n.delta(s.pct), spendDir: dirWord(sp.pct), spend: I18n.delta(sp.pct) }),
          rec: Math.abs(gap) < C.minChangePct ? null : gap > 0 ? t('rec.salesOutpace') : t('rec.spendOutpace'),
          ev: [['adSales', V.adSales, P.adSales], ['adSpend', V.adSpend, P.adSpend]] });
      }
      // 2. efficiency
      if (V.roas != null && P.roas != null) {
        const ch = Metrics.change('roas', V.roas, P.roas);
        out.push({ kind: 'efficiency', tone: ch.tone, score: 95, title: t('ins.t.efficiency'),
          obs: t(Math.abs(ch.pct) < 0.5 ? 'ins.roasFlat' : 'ins.roas', { dir: dirWord(ch.pct), from: m('roas', P.roas), to: m('roas', V.roas), acosFrom: m('acos', P.acos), acosTo: m('acos', V.acos) }),
          rec: ch.tone === 'good' && Math.abs(ch.pct) >= C.minChangePct ? t('rec.efficiencyUp') : ch.tone === 'bad' && Math.abs(ch.pct) >= C.minChangePct ? t('rec.efficiencyDown') : null,
          ev: [['roas', V.roas, P.roas], ['acos', V.acos, P.acos]] });
      }
      // 3. drivers: CPC and CVR
      const cpc = Metrics.change('cpc', V.cpc, P.cpc), cvr = Metrics.change('cvr', V.cvr, P.cvr);
      if (cpc && cvr && (Math.abs(cpc.pct) >= C.minChangePct || Math.abs(cvr.pct) >= C.minChangePct)) {
        out.push({ kind: 'efficiency', tone: cpc.pct > 0 && cvr.pct < 0 ? 'bad' : cpc.pct <= 0 && cvr.pct >= 0 ? 'good' : 'neutral', score: 70,
          title: t('ins.t.drivers'),
          obs: t('ins.drivers', { cpcDir: dirWord(cpc.pct), cpc: I18n.delta(cpc.pct), cpcTo: m('cpc', V.cpc), cvrDir: dirWord(cvr.pct), cvr: I18n.delta(cvr.pct), cvrTo: m('cvr', V.cvr) }),
          rec: cpc.pct > C.minChangePct && cvr.pct < -C.minChangePct ? t('rec.cpcUpCvrDown') : null,
          ev: [['cpc', V.cpc, P.cpc], ['cvr', V.cvr, P.cvr]] });
      }
    }

    // 4. placements
    const pl = Reports.byDim('placement');
    if (pl.rows.length) {
      const top = [...pl.rows].sort((a, b) => (b.m.adSales || 0) - (a.m.adSales || 0))[0];
      if (top.share.adSales != null) out.push({ kind: 'concentration', tone: 'neutral', score: 60, title: t('ins.t.placementTop'),
        obs: t('ins.placementTop', { placement: top.id, share: pp(top.share.adSales), spendShare: pp(top.share.adSpend), roas: m('roas', top.m.roas) }),
        rec: top.m.roas > avgRoas * 1.1 ? t('rec.placementTop', { placement: top.id }) : null, ev: [['roas', top.m.roas]] });
      if (hasPrev && pl.prevTotal?.v.adSpend) {
        let best = null;
        for (const r of pl.rows) {
          if (!r.prev) continue;
          const d = r.share.adSpend - (r.prev.adSpend / pl.prevTotal.v.adSpend * 100);
          if (!best || Math.abs(d) > Math.abs(best.d)) best = { r, d, from: r.share.adSpend - d };
        }
        if (best && Math.abs(best.d) >= C.placementShiftPp) {
          const better = best.r.m.roas > avgRoas;
          out.push({ kind: 'shift', tone: (best.d > 0) === better ? 'good' : 'bad', score: 65, title: t('ins.t.placementShift'),
            obs: t('ins.placementShift', { placement: best.r.id, from: pp(best.from), to: pp(best.r.share.adSpend), roas: m('roas', best.r.m.roas), avg: m('roas', avgRoas) }),
            rec: (best.d > 0) !== better ? t('rec.placementShift', { placement: best.r.id }) : null, ev: [] });
        }
      }
    }

    // 5. portfolios
    const pf = Reports.byDim('portfolio');
    if (pf.rows.length > 1) {
      const bySales = [...pf.rows].sort((a, b) => (b.m.adSales || 0) - (a.m.adSales || 0));
      const top = bySales[0];
      out.push({ kind: 'concentration', tone: top.share.adSales >= C.concentrationPct ? 'bad' : 'neutral', score: 58, title: t('ins.t.portfolioTop'),
        obs: t('ins.portfolioTop', { portfolio: top.id, share: pp(top.share.adSales), spendShare: pp(top.share.adSpend) }),
        rec: top.share.adSales >= C.concentrationPct ? t('rec.concentration', { portfolio: top.id }) : null, ev: [] });
      const eligible = pf.rows.filter(r => r.share.adSpend >= C.minSpendSharePct && r.m.roas != null);
      const best = eligible.sort((a, b) => b.m.roas - a.m.roas)[0];
      if (best && best.m.roas > avgRoas * 1.1) out.push({ kind: 'growth', tone: 'good', score: 55, title: t('ins.t.portfolioBest'),
        obs: t('ins.portfolioBest', { portfolio: best.id, roas: m('roas', best.m.roas), avg: m('roas', avgRoas), share: pp(best.share.adSpend) }), rec: null, ev: [] });
    }

    // 6–8. campaigns
    const cp = Reports.byDim('campaign');
    if (cp.rows.length > 2) {
      const low = cp.rows.filter(r => r.m.roas != null && r.m.roas < avgRoas * C.lowRoasFactor && r.share.adSpend >= C.minSpendSharePct).sort((a, b) => b.m.adSpend - a.m.adSpend);
      if (low.length) {
        const sh = low.reduce((a, r) => a + r.share.adSpend, 0);
        out.push({ kind: 'risk', tone: 'bad', score: 90, title: t('ins.t.campaignLow'),
          obs: t('ins.campaignLow', { count: low.length, names: low.slice(0, 3).map(r => `“${r.id}”`).join(', '), share: pp(sh), roas: m('roas', low[0].m.roas), avg: m('roas', avgRoas) }),
          rec: t('rec.campaignLow'), ev: [], link: 'campaigns' });
      }
      const spends = cp.rows.map(r => r.m.adSpend || 0).sort((a, b) => a - b);
      const q3 = spends[Math.floor(spends.length * 0.75)];
      const hslr = cp.rows.filter(r => r.m.adSpend >= q3 && r.m.roas != null && r.m.roas < avgRoas && !low.includes(r)).sort((a, b) => a.m.roas - b.m.roas)[0];
      if (hslr) out.push({ kind: 'risk', tone: 'bad', score: 80, title: t('ins.t.highSpendLowReturn'),
        obs: t('ins.highSpendLowReturn', { campaign: hslr.id, share: pp(hslr.share.adSpend), roas: m('roas', hslr.m.roas), avg: m('roas', avgRoas) }),
        rec: t('rec.highSpendLowReturn'), ev: [], link: 'campaigns' });
      const opp = cp.rows.filter(r => r.m.roas != null && r.m.roas >= avgRoas * C.highRoasFactor && r.share.adSpend < C.lowSpendSharePct && (r.m.orders || 0) >= 20).sort((a, b) => b.m.roas - a.m.roas).slice(0, 2);
      if (opp.length) out.push({ kind: 'opportunity', tone: 'good', score: 85, title: t('ins.t.opportunity'),
        obs: t('ins.opportunity', { names: opp.map(r => `“${r.id}”`).join(', '), roas: m('roas', opp[0].m.roas), share: pp(opp[0].share.adSpend), avg: m('roas', avgRoas) }),
        rec: t('rec.opportunity'), ev: [], link: 'campaigns' });
      // campaign with the steepest ROAS decline vs comparison
      if (hasPrev) {
        const dec = cp.rows.filter(r => r.prev && r.share.adSpend >= C.minSpendSharePct).map(r => ({ r, ch: Metrics.change('roas', r.m.roas, r.prev.roas) })).filter(x => x.ch && x.ch.pct <= -10).sort((a, b) => a.ch.pct - b.ch.pct)[0];
        if (dec) out.push({ kind: 'decline', tone: 'bad', score: 75, title: t('ins.t.campaignDecline'),
          obs: t('ins.campaignDecline', { campaign: dec.r.id, from: m('roas', dec.r.prev.roas), to: m('roas', dec.r.m.roas), cvrFrom: m('cvr', dec.r.prev.cvr), cvrTo: m('cvr', dec.r.m.cvr) }),
          rec: t('rec.campaignDecline'), ev: [], link: 'campaigns' });
      }
    }

    // 9. keywords
    const kw = Reports.byDim('keyword+matchType+campaign');
    if (kw.rows.length > 3) {
      const avgCvr = kw.total.v.cvr;
      const opp = kw.rows.filter(r => r.m.roas >= avgRoas * C.highRoasFactor && r.m.cvr >= avgCvr && r.share.adSpend < C.lowSpendSharePct && (r.m.orders || 0) >= 10).sort((a, b) => b.m.roas - a.m.roas).slice(0, 3);
      if (opp.length) out.push({ kind: 'opportunity', tone: 'good', score: 72, title: t('ins.t.keywordOpp'),
        obs: t('ins.keywordOpp', { names: opp.map(r => `“${r.id}”`).join(', '), roas: m('roas', opp[0].m.roas), cvr: m('cvr', opp[0].m.cvr), avgCvr: m('cvr', avgCvr) }),
        rec: t('rec.keywordOpp'), ev: [], link: 'keywords' });
    }

    // 10. search terms
    const st = Reports.byDim('searchTerm');
    if (st.rows.length) {
      const wasted = st.rows.filter(r => (r.m.clicks || 0) >= C.wastedSpendMinClicks && !r.m.orders);
      if (wasted.length) {
        const sp = wasted.reduce((a, r) => a + (r.m.adSpend || 0), 0);
        out.push({ kind: 'risk', tone: 'bad', score: 78, title: t('ins.t.wasted'),
          obs: t('ins.wasted', { count: wasted.length, spend: I18n.money(sp), clicks: C.wastedSpendMinClicks }), rec: t('rec.negatives'), ev: [], link: 'search-terms' });
      }
      const low = st.rows.filter(r => r.m.roas != null && r.m.roas < avgRoas * C.lowRoasFactor && r.share.adSpend >= 1).sort((a, b) => b.m.adSpend - a.m.adSpend).slice(0, 3);
      if (low.length) out.push({ kind: 'risk', tone: 'bad', score: 68, title: t('ins.t.termLow'),
        obs: t('ins.termLow', { names: low.map(r => `“${r.id}”`).join(', '), roas: m('roas', low[0].m.roas), avg: m('roas', avgRoas) }), rec: t('rec.termLow'), ev: [], link: 'search-terms' });
    }

    // 11. ASINs
    const as = Reports.byDim('asin+title+asinStatus');
    if (as.rows.length) {
      const bad = as.rows.filter(r => r.asinStatus && r.asinStatus !== 'Active' && (r.m.adSpend || 0) > 0).sort((a, b) => b.m.adSpend - a.m.adSpend);
      if (bad.length) out.push({ kind: 'risk', tone: 'bad', score: 88, title: t('ins.t.asinStatus'),
        obs: t('ins.asinStatus', { count: bad.length, asin: bad[0].id, status: t('status.' + bad[0].asinStatus) || bad[0].asinStatus, spend: I18n.money(bad[0].m.adSpend), roas: m('roas', bad[0].m.roas) }),
        rec: t('rec.asinStatus'), ev: [], link: 'asins' });
      if (hasPrev) {
        const withCh = as.rows.filter(r => r.prev && r.share.adSales >= C.minSpendSharePct).map(r => ({ r, ch: Metrics.change('adSales', r.m.adSales, r.prev.adSales) })).filter(x => x.ch);
        const up = withCh.filter(x => x.ch.pct >= 10).sort((a, b) => b.ch.pct - a.ch.pct)[0];
        const down = withCh.filter(x => x.ch.pct <= -10).sort((a, b) => a.ch.pct - b.ch.pct)[0];
        if (up) out.push({ kind: 'growth', tone: 'good', score: 50, title: t('ins.t.asinGrowth'),
          obs: t('ins.asinGrowth', { asin: up.r.id, title: up.r.title || '', pct: I18n.delta(up.ch.pct), sales: I18n.money(up.r.m.adSales) }), rec: null, ev: [], link: 'asins' });
        if (down) out.push({ kind: 'decline', tone: 'bad', score: 62, title: t('ins.t.asinDecline'),
          obs: t('ins.asinDecline', { asin: down.r.id, title: down.r.title || '', pct: I18n.delta(down.ch.pct), sales: I18n.money(down.r.m.adSales) }), rec: t('rec.asinDecline'), ev: [], link: 'asins' });
      }
    }

    // 12. new-to-brand (only where reported)
    if (V.ntbOrderRate != null) out.push({ kind: 'growth', tone: 'neutral', score: 40, title: t('ins.t.ntb'),
      obs: t('ins.ntb', { rate: m('ntbOrderRate', V.ntbOrderRate), sales: I18n.money(V.ntbSales), cov: pp(cur.total.cov.ntbOrders * 100) }), rec: null, ev: [] });

    return out.sort((a, b) => b.score - a.score);
  }

  /* compact fact sheet for the optional Claude summary — numbers only from the engine */
  function factSheet(list) {
    const { cur, prev, range, cmpRange } = Reports.kpis();
    const V = cur.total.v, P = prev?.total?.v;
    const k = ['adSpend', 'adSales', 'roas', 'acos', 'orders', 'cvr', 'cpc', 'ctr'];
    return {
      period: I18n.range(range[0], range[1]), comparison: cmpRange ? I18n.range(cmpRange[0], cmpRange[1]) : null,
      marketplace: State.get().marketplace, currency: I18n.currency(),
      kpis: Object.fromEntries(k.map(x => [x, { current: I18n.metric(x, V[x]), previous: P ? I18n.metric(x, P[x]) : null }])),
      observations: list.map(i => i.obs), recommendations: list.filter(i => i.rec).map(i => i.rec),
    };
  }
  return { build, factSheet };
})();

/* ===== services/import.js ===== */
/* ==========================================================================
   IMPORT + VALIDATION ENGINE
   read file → detect type → read headers → auto-map → preview → validate →
   commit into the columnar store. Nothing is dropped silently: every
   excluded row is counted, listed and downloadable.
   ========================================================================== */
const Libs = (() => {
  const loaded = {};
  function load(url) {
    if (!loaded[url]) loaded[url] = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = url; s.async = true;
      s.onload = res; s.onerror = () => { delete loaded[url]; rej(new Error('Could not load ' + url)); };
      document.head.appendChild(s);
    });
    return loaded[url];
  }
  return {
    xlsx: () => load('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').then(() => window.XLSX),
    fflate: () => load('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js').then(() => window.fflate),
    pptx: () => load('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js').then(() => window.PptxGenJS),
    pdf: () => load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(() => load('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')).then(() => window.jspdf.jsPDF),
  };
})();

const ImportService = (() => {
  /* Size limits in the browser. Text reports (CSV/TSV/TXT, also zipped as .zip/.gz) are STREAMED:
     read in chunks, never held whole in memory, so multi-GB files work. Excel files must be
     loaded whole by the spreadsheet library, so they keep a lower cap. */
  const MAX_TEXT_MB = 4096, MAX_EXCEL_MB = 200;
  const ALLOWED = /\.(csv|tsv|txt|xlsx|xls|zip|gz)$/i;
  const HEAD_ROWS = 1000;

  /* ---------- 1. read */
  async function readFile(file) {
    if (!ALLOWED.test(file.name)) throw new Error(t('imp.err.type'));
    if (/\.(xlsx|xls)$/i.test(file.name)) {
      if (file.size > MAX_EXCEL_MB * 1048576) throw new Error(t('imp.err.excelSize', { mb: MAX_EXCEL_MB }));
      const XLSX = await Libs.xlsx();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      const sheets = wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) })).filter(s => s.rows.length);
      if (!sheets.length) throw new Error(t('imp.err.empty'));
      return { kind: 'xlsx', sheets };
    }
    if (file.size > MAX_TEXT_MB * 1048576) throw new Error(t('imp.err.size', { mb: I18n.int(MAX_TEXT_MB, false) }));
    // streamed text report: read only the first rows now; validation streams the whole file later
    const head = [], rowNos = [];
    let chars = 0;
    for await (const [no, row] of streamRows(file)) {
      head.push(row); rowNos.push(no); chars += row.join(',').length + 1;
      if (head.length >= HEAD_ROWS) break;
    }
    if (!head.length) throw new Error(t('imp.err.empty'));
    const compressed = /\.(zip|gz)$/i.test(file.name);
    const approxRows = head.length < HEAD_ROWS ? head.length : compressed ? null : Math.round(file.size / (chars / head.length));
    return { kind: 'csv', streaming: true, file, approxRows, sheets: [{ name: innerName(file), rows: head, rowNos }] };
  }
  const innerName = f => f.name.replace(/\.(gz|zip)$/i, '');

  /* bytes of the report, decompressed on the fly for .gz (native) and .zip (fflate, streaming) */
  function byteStream(file, onBytes) {
    let read = 0;
    const counted = file.stream().pipeThrough(new TransformStream({ transform(chunk, c) { read += chunk.length; onBytes && onBytes(read); c.enqueue(chunk); } }));
    if (/\.gz$/i.test(file.name)) {
      if (typeof DecompressionStream === 'undefined') throw new Error(t('imp.err.noGzip'));
      return Promise.resolve(counted.pipeThrough(new DecompressionStream('gzip')));
    }
    if (/\.zip$/i.test(file.name)) return zipStream(counted);
    return Promise.resolve(counted);
  }
  async function zipStream(src) {
    const fflate = await Libs.fflate();
    const reader = src.getReader();
    const out = [];
    let picked = false, done = false, finished = false, error = null;
    const uz = new fflate.Unzip();
    uz.register(fflate.UnzipInflate);
    uz.onfile = f => {
      const base = f.name.split('/').pop();
      if (picked || !/\.(csv|tsv|txt)$/i.test(base) || base.startsWith('._')) return;
      picked = true;
      f.ondata = (err, chunk, final) => { if (err) error = err; else { if (chunk.length) out.push(chunk); if (final) finished = true; } };
      f.start();
    };
    return new ReadableStream({
      async pull(ctrl) {
        while (!out.length && !finished && !error && !done) {
          const r = await reader.read();
          if (r.done) { done = true; uz.push(new Uint8Array(0), true); }
          else uz.push(r.value, false);
        }
        if (error) return ctrl.error(error);
        if (out.length) return ctrl.enqueue(out.shift());
        if (!picked) return ctrl.error(new Error(t('imp.err.zipEmpty')));
        ctrl.close();
      },
      cancel() { reader.cancel(); },
    });
  }
  async function detectEncoding(file) {
    if (/\.(zip|gz)$/i.test(file.name)) return 'utf-8';
    const b = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    return (b[0] === 0xff && b[1] === 0xfe) || (b[0] === 0xfe && b[1] === 0xff) ? 'utf-16' : 'utf-8';
  }

  /* incremental CSV parser: quotes, escaped quotes and line breaks may span chunk boundaries */
  function csvParser() {
    let delim = null, row = [], field = '', q = false, pendingQuote = false, pendingCR = false, first = true;
    const out = [];
    function endRow() { row.push(field); field = ''; out.push(row); row = []; }
    return {
      feed(text, final) {
        if (first) { text = text.replace(/^﻿/, ''); first = false; }
        if (delim === null) {
          text = this._held + text; this._held = '';
          const line = text.split(/\r?\n/)[0] || '';
          if (!final && line.length === text.length && text.length < 65536) { this._held = text; return []; }
          delim = [',', ';', '\t', '|'].map(d => [d, line.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
        }
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (pendingCR) { pendingCR = false; if (c === '\n') continue; }
          if (pendingQuote) { pendingQuote = false; if (c === '"') { field += '"'; continue; } q = false; }
          if (q) {
            if (c === '"') { if (i + 1 < text.length) { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else pendingQuote = true; }
            else field += c;
          } else if (c === '"') q = true;
          else if (c === delim) { row.push(field); field = ''; }
          else if (c === '\n') endRow();
          else if (c === '\r') { endRow(); pendingCR = true; }
          else field += c;
        }
        if (final && (field !== '' || row.length)) endRow();
        return out.splice(0);
      },
      _held: '',
    };
  }

  /* async iterator of [fileRowNumber, row] over every non-blank row */
  async function* streamRows(file, onBytes) {
    const enc = await detectEncoding(file);
    const stream = (await byteStream(file, onBytes)).pipeThrough(new TextDecoderStream(enc));
    const reader = stream.getReader(), parser = csvParser();
    let no = 0;
    try {
      while (true) {
        const { value, done } = await reader.read();
        const rows = done ? parser.feed('', true) : parser.feed(value, false);
        for (const r of rows) { no++; if (r.length > 1 || r[0] !== '') yield [no, r]; }
        if (done) break;
      }
    } finally { reader.cancel().catch(() => { }); }
  }
  async function* dataRows(file, headerRowNo, onBytes) {
    for await (const [no, row] of streamRows(file, onBytes)) if (no > headerRowNo) yield [no, row];
  }

  function parseCSV(text) {
    const p = csvParser();
    return p.feed(text, true).filter(r => r.length > 1 || r[0] !== '');
  }

  /* ---------- 2–4. headers + mapping */
  const norm = h => String(h ?? '').toLowerCase()
    .replace(/\b(1|7|14|30)[\s-]*days?\b/g, '').replace(/\(#\)|\(\$\)|\(%\)/g, '')
    .replace(/[^a-z0-9]/g, '');
  function synonyms() {
    const extra = State.get().synonyms || {};
    return Object.fromEntries(Object.entries(Config.FIELD_SYNONYMS).map(([f, list]) => [f, [...list, ...(extra[f] || []).map(norm).filter(Boolean)]]));
  }
  function detectHeaderRow(rows) {
    const syn = new Set(Object.values(synonyms()).flat());
    let best = 0, bestScore = -1;
    for (let i = 0; i < Math.min(15, rows.length); i++) {
      const score = rows[i].filter(c => syn.has(norm(c))).length;
      if (score > bestScore) { best = i; bestScore = score; }
    }
    return best;
  }
  function autoMap(headers) {
    const syn = synonyms(), mapping = {}, confidence = {}, used = new Set();
    const nh = headers.map(norm);
    // pass 1: exact synonym, pass 2: contains
    for (const pass of [1, 2]) {
      for (const [field, list] of Object.entries(syn)) {
        if (mapping[field] != null) continue;
        for (let i = 0; i < nh.length; i++) {
          if (used.has(i) || !nh[i]) continue;
          const hit = pass === 1 ? list.includes(nh[i]) : list.some(s => s.length > 4 && (nh[i].includes(s) || (nh[i].length > 5 && s.includes(nh[i]))));
          if (hit && !Config.RECALCULATED.includes(nh[i])) { mapping[field] = i; confidence[field] = pass === 1 ? 'high' : 'medium'; used.add(i); break; }
        }
      }
    }
    // "Targeting" is a keyword column in targeting reports but targeting type elsewhere
    if (mapping.keyword == null && mapping.targeting != null && !/type/.test(nh[mapping.targeting])) { mapping.keyword = mapping.targeting; delete mapping.targeting; }
    const unmapped = headers.map((h, i) => ({ header: h, i, status: used.has(i) ? 'mapped' : Config.RECALCULATED.includes(nh[i]) ? 'recalculated' : 'ignored' })).filter(x => x.status !== 'mapped');
    return { mapping, confidence, unmapped };
  }
  const ASIN_RE = /^(B0[A-Z0-9]{8}|\d{9}[\dX])$/;
  /* content-based fixes: an 'Advertised product SKU' column full of ASINs is the ASIN */
  function refineMapping(m, rows) {
    const mapping = m.mapping;
    if (mapping.asin == null && mapping.sku != null) {
      const vals = rows.slice(0, 500).map(r => String(r[mapping.sku] ?? '').trim().toUpperCase()).filter(Boolean);
      if (vals.length && vals.filter(v => ASIN_RE.test(v)).length / vals.length >= 0.8) {
        mapping.asin = mapping.sku; delete mapping.sku;
        m.confidence.asin = m.confidence.sku || 'medium'; delete m.confidence.sku;
      }
    }
    return m;
  }
  function detectSource(mapping, sheetName = '', fileName = '') {
    const has = f => mapping[f] != null;
    const txt = (sheetName + ' ' + fileName).toLowerCase();

        range: k.range ? I18n.range(k.range[0], k.range[1]) : '', cmp: k.cmpRange ? I18n.range(k.cmpRange[0], k.cmpRange[1]) : t('cmp.none'),
        filters: App.filterSummary(), generated: new Date().toLocaleString(I18n.locale()),
      },
      kpis: k, periods, lifetime: { label: t('nav.lifetime'), m: life.total?.v || {} }, tables, insights: Insights.build(),
    };
  }
  const KPI_KEYS = ['adSpend', 'adSales', 'roas', 'acos', 'impressions', 'clicks', 'orders', 'ctr'];

  /* ---------- Excel */
  const XFMT = { currency: '#,##0.00', currency2: '#,##0.00', int: '#,##0', pct: '0.00"%"', ratio: '0.00' };
  async function xlsx() {
    App.busy(t('exp.building', { what: 'Excel' }));
    try {
      const XLSX = await Libs.xlsx(); const P = collect(); const wb = XLSX.utils.book_new();
      const addSheet = (name, aoa, fmts = {}, widths) => {
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        Object.entries(fmts).forEach(([col, z]) => { for (let r = 1; r < aoa.length; r++) { const ref = XLSX.utils.encode_cell({ r, c: +col }); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = z; } });
        ws['!cols'] = (widths || aoa[0].map((_, i) => i === 0 ? 34 : 14)).map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
      };
      // Summary
      const S = [[t('exp.report'), t('app.title')], [t('exp.dataset'), P.meta.demo ? t('demo.label') : t('exp.imported')], [t('hdr.marketplace'), P.meta.marketplace + ' (' + P.meta.currency + ')'],
        [t('exp.period'), P.meta.range], [t('exp.comparison'), P.meta.cmp], [t('exp.filters'), P.meta.filters || t('common.none')], [t('exp.generated'), P.meta.generated], [],
        [t('col.metric'), t('exp.current'), t('exp.previous'), t('exp.change')]];
      const V = P.kpis.cur.total?.v || {}, PV = P.kpis.prev?.total?.v;
      Object.keys(Config.METRICS).forEach(key => { const ch = PV ? Metrics.change(key, V[key], PV[key]) : null; S.push([I18n.metricLabel(key), TableDefs.rnd(key, V[key]) ?? 'N/A', PV ? (TableDefs.rnd(key, PV[key]) ?? 'N/A') : '', ch ? +(ch.pct / 100).toFixed(4) : '']); });
      const ws = XLSX.utils.aoa_to_sheet(S); ws['!cols'] = [{ wch: 30 }, { wch: 22 }, { wch: 22 }, { wch: 12 }];
      for (let r = 9; r < S.length; r++) { const ref = XLSX.utils.encode_cell({ r, c: 3 }); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '0.0%'; }
      XLSX.utils.book_append_sheet(wb, ws, t('exp.summary').slice(0, 31));
      // Period sheets (value + change columns)
      const periodSheet = (name, pr, withDelta = true) => {
        const cols = TableDefs.defs.period('delta');
        const head = [cols[0].label]; const fm = {};
        cols.slice(1).forEach(c => { fm[head.length] = XFMT[Config.METRICS[c.metric].fmt]; head.push(c.label); if (withDelta) { fm[head.length] = '0.0%'; head.push(c.label + ' Δ'); } });
        const aoa = [head, ...pr.rows.map(r => { const row = [r.label + (r.sub ? ` (${r.sub})` : '')]; cols.slice(1).forEach(c => { row.push(TableDefs.rnd(c.metric, r.m[c.metric]) ?? 'N/A'); if (withDelta) { const ch = r.prev ? Metrics.change(c.metric, r.m[c.metric], r.prev[c.metric]) : null; row.push(ch ? +(ch.pct / 100).toFixed(4) : ''); } }); return row; })];
        addSheet(name, aoa, fm);
      };
      periodSheet(t('nav.wow'), P.periods.week); periodSheet(t('nav.mom'), P.periods.month); periodSheet(t('nav.qoq'), P.periods.quarter); periodSheet(t('nav.yoy'), P.periods.year);
      const lcols = TableDefs.defs.lifetime();
      const lfm = {}; lcols.slice(1).forEach((c, i) => { lfm[i + 1] = XFMT[Config.METRICS[c.metric].fmt]; });
      addSheet(t('nav.lifetime'), [lcols.map(c => c.label), [t('nav.lifetime'), ...lcols.slice(1).map(c => TableDefs.rnd(c.metric, P.lifetime.m[c.metric]) ?? 'N/A')]], lfm);
      // dimension sheets
      Object.values(P.tables).forEach(tb => {
        const head = [], fm = {};
        tb.cols.forEach(c => {
          if (c.kind === 'metric' && Config.METRICS[c.metric]) fm[head.length] = XFMT[Config.METRICS[c.metric].fmt];
          else if (c.key.startsWith('g_')) fm[head.length] = '0.0"%"';
          head.push(c.label);
          if (c.sub === 'share') { fm[head.length] = '0.0"%"'; head.push(c.label + ' % ' + t('common.ofTotal')); }
        });
        const aoa = [head, ...tb.rows.map(r => { const row = []; tb.cols.forEach(c => { const v = TableDefs.exportValue(c, r); row.push(v == null ? (c.kind === 'metric' ? 'N/A' : '') : v); if (c.sub === 'share') row.push(TableDefs.rnd(null, r.share?.[c.metric]) ?? ''); }); return row; })];
        addSheet(tb.title, aoa, fm);
      });
      addSheet(t('nav.insights'), [[t('ins.kind'), t('ins.observation'), t('ins.recommendation')], ...P.insights.map(i => [t('kind.' + i.kind), i.obs, i.rec || ''])], {}, [16, 90, 90]);
      addSheet(t('exp.definitions'), [[t('col.metric'), t('exp.formula'), t('exp.direction')], ...Object.keys(Config.METRICS).map(k => [I18n.metricLabel(k), t('def.' + k), t('dir.' + Config.metricDirection[k])])], {}, [30, 70, 14]);
      const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      await save(baseName() + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { App.toast(t('toast.exportFailed', { reason: e.message }), 'error'); console.error(e); }
    finally { App.busy(false); }
  }

  /* ---------- PowerPoint */
  const PX = { ink: '16233D', muted: '67758D', blue: '2469E8', purple: '6C46D9', line: 'DFE7F1', canvas: 'EEF3F9', green: '168456', red: 'D54955', soft: 'F7FAFF' };
  function deltaRun(key, cur, prev, size = 8) {
    const ch = prev ? Metrics.change(key, cur, prev) : null;
    if (!ch) return { text: '—', options: { color: PX.muted, fontSize: size } };
    return { text: (ch.flat ? '' : ch.up ? '↑ ' : '↓ ') + I18n.delta(ch.pct), options: { color: ch.tone === 'good' ? PX.green : ch.tone === 'bad' ? PX.red : PX.muted, fontSize: size } };
  }
  async function pptx() {
    App.busy(t('exp.building', { what: 'PowerPoint' }));

      const Pptx = await Libs.pptx(); const P = collect();

      const font = 'Calibri';

        s.addText(kicker.toUpperCase(), { x: 0.5, y: 0.3, w: 9, h: 0.3, fontFace: font, fontSize: 10, bold: true, color: PX.blue, charSpacing: 3 });
        s.addText(title, { x: 0.5, y: 0.58, w: 10, h: 0.55, fontFace: font, fontSize: 24, bold: true, color: PX.ink });
        s.addText(`${P.meta.marketplace} · ${P.meta.range}${P.meta.demo ? ' · ' + t('demo.label') : ''}`, { x: 7.8, y: 0.3, w: 5.03, h: 0.3, fontFace: font, fontSize: 9, color: P.meta.demo ? PX.red : PX.muted, align: 'right' });
        s.addText(t('exp.footer', { date: P.meta.generated }), { x: 0.5, y: 7.1, w: 12.3, h: 0.25, fontFace: font, fontSize: 8, color: PX.muted });
        return s;
      };
      const V = P.kpis.cur.total?.v || {}, PV = P.kpis.prev?.total?.v;
      // 1 Executive summary
      let s = frame(t('ppt.exec'), t('app.eyebrow'));
      s.addText([{ text: t('exp.period') + ': ', options: { bold: true } }, { text: P.meta.range + '   ' }, { text: t('exp.comparison') + ': ', options: { bold: true } }, { text: P.meta.cmp }], { x: 0.5, y: 1.25, w: 12.3, h: 0.3, fontFace: font, fontSize: 11, color: PX.muted });
      if (P.meta.filters) s.addText(t('exp.filters') + ': ' + P.meta.filters, { x: 0.5, y: 1.55, w: 12.3, h: 0.3, fontFace: font, fontSize: 10, color: PX.muted });
      ['adSales', 'adSpend', 'roas', 'acos'].forEach((k, i) => {
        const x = 0.5 + i * 3.1;
        s.addShape(deck.ShapeType.roundRect, { x, y: 2.0, w: 2.9, h: 1.35, fill: { color: PX.soft }, line: { color: PX.line }, rectRadius: 0.08 });
        s.addText(I18n.metricLabel(k).toUpperCase(), { x: x + 0.2, y: 2.1, w: 2.5, h: 0.3, fontFace: font, fontSize: 9, bold: true, color: PX.muted });
        s.addText([{ text: I18n.metric(k, V[k]), options: { fontSize: 26, bold: true, color: PX.ink, breakLine: true } }, deltaRun(k, V[k], PV?.[k], 11)], { x: x + 0.2, y: 2.4, w: 2.5, h: 0.85, fontFace: font, valign: 'top' });
      });
      s.addText(t('ppt.keyFindings'), { x: 0.5, y: 3.65, w: 12, h: 0.35, fontFace: font, fontSize: 14, bold: true, color: PX.ink });
      s.addText(P.insights.slice(0, 5).map(i => ({ text: i.obs, options: { bullet: true, breakLine: true } })), { x: 0.5, y: 4.05, w: 12.3, h: 2.9, fontFace: font, fontSize: 12, color: '3B4B64', valign: 'top', paraSpaceAfter: 6 });
      // 2 KPI performance
      s = frame(t('ppt.kpi'), t('nav.overview'));
      KPI_KEYS.forEach((k, i) => {
        const x = 0.5 + (i % 4) * 3.1, y = 1.4 + Math.floor(i / 4) * 1.75;
        s.addShape(deck.ShapeType.roundRect, { x, y, w: 2.9, h: 1.55, fill: { color: 'FFFFFF' }, line: { color: PX.line }, rectRadius: 0.08 });
        s.addText(I18n.metricLabel(k).toUpperCase(), { x: x + 0.2, y: y + 0.12, w: 2.5, h: 0.3, fontFace: font, fontSize: 9, bold: true, color: PX.muted });
        s.addText([{ text: I18n.metric(k, V[k]), options: { fontSize: 28, bold: true, color: PX.ink, breakLine: true } }, deltaRun(k, V[k], PV?.[k], 11)], { x: x + 0.2, y: y + 0.45, w: 2.5, h: 0.95, fontFace: font, valign: 'top' });
      });
      s.addText(t('ppt.vs', { cmp: P.meta.cmp }), { x: 0.5, y: 5.1, w: 12, h: 0.3, fontFace: font, fontSize: 10, color: PX.muted });
      // 3-4 WoW / MoM
      const periodSlide = (title, kicker, pr) => {
        const s = frame(title, kicker);
        const rows = [...pr.rows].reverse();
        if (rows.length) s.addChart(deck.ChartType.bar, [
          { name: I18n.metricLabel('adSpend'), labels: rows.map(r => r.label), values: rows.map(r => r.m.adSpend || 0) },
          { name: I18n.metricLabel('adSales'), labels: rows.map(r => r.label), values: rows.map(r => r.m.adSales || 0) }],
          { x: 0.5, y: 1.3, w: 12.3, h: 2.6, barDir: 'col', barGapWidthPct: 60, chartColors: ['2F7BF5', '5B2BC0'], showLegend: true, legendPos: 't', legendFontSize: 9, catAxisLabelFontSize: 8, valAxisLabelFontSize: 8, valGridLine: { color: 'E5EBF3', size: 0.5 }, valAxisLabelFormatCode: '#,##0' });
        const keys = ['adSpend', 'adSales', 'roas', 'acos', 'orders', 'units', 'ctr', 'cvr'];
        const head = [t('col.period'), ...keys.map(k => I18n.metricLabel(k))].map(h => ({ text: h, options: { bold: true, color: PX.muted, fill: { color: 'FBFCFE' }, fontSize: 8 } }));
        const body = pr.rows.slice(0, 6).map(r => [{ text: r.label, options: { bold: true, color: PX.ink } }, ...keys.map(k => ({ text: [{ text: I18n.metric(k, r.m[k]), options: { breakLine: true, color: '40516C' } }, deltaRun(k, r.m[k], r.prev?.[k], 7)], options: { align: 'right' } }))]);
        s.addTable([head, ...body], { x: 0.5, y: 4.05, w: 12.3, fontFace: font, fontSize: 9, border: { type: 'solid', color: PX.line, pt: 0.5 }, colW: [1.9, ...keys.map(() => 1.3)], rowH: 0.42, valign: 'middle' });
        return s;
      };
      periodSlide(t('ppt.wow'), t('nav.wow'), P.periods.week);
      periodSlide(t('ppt.mom'), t('nav.mom'), P.periods.month);
      // 5-9 dimension slides
      const dimSlide = (tb, title, kicker, keys, chart = true, limit = 10) => {
        const s = frame(title, kicker);
        const rows = tb.rows.slice(0, limit);
        let y = 1.3;
        if (chart && rows.length) {
          const cr = rows.slice(0, 8);
          s.addChart(deck.ChartType.bar, [
            { name: I18n.metricLabel('adSpend'), labels: cr.map(r => r.id.slice(0, 28)), values: cr.map(r => r.m.adSpend || 0) },
            { name: I18n.metricLabel('adSales'), labels: cr.map(r => r.id.slice(0, 28)), values: cr.map(r => r.m.adSales || 0) }],
            { x: 0.5, y, w: 12.3, h: 2.4, barDir: 'bar', barGapWidthPct: 50, chartColors: ['2F7BF5', '5B2BC0'], showLegend: true, legendPos: 't', legendFontSize: 9, catAxisLabelFontSize: 8, valAxisLabelFontSize: 8, catAxisOrientation: 'maxMin', valAxisLabelFormatCode: '#,##0' });
          y = 3.85;
        }
        const first = tb.cols[0];
        const head = [first.label, ...keys.map(k => I18n.metricLabel(k))].map(h => ({ text: h, options: { bold: true, color: PX.muted, fill: { color: 'FBFCFE' }, fontSize: 8 } }));
        const body = rows.slice(0, chart ? 7 : 12).map(r => [{ text: String(r.id).slice(0, 42), options: { bold: true, color: PX.ink } }, ...keys.map(k => {
          const main = { text: I18n.metric(k, r.m[k]), options: { color: '40516C', breakLine: (k === 'adSpend' || k === 'adSales') } };
          return { text: (k === 'adSpend' || k === 'adSales') && r.share[k] != null ? [main, { text: I18n.pct(r.share[k], 1), options: { color: PX.muted, fontSize: 7 } }] : [main], options: { align: 'right' } };
        })]);
        s.addTable([head, ...body], { x: 0.5, y, w: 12.3, fontFace: font, fontSize: 9, border: { type: 'solid', color: PX.line, pt: 0.5 }, colW: [3.1, ...keys.map(() => 9.2 / keys.length)], rowH: chart ? 0.4 : 0.38, valign: 'middle' });
      };
      const K = ['adSpend', 'adSales', 'roas', 'acos', 'orders', 'cvr', 'cpc', 'ctr'];
      dimSlide(P.tables.portfolio, t('ppt.portfolio'), t('nav.portfolio'), K);
      dimSlide(P.tables.campaign, t('ppt.campaign'), t('nav.campaigns'), K, false);
      dimSlide(P.tables.placement, t('ppt.placement'), t('nav.placements'), K);
      dimSlide(P.tables.keyword, t('ppt.keyword'), t('nav.keywords'), K, false);
      dimSlide(P.tables.asin, t('ppt.asin'), t('nav.asins'), K, false);
      // 10 insights
      s = frame(t('ppt.insights'), t('nav.insights'));
      s.addText(t('ins.observations'), { x: 0.5, y: 1.3, w: 6, h: 0.35, fontFace: font, fontSize: 13, bold: true, color: PX.ink });
      s.addText(P.insights.slice(0, 7).map(i => ({ text: i.obs, options: { bullet: true, breakLine: true } })), { x: 0.5, y: 1.7, w: 6.4, h: 5.2, fontFace: font, fontSize: 11, color: '3B4B64', valign: 'top', paraSpaceAfter: 6 });
      s.addShape(deck.ShapeType.roundRect, { x: 7.2, y: 1.3, w: 5.6, h: 5.6, fill: { color: 'F4F2FF' }, line: { color: 'DBE7FB' }, rectRadius: 0.1 });
      s.addText(t('ins.recommendations'), { x: 7.45, y: 1.45, w: 5.1, h: 0.35, fontFace: font, fontSize: 13, bold: true, color: PX.purple });
      const recs = [...new Set(P.insights.filter(i => i.rec).map(i => i.rec))].slice(0, 6);
      s.addText(recs.length ? recs.map(r => ({ text: r, options: { bullet: true, breakLine: true } })) : t('ins.noRecs'), { x: 7.45, y: 1.85, w: 5.1, h: 4.9, fontFace: font, fontSize: 11, color: '3B4B64', valign: 'top', paraSpaceAfter: 6 });
      const out = await deck.write({ outputType: 'arraybuffer' });
      await save(baseName() + '.pptx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }));
    } catch (e) { App.toast(t('toast.exportFailed', { reason: e.message }), 'error'); console.error(e); }
    finally { App.busy(false); }
  }

  /* ---------- PDF (latin fonts: Hindi / Japanese labels fall back to English) */
  async function pdf() {
    App.busy(t('exp.building', { what: 'PDF' }));
    const lang = I18n.getLang(), swap = ['hi', 'ja'].includes(lang);
    try {
      const jsPDF = await Libs.pdf();
      if (swap) I18n.setLang('en');
      const P = collect();
      const clean = s => String(s ?? '').replace(/₹/g, 'Rs ').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x00-\xFF€]/g, '');
      const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      const header = (title, kicker) => {
        doc.setFillColor(36, 105, 232); doc.rect(0, 0, W, 5, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(36, 105, 232); doc.text(clean(kicker.toUpperCase()), 36, 30);
        doc.setFontSize(18); doc.setTextColor(22, 35, 61); doc.text(clean(title), 36, 52);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(103, 117, 141);
        doc.text(clean(`${P.meta.marketplace} · ${P.meta.range} · vs ${P.meta.cmp}${P.meta.demo ? ' · ' + t('demo.label') : ''}`), W - 36, 30, { align: 'right' });
      };
      const V = P.kpis.cur.total?.v || {}, PV = P.kpis.prev?.total?.v;
      header(t('ppt.exec'), t('app.eyebrow'));
      KPI_KEYS.forEach((k, i) => {
        const x = 36 + (i % 4) * ((W - 72) / 4), y = 72 + Math.floor(i / 4) * 70, w = (W - 72) / 4 - 10;
        doc.setDrawColor(223, 231, 241); doc.roundedRect(x, y, w, 60, 6, 6, 'S');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(117, 131, 154); doc.text(clean(I18n.metricLabel(k).toUpperCase()), x + 10, y + 15);
        doc.setFontSize(16); doc.setTextColor(25, 41, 70); doc.text(clean(I18n.metric(k, V[k])), x + 10, y + 36);
        const ch = PV ? Metrics.change(k, V[k], PV[k]) : null;
        if (ch) { const c = ch.tone === 'good' ? [22, 132, 86] : ch.tone === 'bad' ? [213, 73, 85] : [113, 128, 150]; doc.setFontSize(8); doc.setTextColor(...c); doc.text((ch.up ? '+' : '-') + I18n.delta(ch.pct), x + 10, y + 50); }
      });
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(22, 35, 61); doc.text(clean(t('ppt.keyFindings')), 36, 228);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(59, 75, 100);
      let y = 246;
      P.insights.slice(0, 8).forEach(i => { const lines = doc.splitTextToSize('• ' + clean(i.obs), W - 72); doc.text(lines, 36, y); y += lines.length * 12 + 4; });
      const tableOpts = { theme: 'grid', styles: { font: 'helvetica', fontSize: 7, cellPadding: 4, lineColor: [223, 231, 241], textColor: [64, 81, 108] }, headStyles: { fillColor: [251, 252, 254], textColor: [108, 123, 146], fontStyle: 'bold' }, margin: { left: 36, right: 36, top: 70 } };
      const periodPage = (title, kicker, pr) => {
        doc.addPage(); header(title, kicker);
        const keys = ['adSpend', 'adSales', 'impressions', 'clicks', 'ctr', 'cpc', 'orders', 'units', 'cvr', 'acos', 'roas'];
        const deltas = [];
        const body = pr.rows.map((r, ri) => { deltas[ri] = keys.map(k => r.prev ? Metrics.change(k, r.m[k], r.prev[k]) : null); return [clean(r.label + (r.sub ? '\n' + r.sub : '')), ...keys.map(k => clean(I18n.metric(k, r.m[k])) + '\n ')]; });
        doc.autoTable({ ...tableOpts, startY: 70, head: [[t('col.period'), ...keys.map(k => clean(I18n.metricLabel(k)))]], body, columnStyles: Object.fromEntries(keys.map((_, i) => [i + 1, { halign: 'right' }])),
          didDrawCell: d => { if (d.section !== 'body' || d.column.index === 0) return; const ch = deltas[d.row.index]?.[d.column.index - 1]; if (!ch) return; const c = ch.tone === 'good' ? [22, 132, 86] : ch.tone === 'bad' ? [213, 73, 85] : [113, 128, 150]; doc.setFontSize(6.5); doc.setTextColor(...c); doc.text((ch.up ? '+' : '-') + I18n.delta(ch.pct), d.cell.x + d.cell.width - 4, d.cell.y + d.cell.height - 4, { align: 'right' }); } });
      };
      periodPage(t('ppt.wow'), t('nav.wow'), P.periods.week);
      periodPage(t('ppt.mom'), t('nav.mom'), P.periods.month);
      const dimPage = (tb, title, kicker) => {
        doc.addPage(); header(title, kicker);
        const cols = tb.cols.filter(c => !['campaignType', 'budget', 'budgetUtil', 'tosIs', 'searchIs', 'title', 'category', 'brand', 'keywordType'].includes(c.key)).slice(0, 16);
        doc.autoTable({ ...tableOpts, startY: 70, head: [cols.map(c => clean(c.label))],
          body: tb.rows.slice(0, 40).map(r => cols.map(c => { const v = TableDefs.exportValue(c, r); if (c.kind !== 'metric') return clean(v ?? ''); if (c.key.startsWith('g_')) return v == null ? '-' : (v >= 0 ? '+' : '') + I18n.delta(v); const main = clean(I18n.metric(c.metric, v)); return c.sub === 'share' && r.share?.[c.metric] != null ? main + '\n' + I18n.pct(r.share[c.metric], 1) : main; })),
          columnStyles: Object.fromEntries(cols.map((c, i) => [i, { halign: c.kind === 'metric' ? 'right' : 'left' }])) });
      };
      dimPage(P.tables.portfolio, t('ppt.portfolio'), t('nav.portfolio'));
      dimPage(P.tables.campaign, t('ppt.campaign'), t('nav.campaigns'));
      dimPage(P.tables.placement, t('ppt.placement'), t('nav.placements'));
      dimPage(P.tables.keyword, t('ppt.keyword'), t('nav.keywords'));
      dimPage(P.tables.asin, t('ppt.asin'), t('nav.asins'));
      doc.addPage(); header(t('ppt.insights'), t('nav.insights'));
      doc.autoTable({ ...tableOpts, startY: 70, head: [[t('ins.kind'), t('ins.observation'), t('ins.recommendation')]], body: P.insights.map(i => [clean(t('kind.' + i.kind)), clean(i.obs), clean(i.rec || '-')]), columnStyles: { 0: { cellWidth: 70 } }, styles: { ...tableOpts.styles, fontSize: 8 } });
      const pages = doc.getNumberOfPages();
      for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setFontSize(7); doc.setTextColor(150, 160, 175); doc.text(clean(t('exp.footer', { date: P.meta.generated })) + `  ·  ${p}/${pages}`, 36, doc.internal.pageSize.getHeight() - 18); }
      if (swap) I18n.setLang(lang);
      await save(baseName() + '.pdf', doc.output('blob'));
    } catch (e) { if (swap) I18n.setLang(lang); App.toast(t('toast.exportFailed', { reason: e.message }), 'error'); console.error(e); }
    finally { App.busy(false); }
  }

  /* CSV of the current page's primary report */
  function currentCSV() {
    const id = document.querySelector('.dt')?.id?.slice(3);
    if (id) return DataTable.exportCSV(id);
    const P = TableDefs.periodRows('week', State.get().periodCounts.week), cols = TableDefs.defs.period('delta');
    csv(baseName() + '-wow.csv', cols.map(c => c.label), P.rows.map(r => cols.map(c => TableDefs.exportValue(c, r) ?? '')));
  }
  return { save, csv, xlsx, pptx, pdf, currentCSV };
})();

/* ===== components/import-wizard.js ===== */
/* ==========================================================================
   IMPORT WIZARD — the 10-step upload workflow UI on top of ImportService.
   ========================================================================== */
const ImportWizard = (() => {
  const STEPS = ['upload', 'detect', 'headers', 'map', 'preview', 'validate', 'review', 'import', 'build', 'refresh'];
  let W = null; // wizard state
  let working = false;

  function fresh() { return { step: 0, screen: 'upload', file: null, parsed: null, sheetIdx: 0, headerRow: 0, headers: [], rows: [], mapping: {}, confidence: {}, unmapped: [], settings: {}, source: 'campaign', result: null, error: null, progress: 0, replaceDemo: DataStore.isDemo, replaceIds: [] }; }
  function open() { if (!State.can('import')) return App.toast(t('role.noImport'), 'error'); W = fresh(); draw(); }
  function close() { if (working) return; W = null; App.modal(null); }

  function stepper() {
    return `<ol class="stepper">${STEPS.map((s, i) => `<li class="${i < W.step ? 'done' : i === W.step ? 'on' : ''}"><span>${i < W.step ? icon('check') : i + 1}</span>${esc(t('imp.step.' + s))}</li>`).join('')}</ol>`;
  }
  function frame(body, foot = '') {
    return `<div class="wiz-head"><div><div class="report-kicker">${esc(t('imp.kicker'))}</div><h2 class="report-title">${esc(t('imp.title'))}</h2></div><button type="button" class="icon-btn" data-wiz="close" aria-label="${esc(t('common.close'))}">${icon('x')}</button></div>
      ${stepper()}<div class="wiz-body">${W.error ? `<div class="notice error">${icon('error')}<span>${esc(W.error)}</span></div>` : ''}${body}</div>${foot ? `<div class="wiz-foot">${foot}</div>` : ''}`;
  }

  function draw() {
    if (!W) return;
    const s = W.screen;
    let html = '';
    if (s === 'upload') html = frame(`<label class="dropzone" id="dropzone" for="imp-file">${icon('upload', 'big')}<strong>${esc(t('imp.drop'))}</strong><span>${esc(Api.enabled ? t('api.dropSub', { mb: I18n.int(Api.limits.maxUploadMb || 2048, false) }) : t('imp.dropSub'))}</span><input type="file" id="imp-file" accept=".csv,.tsv,.txt,.xlsx,.xls,.zip,.gz" hidden></label>
      <div class="imp-help"><div><strong>${esc(t('imp.supported'))}</strong><p>${esc(t('imp.supportedList'))}</p></div><div><strong>${esc(t('imp.privacy'))}</strong><p>${esc(t('imp.privacyText'))}</p></div></div>
      <button type="button" class="link-btn" data-template>${esc(t('set.template'))}</button>`);
    if (s === 'reading') html = frame(`<div class="center-pad"><span class="spinner"></span><p id="up-msg">${esc(W.server ? t('api.uploading', { file: W.file.name, pct: 0 }) : t('imp.reading', { file: W.file.name }))}</p>${W.server ? '<div class="progress"><i id="up-bar" style="width:0%"></i></div>' : ''}</div>`);
    if (s === 'detect') html = frame(detectScreen(), `<button type="button" class="action-btn" data-wiz="back">${esc(t('common.back'))}</button><button type="button" class="action-btn export" data-wiz="to-map">${esc(t('imp.next.map'))}</button>`);
    if (s === 'map') html = frame(mapScreen(), `<button type="button" class="action-btn" data-wiz="to-detect">${esc(t('common.back'))}</button><button type="button" class="action-btn export" data-wiz="validate">${esc(t('imp.next.validate'))}</button>`);
    if (s === 'validating') html = frame(`<div class="center-pad"><span class="spinner"></span><p>${esc(t('imp.validating'))}</p>${W.server ? `<p class="fine">${esc(t('api.bigNote'))}</p>` : `<div class="progress"><i style="width:${Math.round(W.progress * 100)}%"></i></div><p class="fine"><span id="val-pct">${Math.round(W.progress * 100)}%</span>${W.parsed?.streaming ? ' · ' + esc(t('imp.streamNote')) : ''}</p>`}</div>`);
    if (s === 'review') html = frame(reviewScreen(), `<button type="button" class="action-btn" data-wiz="to-map">${esc(t('imp.back.map'))}</button><button type="button" class="action-btn export" data-wiz="commit" ${W.result.blocked ? 'disabled' : ''}>${esc(t('imp.next.import', { n: I18n.int(readyCount(), false) }))}</button>`);
    if (s === 'committing' || s === 'done') html = frame(doneScreen() + (s === 'committing' && W.server ? `<p class="fine">${esc(t('api.bigNote'))}</p>` : ''), s === 'done' ? `<button type="button" class="action-btn" data-wiz="another">${esc(t('imp.another'))}</button><button type="button" class="action-btn export" data-wiz="finish">${esc(t('imp.viewDash'))}</button>` : '');
    App.modal(html, 'wizard');
  }

  function detectScreen() {
    const P = W.parsed, sh = P.sheets[W.sheetIdx];

      <div class="det-card"><span class="lbl">${esc(t('imp.detected'))}</span><strong>${esc(t('source.' + det.source))}</strong><span class="fine">${det.bulk ? esc(t('imp.bulkDetected')) : esc(t('imp.detectedHint'))}</span></div>

      <label>${esc(t('imp.defaultAdType'))}<select id="w-adtype" class="period-select">${Object.keys(Config.AD_TYPES).map(a => `<option value="${a}" ${W.settings.adType === a ? 'selected' : ''}>${a} · ${esc(t('adType.' + a))}</option>`).join('')}</select><span class="fine">${esc(W.mapping.adType != null ? t('imp.fromColumn') : t('imp.noColumn'))}</span></label>
      <label>${esc(t('imp.defaultMk'))}<select id="w-mk" class="period-select"><option value="">${esc(t('imp.chooseMk'))}</option>${mkOpts.map(m => `<option value="${m}" ${W.settings.marketplace === m ? 'selected' : ''}>${m} · ${esc(Config.MARKETPLACES[m].name)} (${Config.MARKETPLACES[m].currency})</option>`).join('')}</select><span class="fine">${esc(W.mapping.marketplace != null || W.mapping.currency != null ? t('imp.fromColumn') : t('imp.mkRequired'))}</span></label>
